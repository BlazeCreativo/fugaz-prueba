<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0d18">
<title>FUGAZ · Noche en autopista</title>
<link rel="stylesheet" href="vendor/fuentes/fuentes.css">
<style>
  :root { --cian: #19c6d8; --naranja: #ff7a2a; --rojo: #ff3a30; --tinta: #eaf2fb; --gris: #8597aa; --fondo: #0a0d18; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--tinta); overflow: hidden;
    font-family: Overpass, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #juego { position: fixed; inset: 0; }
  .viñeta { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 52%, transparent 55%, rgba(0,0,0,0.55) 100%); }
  .titulo { font-family: "Saira Extra Condensed", sans-serif; font-weight: 800; letter-spacing: 0.02em; line-height: 0.9; }
  .mono { font-family: "Overpass Mono", monospace; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  [hidden] { display: none !important; }

  /* ---------------- HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; }
  #marcador { position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 8px); transform: translateX(-50%); text-align: center; }
  #puntos { font-size: clamp(40px, 9vw, 72px); text-shadow: 0 0 18px rgba(25,198,216,0.5); }
  #multCaja { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 2px; }
  #mult { font-size: 30px; color: var(--naranja); text-shadow: 0 0 14px rgba(255,122,42,0.7); min-width: 64px; transition: transform 0.12s; }
  #mult.pulso { transform: scale(1.35); }
  #comboBarra { width: 110px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
  #comboBarra i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--naranja), #ffd36a); }
  #tiempo { position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 12px); font-size: 32px; }
  #vidas { position: absolute; left: 14px; top: calc(env(safe-area-inset-top) + 18px); display: flex; gap: 6px; }
  #vidas i { width: 18px; height: 18px; border-radius: 4px; background: var(--cian); box-shadow: 0 0 10px var(--cian); }
  #vidas i.fuera { background: rgba(255,255,255,0.12); box-shadow: none; }
  #avisos { position: absolute; left: 0; right: 0; top: 34%; text-align: center; }
  .aviso { font-family: "Saira Extra Condensed", sans-serif; font-weight: 800; font-size: 42px; color: var(--tinta);
    text-shadow: 0 0 16px rgba(255,122,42,0.9); animation: sube 0.9s ease-out forwards; position: absolute; left: 0; right: 0; }
  .aviso.limite { font-size: 58px; color: #ffd36a; }
  .aviso.malo { color: var(--rojo); font-size: 32px; text-shadow: 0 0 12px rgba(255,58,48,0.8); }
  @keyframes sube { 0% { opacity: 0; transform: translateY(16px) scale(0.8); } 15% { opacity: 1; transform: translateY(0) scale(1.06); } 100% { opacity: 0; transform: translateY(-46px) scale(1); } }
  #flash { position: fixed; inset: 0; background: rgba(255,40,30,0.5); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  #relojesFuera { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 10px); transform: translateX(-50%);
    width: min(300px, 46vw); border-radius: 10px; opacity: 0.92; }
  #btnCam { position: absolute; right: 14px; top: calc(env(safe-area-inset-top) + 56px); width: 52px; height: 52px; border-radius: 50%;
    background: rgba(8,12,20,0.55); border: 2px solid rgba(255,255,255,0.25); pointer-events: auto; display: grid; place-items: center; }
  #btnCam svg { width: 26px; height: 26px; }
  #guia { position: absolute; left: 0; right: 0; bottom: 42%; text-align: center; font-size: 20px; color: var(--tinta); text-shadow: 0 2px 8px #000; }
  #guia .tecla { display: inline-block; min-width: 38px; padding: 4px 8px; margin: 0 3px; border: 2px solid rgba(255,255,255,0.7);
    border-radius: 7px; font-family: "Overpass Mono", monospace; font-weight: 700; background: rgba(0,0,0,0.35); }
  #guia .fila { margin: 6px 0; }
  .mano { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.85); margin: 0 auto 10px; animation: desliza 1.4s ease-in-out infinite; }
  @keyframes desliza { 0%,100% { transform: translateX(-46px); } 50% { transform: translateX(46px); } }
  @media (pointer: coarse) { #guia { bottom: 30%; } }
  #cuenta { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 22vmin; color: var(--tinta);
    text-shadow: 0 0 30px rgba(25,198,216,0.8); }
  #fps { position: fixed; left: 6px; bottom: 6px; font-size: 12px; color: #9fb; background: rgba(0,0,0,0.5); padding: 2px 6px; pointer-events: none; }

  /* ---------------- pantallas */
  .pantalla { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 16px);
    background: linear-gradient(180deg, rgba(5,7,14,0.55), rgba(5,7,14,0.88)); text-align: center; }
  #logo { font-size: clamp(76px, 22vw, 150px); color: var(--tinta); text-shadow: 0 0 30px rgba(25,198,216,0.55); }
  #logo small { display: block; font-size: 0.32em; color: var(--naranja); letter-spacing: 0.24em; text-shadow: 0 0 18px rgba(255,122,42,0.7); margin-top: 6px; }
  #record { color: var(--gris); font-size: 16px; }
  #record b { color: var(--tinta); }
  .grande { font-family: "Saira Extra Condensed", sans-serif; font-weight: 800; font-size: 40px; padding: 14px 58px; border-radius: 999px;
    background: var(--cian); color: #04121a; box-shadow: 0 0 30px rgba(25,198,216,0.55); letter-spacing: 0.04em; }
  .grande:focus-visible, .op button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .op { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .op span { color: var(--gris); font-size: 13px; width: 100%; letter-spacing: 0.12em; }
  .op button { padding: 7px 13px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); font-size: 15px; }
  .op button.si { background: rgba(25,198,216,0.25); border-color: var(--cian); }
  #ayuda { color: var(--gris); font-size: 14px; max-width: 520px; line-height: 1.5; }
  #otras { font-size: 13px; color: var(--gris); }
  #otras a { color: var(--gris); }
  #finTitulo { font-size: 46px; color: var(--naranja); }
  #finTitulo.malo { color: var(--rojo); }
  #finPuntos { font-size: clamp(64px, 18vw, 110px); }
  #finRecord { font-family: "Saira Extra Condensed", sans-serif; font-weight: 800; font-size: 26px; color: #04121a; background: #ffd36a;
    padding: 2px 14px; border-radius: 6px; }
  #finDatos { display: flex; gap: 18px; color: var(--gris); font-size: 14px; flex-wrap: wrap; justify-content: center; }
  #finDatos b { display: block; color: var(--tinta); font-size: 24px; font-family: "Saira Extra Condensed", sans-serif; }
  .fila-botones { display: flex; gap: 12px; align-items: center; }
  .secundario { padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,0.1); font-size: 17px; }
</style>
</head>
<body data-estado="inicio">
<canvas id="lienzo"></canvas>
<div id="juego"></div>
<div class="viñeta"></div>
<div id="flash"></div>

<div id="hud" hidden>
  <div id="vidas"><i></i><i></i><i></i></div>
  <div id="marcador">
    <div id="puntos" class="titulo">0</div>
    <div id="multCaja"><div id="mult" class="titulo">×1</div><div id="comboBarra"><i></i></div></div>
  </div>
  <div id="tiempo" class="titulo">90</div>
  <button id="btnCam" aria-label="Cambiar cámara"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="7" width="15" height="11" rx="2"/><path d="M17 11l5-3v9l-5-3z"/></svg></button>
  <div id="avisos"></div>
  <div id="guia" hidden>
    <div class="tactil"><div class="mano"></div><div class="fila">desliza para esquivar · abajo frena</div></div>
    <div class="teclas">
      <div class="fila"><span class="tecla">←</span><span class="tecla">→</span> esquiva &nbsp; <span class="tecla">↑</span> turbo &nbsp; <span class="tecla">↓</span> frena</div>
    </div>
    <div class="fila">roza coches = puntos ×</div>
  </div>
  <canvas id="relojesFuera" width="512" height="256" hidden></canvas>
</div>
<div id="cuenta" class="titulo" hidden></div>

<div id="inicio" class="pantalla">
  <div id="logo" class="titulo">FUGAZ<small>NOCHE EN AUTOPISTA</small></div>
  <div id="record"></div>
  <button id="jugar" class="grande" autofocus>JUGAR</button>
  <div class="op" id="opCamara"><span>CÁMARA</span><button data-v="cabina">Cabina</button><button data-v="fuera">Fuera</button></div>
  <div class="op" id="opControl"><span>CONTROL</span><button data-v="pulgar">Pulgar</button><button data-v="zonas">Dos zonas</button><button data-v="inclinar">Inclinar</button></div>
  <div class="op" id="opCalidad"><span>CALIDAD</span><button data-v="auto">Auto</button><button data-v="baja">Baja</button><button data-v="media">Media</button><button data-v="alta">Alta</button></div>
  <div id="ayuda"></div>
  <div id="otras">Otras versiones: <a href="v12/index.html">FUGAZ v12</a> · <a href="escape/index.html">Escape</a></div>
</div>

<div id="fin" class="pantalla" hidden>
  <div id="finTitulo" class="titulo">FIN DEL TIEMPO</div>
  <div id="finPuntos" class="titulo">0</div>
  <div id="finRecord" hidden>NUEVO RÉCORD</div>
  <div id="finDatos"></div>
  <div class="fila-botones"><button id="unamas" class="grande">UNA MÁS</button><button id="menu" class="secundario">Menú</button></div>
</div>
<div id="fps" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="noche/config.js"></script>
<script src="noche/pista.js"></script>
<script src="noche/mundo.js"></script>
<script src="noche/texturas.js"></script>
<script src="noche/escena.js"></script>
<script src="noche/relojes.js"></script>
<script src="noche/entrada.js"></script>
<script src="noche/main.js"></script>
</body>
</html>
