    n.turbo = oscFijo('sine', 2400, n.gTurbo);

    // Viento, retumbe del túnel, neumáticos y nitro.
    n.gViento = ganancia(0, n.volEfectos);
    n.filtroViento = filtro('bandpass', 300, 0.6, n.gViento);
    n.ruidoB.connect(n.filtroViento);
    n.gRetumbe = ganancia(0, n.volEfectos);
    n.ruidoB.connect(filtro('lowpass', 120, 0.8, n.gRetumbe));
    n.gNeum = ganancia(0, n.volEfectos);
    n.filtroNeum = filtro('bandpass', 1700, 5, n.gNeum);
    n.ruidoA.connect(n.filtroNeum);
    n.gNitro = ganancia(0, n.volEfectos);
    n.ruidoA.connect(filtro('bandpass', 900, 1.4, n.gNitro));
    // v9: roce de chapa contra el guardarraíl o contra otro coche: ruido áspero que tiembla.
    n.gRoce = ganancia(0, n.volEfectos);
    n.filtroRoce = filtro('bandpass', 2300, 3.5, n.gRoce);
    n.ruidoA.connect(n.filtroRoce);

    // Tres voces de sirena: triángulo + cuadrada → pasabajos → ganancia → paneo.
    n.sirenas = [];
    for (let i = 0; i < 3; i++) {
      const pan = hayPaneo() ? ctx.createStereoPanner() : null;
      if (pan) pan.connect(n.volEfectos);
      const g = ganancia(0, pan || n.volEfectos);
      const f = filtro('lowpass', 3500, 0.7, g);
      const tri = oscFijo('triangle', 650, f);
      const cuad = oscFijo('square', 650, ganancia(0.28, f));
      n.sirenas.push({ tri, cuad, f, g, pan, fase: i * 0.17, sig: -1 });
    }

    origen = ctx.currentTime + 0.1;
    paso = 0;
    paso0 = 0;
    aplicarVolumen(ctx.currentTime);
  }

  function aplicarVolumen(t) {
    ir(n.volMusica.gain, vol.musica * 0.55 * (pausa ? 0.5 : 1), t, 0.05);
    ir(n.volEfectos.gain, vol.efectos, t, 0.05);
    ir(n.volMotor.gain, vol.motor * 0.9, t, 0.05);
  }

  // --- Nodos de vida corta -------------------------------------------------

  function desconectar(x) {
    try { x.disconnect(); } catch (e) { /* ya estaba suelto */ }
  }

  function quitar(f) {
    const v = vivos.get(f);
    if (!v) return;
    vivos.delete(f);
    if (v.osc) oscVivos--;
  }

  // Al acabar la última fuente del grupo, se desconecta todo el grupo.
  function soltar(fuentes, nodos, inicio, fin, destino, musica) {
    let quedan = fuentes.length;
    let hecho = false;
    const limpiar = () => {
      if (hecho) return;
      hecho = true;
      for (const f of fuentes) {
        quitar(f);
        f.onended = null;
        desconectar(f);
      }
      for (const x of nodos) desconectar(x);
    };
    for (const f of fuentes) {
      const osc = esOsc.has(f);
      vivos.set(f, { inicio, fin, osc, destino, musica, limpiar });
      if (osc) oscVivos++;
      f.onended = () => {
        quitar(f);
        if (--quedan <= 0) limpiar();
      };
    }
  }

  // Red de seguridad por si algún navegador no dispara onended.
  function barrer(ahora) {
    if (ahora < proximoBarrido) return;
    proximoBarrido = ahora + 1;
    for (const v of vivos.values()) if (v.fin < ahora - 1) v.limpiar();
  }

  // Para en t las fuentes vivas que cumplan la condición (libera osciladores).
  function cortar(t, cumple) {
    for (const [f, v] of vivos) {
      if (v.fin <= t || !cumple(v)) continue;
      try {
        f.stop(t);
        v.fin = t;
      } catch (e) { /* ya parada */ }
    }
  }

  function hueco(nOsc, musica) {
    return OSC_FIJOS + oscVivos + nOsc <= (musica ? OSC_MUSICA : OSC_TECHO);
  }

  function oscCorto(tipo, f, t, fin) {
    const o = ctx.createOscillator();
    o.type = tipo;
    fijar(o.frequency, f, t);
    esOsc.add(o);
    o.start(t);
    o.stop(fin);
    return o;
  }

  function ruidoCorto(t, fin) {
    const f = ctx.createBufferSource();
    f.buffer = ruido;
    f.loop = true;
    f.start(t, Math.random() * 1.9);
    f.stop(fin);
    return f;
  }

  // Ataque lineal, sostén opcional y caída exponencial hasta MIN.
  function envolver(p, t, ataque, pico, sosten, caida) {
    fijar(p, 0, t);
    recta(p, pico, t + ataque);
    if (sosten > 0) fijar(p, pico, t + ataque + sosten);
    curva(p, MIN, t + ataque + sosten + caida);
  }

  function salida(g, destino, pan, t, nodos) {
    if (pan && hayPaneo()) {
      const p = ctx.createStereoPanner();
      fijar(p.pan, lim(pan, -1, 1), t);
      g.connect(p);
      p.connect(destino);
      nodos.push(p);
    } else {
      g.connect(destino);
    }
  }

  // Nota: oscilador(es) → [filtro] → envolvente → [paneo] → destino.
  // voces: desafinaciones en cents (una por oscilador); f2: barrido de tono;
  // fl: [tipo, frecuencia, Q, frecuencia final]; prio: la música usa el techo general.
  function tono(o) {
    const pico = num(o.pico, 0);
    if (!(pico > 0.0005)) return;
    const tope = o.musica && !o.prio;
    let voces = o.voces || [0];
    if (!hueco(voces.length, tope)) {
      if (voces.length > 1 && hueco(1, tope)) voces = [0];   // sin sitio: una sola voz
      else return;
    }
    const t = o.t;
    const ataque = o.ataque || 0.005;
    const sosten = o.sosten || 0;
    const caida = o.caida || 0.2;
    const fin = t + ataque + sosten + caida + 0.02;
    const nodos = [];
    const g = ctx.createGain();
    nodos.push(g);
    envolver(g.gain, t, ataque, pico, sosten, caida);
    salida(g, o.destino, o.pan, t, nodos);
    let entrada = g;
    if (o.fl) {
      const b = ctx.createBiquadFilter();
      b.type = o.fl[0];
      fijar(b.frequency, o.fl[1], t);
      fijar(b.Q, o.fl[2], t);
      if (o.fl[3]) curva(b.frequency, o.fl[3], fin - 0.02);
      b.connect(g);
      nodos.push(b);
      entrada = b;
    }
    const fuentes = [];
    for (const cents of voces) {
      const osc = oscCorto(o.tipo || 'sine', o.f, t, fin);
      if (cents) fijar(osc.detune, cents, t);
      if (o.f2) curva(osc.frequency, o.f2, t + (o.barrido || ataque + sosten + caida));
      osc.connect(entrada);
      fuentes.push(osc);
    }
    soltar(fuentes, nodos, t, fin, o.destino, !!o.musica);
  }

  // Ráfaga de ruido → filtro (con barrido opcional) → envolvente → [paneo].
  function rafaga(o) {
    const pico = num(o.pico, 0);
    if (!(pico > 0.0005)) return;
    const t = o.t;
    const ataque = o.ataque || 0.003;
    const sosten = o.sosten || 0;
    const fin = t + ataque + sosten + o.dur + 0.02;
    const src = ruidoCorto(t, fin);
    const b = ctx.createBiquadFilter();
    b.type = o.tipo || 'bandpass';
    fijar(b.frequency, o.f, t);
    fijar(b.Q, o.q || 1, t);
    if (o.f2) curva(b.frequency, o.f2, t + ataque + sosten + o.dur);
    const g = ctx.createGain();
    envolver(g.gain, t, ataque, pico, sosten, o.dur);
    src.connect(b);
    b.connect(g);
    const nodos = [b, g];
    salida(g, o.destino, o.pan, t, nodos);
    soltar([src], nodos, t, fin, o.destino, !!o.musica);
  }

  // --- Efectos puntuales ---------------------------------------------------

  function petardeo(t, a) {
    rafaga({ t, ataque: 0.001, dur: 0.025, pico: 1.4 * a, tipo: 'lowpass', f: 900, q: 0.8, destino: n.volMotor });
    tono({ f: 60, f2: 45, t, ataque: 0.002, caida: 0.09, pico: 0.5 * a, destino: n.volMotor });
  }

  // La ganancia del motor cae al 15 % durante 80 ms; en subida a fondo, petardeos.
  function cambio(t, d) {
    const g = n.cambio.gain;
    anular(g, t);
    ir(g, 0.15, t, 0.008);
    ir(g, 1, t + 0.08, 0.02);
    tono({ tipo: 'square', f: 3000, t, ataque: 0.001, caida: 0.004, pico: 0.02, destino: n.volMotor });
    if (d.subida && (d.petardea ?? (coche.acel > 0.6 && Math.random() < 0.6))) { // v9: lo decide quien pinta la llamarada
      const veces = Math.random() < 0.5 ? 2 : 3;
      let tp = t + 0.03;
      for (let i = 0; i < veces; i++) {
        petardeo(tp, 0.5 + 0.5 * Math.random());
        tp += 0.055 + 0.015 * Math.random();
      }
    }
  }

  function descarga(t) {
    rafaga({ t, ataque: 0.01, dur: 0.35, pico: 0.13, tipo: 'highpass', f: 1000, f2: 4000, q: 0.7, destino: n.volMotor });
  }

  // El «zas» de un casi-choque: el tirón que se tiene que oír.
  function zas(t, lado, fuerza) {
    rafaga({
      t, ataque: 0.01, dur: 0.3, pico: 0.35 * fuerza * RUIDO_BANDA, tipo: 'bandpass',
      f: 3200, f2: 500, q: 1.5, destino: n.volEfectos, pan: lado * 0.85,
    });
  }

  function enHueco(t) {
    zas(t, -1, 0.8);
    zas(t + 0.06, 1, 0.8);
    tono({ f: 1320, t: t + 0.03, caida: 0.25, pico: 0.05, destino: n.volEfectos });
    tono({ f: 1760, t: t + 0.05, caida: 0.25, pico: 0.04, destino: n.volEfectos });
  }

  function golpe(t, fuerza) {
    rafaga({ t, ataque: 0.002, dur: 0.18, pico: 1.6 * fuerza, tipo: 'lowpass', f: 400, q: 0.7, destino: n.volEfectos });
    tono({ f: 70, f2: 45, t, ataque: 0.003, caida: 0.2, pico: 0.6 * fuerza, destino: n.volEfectos });
  }

  // v7. Cuanto más lejos, más flojo y más apagado (el aire se come los agudos). d: metros hasta ti.
  const lejania = (d) => lim(1 - num(d, 0) / 260, 0.12, 1);

  function explosion(t, d, fuerza) {
    const k = lejania(d) * lim(fuerza, 0.5, 1.5, 1);
    const brillo = 300 + 2200 * lejania(d);
    tono({ f: 58, f2: 26, t, ataque: 0.004, caida: 1.3, pico: 0.9 * k, destino: n.volEfectos });
    rafaga({ t, ataque: 0.004, dur: 1.5, pico: 2.2 * k, tipo: 'lowpass', f: brillo, f2: 90, q: 0.7, destino: n.volEfectos });
    // Crepitar del fuego después del golpe.
    rafaga({ t: t + 0.08, ataque: 0.05, sosten: 0.3, dur: 0.9, pico: 0.12 * k, tipo: 'highpass', f: 2600, f2: 1600, q: 0.6, destino: n.volEfectos });
  }

  // Un coche que se prende: soplido que sube.
  function fuego(t, d) {
    rafaga({ t, ataque: 0.15, dur: 0.6, pico: 0.3 * lejania(d) * RUIDO_BANDA, tipo: 'bandpass', f: 250, f2: 1300, q: 0.9, destino: n.volEfectos });
  }

  // Patrulla fuera de combate: chapa, cristales y dos notas que suben (se celebra, como un hueco).
  function fueraDeCombate(t, d) {
    const k = lejania(d);
    golpe(t, 0.9 * k);
    rafaga({ t: t + 0.03, ataque: 0.002, dur: 0.35, pico: 0.18 * k, tipo: 'highpass', f: 4200, f2: 2500, q: 0.5, destino: n.volEfectos });
    tono({ tipo: 'square', f: 190, f2: 70, t, ataque: 0.002, caida: 0.25, pico: 0.08 * k, fl: ['lowpass', 900, 1], destino: n.volEfectos });
    [76, 83].forEach((m, i) => tono({ f: hz(m), t: t + 0.25 + i * 0.09, ataque: 0.004, caida: 0.3, pico: 0.08, destino: n.volEfectos }));
  }

  // v8. El taller: llave de impacto (tres ráfagas) y, al terminar, tres notas que suben.
  function taller(t) {
    for (let i = 0; i < 3; i++) rafaga({ t: t + i * 0.11, ataque: 0.002, dur: 0.07, pico: 0.35, tipo: 'bandpass', f: 1800, q: 2, destino: n.volEfectos });
  }
  function tallerHecho(t) {
    taller(t);
    [72, 76, 79].forEach((m, i) => tono({ f: hz(m), t: t + 0.35 + i * 0.08, ataque: 0.004, caida: 0.35, pico: 0.09, destino: n.volEfectos }));
  }
  // El interceptor: un rugido grave que se acerca.
  function interceptor(t) {
    tono({ tipo: 'sawtooth', f: 70, f2: 150, t, ataque: 0.08, sosten: 0.3, caida: 0.45, pico: 0.12, fl: ['lowpass', 500, 1.2, 1500], destino: n.volEfectos });
  }
  // Subes de rango: arpegio de cuatro notas.
  function subeRango(t) {
    [67, 71, 74, 79].forEach((m, i) => tono({ tipo: 'triangle', f: hz(m), t: t + i * 0.12, ataque: 0.005, sosten: i === 3 ? 0.3 : 0, caida: 0.4, pico: 0.1, destino: n.volEfectos }));
  }

  function pinchazo(t) {
    rafaga({ t, ataque: 0.001, dur: 0.06, pico: 0.8, tipo: 'lowpass', f: 2500, q: 0.5, destino: n.volEfectos });
    tono({ f: 90, f2: 40, t, ataque: 0.002, caida: 0.12, pico: 0.5, destino: n.volEfectos });
    rafaga({
      t: t + 0.03, ataque: 0.02, sosten: 0.4, dur: 0.8, pico: 0.12, tipo: 'highpass',
      f: 3500, f2: 2000, q: 0.6, destino: n.volEfectos,
    });
  }

  // Motor de arranque: cuadrada de 120 Hz con modulación de amplitud de 18 Hz.
  function arranque(t) {
    if (!hueco(2)) return;
    const fin = t + 0.52;
    const o = oscCorto('square', 120, t, fin);
    const lfo = oscCorto('sine', 18, t, fin);
    const am = ctx.createGain();
    fijar(am.gain, 0.5, t);
    const prof = ctx.createGain();
    fijar(prof.gain, 0.5, t);
    lfo.connect(prof);
    prof.connect(am.gain);
    const b = ctx.createBiquadFilter();
    b.type = 'lowpass';
    fijar(b.frequency, 1400, t);
    const g = ctx.createGain();
    envolver(g.gain, t, 0.02, 0.18, 0.4, 0.08);
    o.connect(am);
    am.connect(b);
    b.connect(g);
    g.connect(n.volMotor);
    soltar([o, lfo], [am, prof, b, g], t, fin, n.volMotor, false);
  }

  // El motor cae en 0,4 s bajando de tono; actualizar() no lo toca mientras.
  function apagar(t) {
    coche.apagadoHasta = t + 0.45;
    const f = coche.rpm / 30;
    for (const [nodo, k] of [[n.sierra, 1], [n.cuadrada, 2], [n.sub, 0.5], [n.admision, 3]]) {
      anular(nodo.frequency, t);
      ir(nodo.frequency, f * k * 0.35, t, 0.15);
    }
    anular(n.gMotor.gain, t);
    ir(n.gMotor.gain, 0, t, 0.1);
  }

  function nitroGolpe(t) {
    tono({ f: 80, f2: 40, t, caida: 0.3, pico: 0.6, destino: n.volEfectos });
    rafaga({
      t, ataque: 0.05, dur: 0.35, pico: 0.22 * RUIDO_BANDA, tipo: 'bandpass',
      f: 500, f2: 3000, q: 1.2, destino: n.volEfectos,
    });
  }

  function salidaPerfecta(t) {
    [74, 81, 86].forEach((m, i) => {
      tono({ f: hz(m), t: t + i * 0.06, ataque: 0.004, caida: 0.22, pico: 0.09, destino: n.volEfectos });
    });
    tono({ f: 110, f2: 50, t, ataque: 0.003, caida: 0.2, pico: 0.5, destino: n.volEfectos });
  }

  function salidaMala(t) {
    tono({
      tipo: 'sawtooth', f: 70, f2: 58, t, ataque: 0.01, sosten: 0.12, caida: 0.15, pico: 0.16,
      fl: ['lowpass', 500, 1], destino: n.volEfectos,
    });
  }

  function radioBip(t) {
    rafaga({ t, ataque: 0.004, dur: 0.056, pico: 0.12 * RUIDO_BANDA, tipo: 'bandpass', f: 1500, q: 1.5, destino: n.volEfectos });
    tono({
      tipo: 'square', f: 1150, t: t + 0.06, ataque: 0.003, sosten: 0.06, caida: 0.01, pico: 0.05,
      fl: ['bandpass', 1300, 1.5], destino: n.volEfectos,
    });
  }

  function pitido(t, f, sosten, caida, pico, tipo = 'sine') {
    tono({ tipo, f, t, ataque: 0.004, sosten, caida, pico, destino: n.volEfectos });
  }

  function detenido(t) {
    pitido(t, hz(65), 0.2, 0.35, 0.14, 'triangle');
    pitido(t + 0.32, hz(62), 0.3, 0.7, 0.14, 'triangle');
    capa('final');
  }

  const EVENTOS = {
    cambio: (t, d) => cambio(t, d),
    petardeo: (t) => petardeo(t, 0.8),
    casiChoque: (t, d) => zas(t, num(d.lado, 1) < 0 ? -1 : 1, lim(d.fuerza, 0, 1, 0.7)),
    hueco: (t) => enHueco(t),
    golpe: (t, d) => golpe(t, lim(d.fuerza, 0, 1, 0.6)),
    pinchazo: (t) => pinchazo(t),
    explosion: (t, d) => explosion(t, d.dist, num(d.fuerza, 1)),
    fuego: (t, d) => fuego(t, d.dist),
    fueraDeCombate: (t, d) => fueraDeCombate(t, d.dist),
    taller: (t) => taller(t),
    tallerHecho: (t) => tallerHecho(t),
    interceptor: (t) => interceptor(t),
    rango: (t) => subeRango(t),
    arranque: (t) => arranque(t),
    apagar: (t) => apagar(t),
    nitroGolpe: (t) => nitroGolpe(t),
    salidaPerfecta: (t) => salidaPerfecta(t),
    salidaMala: (t) => salidaMala(t),
    radioBip: (t) => radioBip(t),
    pit: (t) => {
      pitido(t, 1800, 0.07, 0.02, 0.045, 'square');
      pitido(t + 0.15, 1800, 0.07, 0.02, 0.045, 'square');
    },
    boton: (t) => tono({ f: 1100, f2: 700, t, ataque: 0.001, caida: 0.03, pico: 0.07, destino: n.volEfectos }),
    rebufo: (t) => {
      tono({ f: 95, f2: 50, t, ataque: 0.04, caida: 0.3, pico: 0.35, destino: n.volEfectos });
      rafaga({ t, ataque: 0.05, dur: 0.3, pico: 0.9, tipo: 'lowpass', f: 320, f2: 140, q: 0.8, destino: n.volEfectos });
    },
    tunelEntra: (t) => {
      rafaga({
        t, ataque: 0.06, dur: 0.5, pico: 0.25 * RUIDO_BANDA, tipo: 'bandpass',
        f: 600, f2: 180, q: 0.9, destino: n.volEfectos,
      });
      tono({ f: 55, t, ataque: 0.05, caida: 0.5, pico: 0.25, destino: n.volEfectos });
    },
    libre: () => euforia(),
    detenido: (t) => detenido(t),
    clave9: (t) => {
      pitido(t, 660, 0.1, 0.1, 0.1, 'triangle');
      pitido(t + 0.22, 660, 0.1, 0.1, 0.1, 'triangle');
    },
    cuenta: (t, d) => {
      if (num(d.n, 1) > 0) pitido(t, 880, 0.1, 0.08, 0.14);
      else pitido(t, 1760, 0.25, 0.3, 0.14);
    },
  };

  // --- Coche, entorno y sirenas (cada fotograma) ---------------------------

  function actualizarCoche(s, ahora) {
    const rpm = lim(s.rpm, 300, 9000, 800);
    const acel = lim(s.acelerador, 0, 1, 0);
    const v = lim(s.velocidad, 0, 150, 0);
    const vMax = lim(s.velMax, 1, 150, 60);
    const turbo = lim(s.turbo, 0, 1, 0);
    const derrape = lim(s.derrape, 0, 1, 0);
    const encendido = s.motorEncendido !== false;
    const oye = !pausa;
    coche.acel = acel;

    if (ahora >= coche.apagadoHasta) {
      // Ralentí con vaivén de ±30 rpm a 4 Hz.
      const ralenti = (1 - acel) * lim((1500 - rpm) / 700, 0, 1);
      coche.rpm = rpm + 30 * ralenti * Math.sin(2 * Math.PI * 4 * ahora);
      const f = ((coche.rpm * perfil.escala) / 60) * (perfil.cil / 2); // encendidos por segundo: rpm/60 × cilindros/2
      ir(n.sierra.frequency, f, ahora, 0.03);
      ir(n.cuadrada.frequency, 2 * f, ahora, 0.03);
      ir(n.sub.frequency, f / 2, ahora, 0.03);
      ir(n.admision.frequency, 3 * f, ahora, 0.03);
      ir(n.gAdmision.gain, 1.6 * acel * perfil.admision, ahora, 0.03);
      const corte = (350 + 3500 * acel * (0.4 + 0.6 * Math.min(rpm, 7800) / 7800)) * perfil.brillo;
      ir(n.filtroMotor.frequency, Math.min(corte, 12000), ahora, 0.03);
      ir(n.gMotor.gain, encendido && oye ? (0.1 + 0.22 * acel) * perfil.volumen : 0, ahora, 0.017);
    }

    // Marcha atrás: silbido de caja proporcional a la velocidad.
    ir(n.atras.frequency, Math.min(4000, 60 + 110 * v), ahora, 0.05);

    if (p.modo !== 'practica' && d.cobro > record) { // la práctica no cuenta para el récord
      record = d.cobro;
      guardarLS(LS.record, record);
      nuevo = true;
    }
    entrada.soltarTodo();
    entrada.mostrar(false);
    camaras.ponerModo('persecucion'); // para ver el coche en el plano final
    if (d.final === 'DETENIDO' || d.final === 'SINIESTRO') {
      audio.evento('detenido');
      hud.grande(d.final, 'rojo', 2.2, tReal);
      vibra('zumbido');
      if (d.final === 'SINIESTRO') camaras.sacudir(1);
    } else if (d.final === 'CLAVE9') {
      audio.evento('clave9');
      audio.musica.capa('final');
      hud.grande('CLAVE 9', 'ambar', 2.2, tReal);
      vibra('dobleTic');
    }
    const espera = (d.final === 'FANTASMA' || d.final === 'LIMPIO' ? juego.golpeMs : 0) + 1800;
    setTimeout(() => {
      if (juego.p !== p || juego.estado !== 'final') return;
      juego.estado = 'resultado';
      hud.mostrar(false);
      menu.final(d);
      if (d.carrera && d.carrera.sube) audio.evento('rango');
      if (nuevo && d.cobro > 0) menu.toast('¡Nuevo récord de botín!', 2500);
      mantenerPantalla(false);
    }, espera);
  }

  // ---------------------------------------------------------------- eventos de la partida
  const CARRIL_LIBRE = ['izquierdo', 'central', 'derecho'];
  const efecto = { k: 0, golpe: 0, pintado: false, opac: -1, borde: '' };

  function alEvento(ev, p) {
    const t = tReal;
    switch (ev.tipo) {
      case 'tiron':
        juego.hitStop = Math.max(juego.hitStop, 0.04);
        camaras.tiron(1);
        vibra('tic');
        break;
      case 'nitroGolpe':
        juego.hitStop = Math.max(juego.hitStop, 0.04);
        camaras.tiron(1.3);
        audio.evento('nitroGolpe');
        efecto.golpe = 1;
        vibra('dobleTic');
        break;
      case 'salidaPerfecta':
        audio.evento('salidaPerfecta');
        hud.grande('¡SALIDA PERFECTA!', 'bien', 1.3, t);
        camaras.tiron(1.2);
        efecto.golpe = Math.max(efecto.golpe, 0.8);
        vibra('dobleTic');
        break;
      case 'salidaMala':
        audio.evento('salidaMala');
        hud.aviso('Salida floja: suelta el freno con la aguja en verde', '', 2.2, t);
        break;
      case 'salidaPatina':
        audio.evento('salidaMala');
        hud.aviso('Patina: soltaste el freno tarde', '', 1.8, t);
        break;
      case 'tirachinas':
        camaras.tiron(0.8);
        audio.evento('petardeo');
        hud.grande('¡TIRACHINAS!', 'bien', 0.9, t);
        efecto.golpe = Math.max(efecto.golpe, 0.7);
        break;
      case 'cambio': {
        // v9: en una subida a fondo, a veces petardea: se ve (llamarada) y se oye a la vez.
        const petardea = !!ev.subida && ev.gas > 0.6 && !p.jugador.m.electrico && Math.random() < 0.6;
        if (petardea) llamarada(p);
        audio.evento('cambio', { marcha: ev.marcha, subida: ev.subida, petardea });
        if (ev.subida && ev.gas > 0.5) vibra('tic');
        break;
      }
      case 'petardeo': // v9: soltar el gas de golpe a muchas vueltas
        llamarada(p);
        audio.evento('petardeo');
        break;
      case 'apagar':
        audio.evento('apagar');
        pista('motor', 'Motor apagado: la barra de calor baja y te detectan desde más cerca. Con MOTOR o FRENO vuelves a arrancar.', 6);
        break;
      case 'arranque':
        audio.evento('arranque');
        break;
      case 'golpe': {
        const f = ev.fuerza || 0;
        // v9: chispas donde toca; si es fuerte, trozos y cristales que saltan y la chapa se abolla. La carrocería rebota
        // apartándose del golpe. Muy fuerte: un parón de 60 ms y cámara lenta; si vas dentro (capó o cabina), un plano
        // de fuera que se salta tocando la cámara (informe de los vídeos del 25/09). Con «efectos suaves», sin lo último.
        const j = p.jugador;
        if (Number.isFinite(ev.x)) {
          mundo.efectos.chispas(ev.x, ev.y, j.vx, j.vy, Math.round(clamp(f, 3, 30)));
          if (f > 12) mundo.efectos.restos(ev.x, ev.y, j.vx, j.vy, f / 20);
          if (f > 5) abollar(mundo.jugador, j, ev.x, ev.y, f / 20, ev.nx, ev.ny);
        }
        sacudirCoche(mundo.jugador, j, f / 15, ev.x, ev.y);
        if (f > 14) juego.hitStop = Math.max(juego.hitStop, 0.06);
        const dentro = camaras.modo !== 'persecucion';
        if (ajustes.efectos !== 'suaves' && (f > 22 || (f > 18 && dentro))) {
          juego.lento = Math.max(juego.lento, 0.45);
          if (dentro) camaras.plano(sitioPlano(p.mapa, j));
        }
        audio.evento('golpe', { fuerza: clamp(f / 14, 0.15, 1) });
        camaras.sacudir(clamp(f / 12, 0.1, 1));
        vibra(f > 6 ? 'zumbido' : 'tic');
        break;
      }
      case 'danio':
        // Modo De verdad: cada golpe fuerte daña (barra roja del velocímetro).
        if (ev.antes < 0.5 && ev.danio >= 0.5) hud.aviso('Coche tocado: echa humo · menos potencia y agarre', 'peligro', 2.4, t);
        else if (ev.antes < 0.8 && ev.danio >= 0.8) { hud.aviso('Motor tocado: falla a ratos · un golpe más y es siniestro', 'peligro', 2.6, t); vibra('zumbido'); }
        else if (ev.danio - ev.antes >= 0.05) hud.aviso(`Daño ${Math.round(ev.danio * 100)} %`, 'peligro', 1.2, t);
        pista('danio', 'Modo De verdad: los golpes fuertes dañan el coche (barra roja del velocímetro): menos potencia y agarre. Al 100 %, siniestro. En Práctica no hay daño.', 7);
        if (ev.danio >= 0.4 && p.mapa.rampasAbiertas) pista('taller', 'TALLER: en la avenida del Puerto (cuadro verde en el mapa). Para 3 s dentro y te arregla la mitad del daño. Una vez por fuga.', 7);
        break;
      case 'casiChoque':
        audio.evento('casiChoque', { lado: ev.lado === 'izquierda' ? -1 : 1, fuerza: ev.fuerza });
        hud.premio(`+${ev.gana}`, ev.cadena >= 3 ? 'cadena' : '');
        vibra('tic');
        pista('casi', 'Rebase rozando: llena el nitro y alarga la cadena que multiplica el botín. Si tocas un coche, se rompe.', 5.5);
        break;
      case 'hueco':
        audio.evento('hueco');
        hud.grande('¡HUECO!', 'hueco', 1.1, t);
        hud.premio(`HUECO +${ev.gana}`, 'hueco');
        juego.lento = 0.5;
        vibra('dobleTic');
        break;
      case 'trafico':
        hud.aviso(`TRÁFICO ${ev.nivel} · ${TRAFICO_AVISO[ev.nivel] || ''} · rebases ×${String(ev.premio).replace('.', ',')}`, 'peligro', 2.6, t);
        vibra('dobleTic');
        pista('trafico', 'Cuanto más dura la huida, más se llena la Ronda: cada rebase vale más, pero cuesta más encontrar hueco. Los intermitentes avisan de quién va a cambiar de carril.', 6.5);
        break;
      case 'rebufo':
        if (ev.on) {
          audio.evento('rebufo');
          hud.aviso('REBUFO · sal en el último metro', 'bien', 1.4, t);
          pista('rebufo', 'Rebufo: pegado al camión vas más rápido. Al salir te da un empujón y, si alguien te sigue pegado, te pierde de vista.', 6);
        }
        break;
      case 'ojo':
        if (ev.estado === 'rojo') {
          audio.musica.capa('rojo');
          hud.grande('TE VEN', 'rojo', 1.1, t);
          vibra('latido');
        } else if (ev.estado === 'ambar') {
          audio.musica.capa('ambar');
          hud.grande('TE BUSCAN', 'ambar', 1.2, t);
          pista('ambar', 'ÁMBAR: te buscan donde te vieron por última vez (el círculo naranja del mapa). Que no te vean hasta que el anillo del Ojo se vacíe.', 7);
          if (p.zona === 'ronda') pista('crucero', 'Fuga a 120: entre el tráfico y a 115-123 km/h te confundes con los demás. Toca el velocímetro para fijar la velocidad (crucero); frenar lo quita.', 7);
        } else if (ev.estado === 'cerrado') {
          // El cierre del Ojo cae en un tiempo fuerte de la música: se espera hasta 200 ms.
          const ms = audio.activo ? clamp(audio.musica.alinear(), 0, 200) : 0;
          juego.golpeMs = ms;
          juego.esperaGolpe = true;
          setTimeout(() => {
            juego.esperaGolpe = false;
            if (juego.p !== p) return;
            audio.musica.euforia();
            hud.grande('LIBRE', 'libre', 1.9, tReal);
            vibra('escalera');
          }, ms);
        }
        break;
      case 'radio':
        hud.radio(ev.linea, t);
        audio.evento('radioBip');
        break;
      case 'embisteAviso':
        audio.evento('pit');
        hud.aviso(`¡EMBESTIDA ${ev.lado > 0 ? '▶' : '◀'}! Frena o acelera de golpe`, 'peligro', 1.6, t);
        vibra('dobleTic');
        pista('embestida', 'Una patrulla se pone a tu lado para embestirte: pierdes velocidad y el coche queda tocado. Frena o acelera de golpe y fallará.', 6.5);
        break;
      case 'embestida':
        hud.grande('¡EMBESTIDA!', 'rojo', 1, t);
        hud.aviso(ev.danio > 0 ? `Coche tocado: ${Math.round(ev.danio * 100)} % de daño · +nitro de rabia` : 'Empujón · +nitro de rabia', 'peligro', 1.8, t);
        camaras.sacudir(0.8);
        vibra('zumbido');
        break;
      case 'embisteFallo':
        if (ev.esquivada) {
          hud.premio(`ESQUIVADA +${ev.gana}`, 'hueco');
          vibra('tic');
        }
        break;
      case 'pitAviso':
        audio.evento('pit');
        hud.aviso('¡PIT! Te van a cruzar: frena de golpe', 'peligro', 1.8, t);
        vibra('dobleTic');
        break;
      case 'pit':
        hud.grande('PIT', 'rojo', 1, t);
        camaras.sacudir(0.9);
        vibra('zumbido');
        break;
      case 'pitFallo':
        if (ev.esquivada) {
          hud.aviso('PIT esquivado', 'bien', 1.4, t);
          hud.premio(`PIT ESQUIVADO +${ev.gana}`, 'hueco');
          vibra('tic');
        }
        break;
      case 'ruedaEmergencia':
        hud.aviso('Rueda de emergencia: vuelves a correr', 'bien', 2, t);
        vibra('dobleTic');
        break;
      case 'zona':
        if (ev.a === 'parking' || ev.a === 'callejon' || ev.a === 'tunel') {
          pista('escondite', 'Buen escondite: para, apaga con MOTOR y espera a oscuras. Con el motor caliente te ven de cerca.', 6);
        }
        break;
      case 'tunelEntra':
        audio.evento('tunelEntra');
        break;
      case 'unidad':
        if (ev.control && !juego.controlesAvisados) {
          juego.controlesAvisados = true;
          hud.aviso('CONTROLES en las salidas de la Ronda', 'peligro', 2.6, t);
        }
        break;
      case 'nivel':
        hud.grande(ev.nivel === 2 ? 'NIVEL 2 · LOBOS' : 'NIVEL 3 · TORO Y PINCHOS', 'rojo', 1.6, t);
        hud.aviso(`La Metro aprieta: patrullas con +${Math.round((ALERTA_POTENCIA[ev.nivel - 1] - 1) * 100)} % de motor · si escapas, ×${ev.nivel === 2 ? '1,25' : '1,5'}`, 'peligro', 2.6, t);
        vibra('latido');
        break;
      // v8: el interceptor y el taller.
      case 'interceptor':
        audio.evento('interceptor');
        hud.aviso(`¡INTERCEPTOR! ${ev.nombre} sale a cortarte el paso`, 'peligro', 3, t);
        vibra('dobleTic');
        break;
      case 'tallerEmpieza':
        audio.evento('taller');
        hud.aviso('TALLER · quieto 3 s', 'bien', 3.2, t);
        break;
      case 'tallerCorta':
        hud.aviso('Taller: te has movido antes de tiempo', '', 1.5, t);
        break;
      case 'tallerNo':
        hud.aviso(ev.motivo === 'usado' ? 'El taller ya te atendió en esta fuga' : ev.motivo === 'practica' ? 'En Práctica no hay daño que arreglar' : 'Taller: tu coche está bien', '', 2, t);
        break;
      case 'taller':
        audio.evento('tallerHecho');
        enderezar(mundo.jugador, ev.antes > 0 ? 1 - ev.despues / ev.antes : 1); // v9: y la chapa, en la misma medida
        hud.grande('REPARADO', 'verde', 1.4, t);
        hud.premio(`−${Math.round((ev.antes - ev.despues) * 100)} % de daño`);
        vibra('dobleTic');
        break;
      case 'pinchosAviso':
        hud.aviso(`PINCHOS DELANTE · pasa por el carril ${CARRIL_LIBRE[ev.libre] || 'libre'}`, 'peligro', 5, t);
        break;
      case 'pinchazo':
        audio.evento('pinchazo');
        hud.grande('¡PINCHAZO!', 'rojo', 1.2, t);
        camaras.sacudir(0.6);
        vibra('zumbido');
        break;
      // v7: choques en cadena, explosiones y patrullas fuera de combate.
      case 'fuego':
        audio.evento('fuego', { dist: distJugador(p, ev.x, ev.y) });
        break;
      case 'explosion': {
        const d = ev.dist ?? distJugador(p, ev.x, ev.y);
        mundo.efectos.explosion(ev.x, ev.y, ev.fuerza);
        audio.evento('explosion', { dist: d, fuerza: ev.fuerza });
        const cerca = clamp(1 - d / 70, 0, 1);
        if (cerca > 0) {
          camaras.sacudir(0.3 + 0.7 * cerca);
          efecto.golpe = Math.max(efecto.golpe, cerca);
          vibra(cerca > 0.5 ? 'zumbido' : 'tic');
        }
        if (d < 25) hud.aviso('¡EXPLOSIÓN! Aléjate de los coches en llamas', 'peligro', 1.8, t);
        pista('explosion', 'Un coche destrozado arde y explota a los pocos segundos. Aléjate: la explosión daña tu coche y deja fuera de combate a las patrullas que tenga al lado.', 7);
        break;
      }
      case 'fueraDeCombate':
        audio.evento('fueraDeCombate', { dist: distJugador(p, ev.x, ev.y) });
        hud.grande('¡FUERA DE COMBATE!', 'bien', 1.4, t);
        hud.premio(`${ev.nombre} +${ev.gana}`, 'hueco');
        hud.aviso('+50 % de nitro', 'bien', 1.4, t);
        juego.lento = Math.max(juego.lento, 0.6); // cámara lenta (informe 13)
        vibra('dobleTic');
        pista('fuera', 'Patrulla fuera de combate: cae si choca fuerte contra un muro, el tráfico, otra patrulla o una explosión. Embestirla con tu coche no sirve. Otra llega a los 15 s.', 7);
        break;
      case 'accidente':
        if (distJugador(p, ev.x, ev.y) < 120) hud.aviso('CHOQUE EN CADENA', 'peligro', 1.4, t);
        break;
      case 'estruendo':
        audio.evento('golpe', { fuerza: clamp((ev.fuerza / 14) * (1 - ev.dist / 160), 0, 0.8) });
        break;
      case 'final':
        terminarPartida(p, ev);
        break;
      default:
        break;
    }
  }

  function distJugador(p, x, y) {
    return Math.hypot(x - p.jugador.x, y - p.jugador.y);
  }

  // ---------------------------------------------------------------- simulación
  function guardarPrevias(p) {
    const g = (c) => { c._px = c.x; c._py = c.y; c._ph = c.h; };
    g(p.jugador);
    for (const u of p.policia) g(u.coche);
    for (const r of p.restos) g(r.coche);
    for (const v of p.trafico.ronda) g(v);
    for (const v of p.trafico.exterior) g(v);
    for (const v of p.trafico.barrio) g(v);
  }

  function simular(dt, p) {
    const j = p.jugador;
    const ent = entrada.leer(dt, { motor: j.motor, v: j.vf });
    juego.ent = ent;
    if (ent.pausaToque) {
      entrada.consumirInterfaz();
      pausar();
      return;
    }
    if (ent.camaraToque) {
      const m = camaras.siguiente();
      ajustes.camara = m;
      guardarLS(LS.ajustes, ajustes);
      hud.aviso(`Cámara: ${NOMBRE_MODO[m]}`, '', 1.1, tReal);
    }
    entrada.consumirInterfaz();
    // Móvil casi plano: así no se puede medir el giro.
    if (ent.plano) {
      juego.planoT += dt;
      if (juego.planoT > 1.2) {
        hud.aviso('Levanta un poco el móvil: plano no se nota el giro', '', 1.6, tReal);
        juego.planoT = -4;
      }
    } else if (juego.planoT > 0) juego.planoT = 0;
    else if (juego.planoT < 0) juego.planoT = Math.min(0, juego.planoT + dt);

    let escala = 1;
    if (juego.hitStop > 0) {
      juego.hitStop -= dt;
      escala = 0;
    } else if (juego.lento > 0) {
      juego.lento -= dt;
      escala = 0.35;
    }
    juego.acum += dt * escala;
    let pasos = 0;
    while (juego.acum >= DT && pasos < 5) {
      guardarPrevias(p);
      pasoPartida(p, ent, DT);
      juego.acum -= DT;
      pasos++;
      if (pasos === 1) {
        // Los toques (nitro, motor) cuentan una sola vez.
        entrada.consumir();
        ent.nitroToque = ent.motorToque = ent.arrancar = false;
      }
      if (p.final) {
        juego.acum = 0;
        break;
      }
    }
    if (pasos === 5 && juego.acum > DT) juego.acum = DT * 0.5; // el móvil no da abasto: se suelta el retraso
    if (pasos > 0 && juego.revanchaPulsada) {
      juego.revanchaMs = Math.round(performance.now() - juego.revanchaPulsada);
      juego.revanchaPulsada = 0;
    }
    for (const ev of sacarEventos(p)) alEvento(ev, p);
    entrada.marcarParado(Math.abs(j.vf) < 1, j.motor);
  }

  // ---------------------------------------------------------------- dibujo
  function estadoAudio(p, dt) {
    const j = p.jugador;
    const enJuego = juego.estado === 'juego';
    const quieto = juego.estado === 'final' || juego.estado === 'resultado';
    const fx = Math.sin(j.h), fy = Math.cos(j.h), rx = Math.cos(j.h), ry = -Math.sin(j.h);
    const sirenas = [];
    for (const u of p.policia) {
      if (!u.sirena) continue;
      const c = u.coche;
      const dx = c.x - j.x, dy = c.y - j.y, d = Math.hypot(dx, dy);
      if (d > 300) continue;
      const acerca = d > 0.1 ? -(((c.vx - j.vx) * dx + (c.vy - j.vy) * dy) / d) : 0;
      sirenas.push({ x: dx * rx + dy * ry, z: dx * fx + dy * fy, dist: d, vRel: quieto ? 0 : acerca });
    }
    const ent = juego.ent || {};
    const derrape = j.derrape ? clamp(0.35 + Math.abs(j.deriva) * 1.1, 0, 1) : clamp((Math.abs(j.vl) - 1.5) / 5, 0, 0.5);
    return {
      dt,
      rpm: quieto ? 900 : j.rpm,
      marcha: j.marcha,
      acelerador: enJuego ? ent.gas || 0 : 0,
      velocidad: quieto ? 0 : Math.abs(j.vf),
      velMax: j.m.vMax,
      turbo: enJuego ? j.turbo : 0,
      nitro: enJuego && (j.nitroActivo || j.nitroGolpe > 0),
      derrape: enJuego ? derrape : 0,
      roce: enJuego && j.roce ? clamp(Math.hypot(j.vx, j.vy) / 30, 0.25, 1) : 0, // v9: chapa contra el muro u otro coche
      motorEncendido: j.motor,
      enTunel: p.zona === 'tunel',
      marchaAtras: j.marchaAtras,
      sirenas,
      ojo: p.ojo.estado,
      restanteBusqueda: restante(p.ojo) ?? Infinity,
      pausa: juego.estado === 'pausa' || juego.estado === 'cuenta',
    };
  }

  // Plano final: la cámara se eleva despacio por detrás del coche.
  function planoFinal(dt, pose) {
    juego.orbita += dt;
    const k = Math.min(1, juego.orbita / 2.4);
    const e = k * k * (3 - 2 * k);
    const a = pose.h + Math.PI + 0.3 * Math.sin(juego.orbita * 0.45);
    const r = 6 + 6 * e, alto = 2.2 + 13 * e;
    const cam = camaras.camara;
    cam.position.set(pose.x + Math.sin(a) * r, pose.z + alto, -(pose.y + Math.cos(a) * r));
    cam.lookAt(pose.x, pose.z + 0.8, -pose.y);
  }

  const lctx = lineas.getContext('2d');
  const rayas = [];
  for (let i = 0; i < 40; i++) rayas.push({ a: Math.random() * Math.PI * 2, r: Math.random(), v: 0.6 + Math.random() * 0.9, g: 0.6 + Math.random() * 1.2 });

  // Sensación de velocidad: líneas que salen del centro y viñeta que se cierra (sin desenfoque real).
  function efectos(dt, p, cerca) {
    const j = p.jugador;
    const suave = ajustes.efectos === 'suaves' ? 0.4 : 1;
    let k = 0;
    if (juego.estado === 'juego') {
      k = clamp((Math.abs(j.vf) * 3.6 - 110) / 120, 0, 1);
      if (j.nitroActivo) k = Math.max(k, 0.5) + 0.2;
      k += efecto.golpe * 0.6;
      if (juego.ent && juego.ent.mirarAtras) k *= 0.25;
    }
    efecto.golpe = Math.max(0, efecto.golpe - dt * 2.2);
    k = clamp(k, 0, 1) * suave;
    efecto.k += (k - efecto.k) * Math.min(1, dt * 5);
    const op = Math.round((0.2 + efecto.k * 0.6) * 50) / 50;
    if (op !== efecto.opac) {
      efecto.opac = op;
      vineta.style.opacity = String(op);
    }
    // Con la policía encima, el borde de la pantalla late en azul y rojo.
    const borde = cerca && juego.estado === 'juego' ? (Math.floor(tReal * 5) % 2 ? 'azul' : 'rojo') : '';
    if (borde !== efecto.borde) {
      efecto.borde = borde;
      vineta.dataset.borde = borde;
    }
    const W = lineas.width, H = lineas.height;
    if (efecto.k < 0.03) {
      if (efecto.pintado) {
        lctx.clearRect(0, 0, W, H);
        efecto.pintado = false;
      }
      return;
    }
    lctx.clearRect(0, 0, W, H);
    efecto.pintado = true;
    const cx = W / 2, cy = H * 0.46, R = Math.hypot(W, H) / 2;
    lctx.lineCap = 'round';
    lctx.strokeStyle = '#DDEBFF';
    for (const r of rayas) {
      r.r += dt * r.v * (0.8 + 2.6 * efecto.k);
      if (r.r > 1) {
        r.r = 0.3 + Math.random() * 0.15;
        r.a = Math.random() * Math.PI * 2;
      }
      const r0 = R * (0.3 + 0.75 * r.r), largo = R * (0.05 + 0.22 * efecto.k) * r.r;
      const ca = Math.cos(r.a), sa = Math.sin(r.a);
      lctx.globalAlpha = Math.min(0.55, efecto.k * 0.7 * r.r);
      lctx.lineWidth = r.g * (W / 640);
      lctx.beginPath();
      lctx.moveTo(cx + ca * r0, cy + sa * r0 * 0.8);
      lctx.lineTo(cx + ca * (r0 + largo), cy + sa * (r0 + largo) * 0.8);
      lctx.stroke();
    }
    lctx.globalAlpha = 1;
  }

  // v9: lo que dejan las ruedas y la chapa. Marcas en el asfalto y humo blanco cuando patinan (tu coche, las patrullas y
  // el tráfico que va suelto) y chispas mientras se roza un muro u otro coche. Solo a menos de 160 m.
  function ruedas(dt, p) {
    const m = mundo, j = p.jugador;
    if (juego.estado === 'pausa' || juego.estado === 'cuenta') { m.marcas.actualizar(); return; }
    const cerca = (c) => Math.abs(c.x - j.x) < 160 && Math.abs(c.y - j.y) < 160;
    const dejar = (llave, c, patina) => {
      const fx = Math.sin(c.h), fy = Math.cos(c.h), rx = Math.cos(c.h), ry = -Math.sin(c.h);
      const atras = c.largo * 0.32, lado = c.ancho / 2 - 0.2;
      for (const s of [-1, 1]) {
        const x = c.x - fx * atras + rx * lado * s, y = c.y - fy * atras + ry * lado * s;
        m.marcas.anotar(llave + (s > 0 ? 'd' : 'i'), x, y, patina);
        if (patina > 0.35) m.efectos.humoRueda(llave + s, x, y, patina - 0.3, dt);
      }
    };
    dejar('j', j, j.patina || 0);
    if (j.roce && j.tocaEn) m.efectos.roce('j', j.tocaEn.x, j.tocaEn.y, j.vx, j.vy, dt);
    for (const u of p.policia) {
      const c = u.coche;
      if (!cerca(c)) continue;
      dejar('u' + u.id, c, c.patina || 0);
      if (c.roce && c.tocaEn) m.efectos.roce('u' + u.id, c.tocaEn.x, c.tocaEn.y, c.vx, c.vy, dt);
    }
    for (const lista of [p.trafico.ronda, p.trafico.barrio]) {
      for (const t of lista) {
        if (!t.suelto || !cerca(t)) continue;
        const lat = Math.abs(t.vx * Math.cos(t.h) - t.vy * Math.sin(t.h));
        dejar('t' + t.id, t, Math.max(clamp((lat - 2) / 6, 0, 1), clamp(Math.abs(t.w || 0) - 0.5, 0, 1)));
      }
    }
    m.marcas.actualizar();
  }

  // v9: llamarada por el escape de tu coche (dos salidas; el F1, una en el centro y más alta).
  function llamarada(p) {
    const j = p.jugador, fx = Math.sin(j.h), fy = Math.cos(j.h), rx = Math.cos(j.h), ry = -Math.sin(j.h);
    const atras = j.largo / 2 + 0.05, f1 = j.modelo === 'f1';
    for (const s of f1 ? [0] : [-0.38, 0.38]) {
      mundo.efectos.llamarada(j.x - fx * atras + rx * s, j.y - fy * atras + ry * s, -fx, -fy, j.vx, j.vy, f1 ? 0.55 : 0.33);
    }
  }

  // Humo y fuego (v7): de los coches tocados, los que arden, los restos de las patrullas y el tuyo si está muy dañado.
  // Solo lo que está a menos de 160 m: más lejos no se ve y gastaría partículas.
  function emitirHumo(dt, p, pose) {
    if (juego.estado === 'pausa' || juego.estado === 'cuenta') return;
    const ef = mundo.efectos, j = p.jugador;
    const cerca = (c) => Math.abs(c.x - j.x) < 160 && Math.abs(c.y - j.y) < 160;
    for (const lista of [p.trafico.ronda, p.trafico.barrio]) {
      for (const v of lista) {
        if (!(v.danio >= DANIO_TRAFICO.humo) || !cerca(v)) continue;
        if (v.arde > 0) ef.fuego(v.id, v.x, v.y, 1, dt);
        else ef.humo(v.id, v.x, v.y, v.quemado ? 0.6 : 0.35 + 0.5 * (v.danio - DANIO_TRAFICO.humo), dt, v.tipo === 'camion' ? 2.6 : 1.1, v.quemado);
      }
    }
    for (const r of p.restos) if (cerca(r.coche)) ef.humo(r.id, r.coche.x, r.coche.y, 0.45, dt, 1.2);
    // El tuyo, por el capó: humo desde el 50 % de daño y llamas pequeñas desde el 80 %.
    if (j.danio >= 0.5 && juego.estado === 'juego') {
      const hx = pose.x + Math.sin(pose.h) * 1.5, hy = pose.y + Math.cos(pose.h) * 1.5;
      if (j.danio >= 0.8) ef.fuego('tu', hx, hy, 0.25, dt);
      else ef.humo('tu', hx, hy, 0.3 + (j.danio - 0.5), dt, 1.1);
    }
  }

  function dibujar(dt, p) {
    const m = mundo, t = tReal, j = p.jugador;
    const alpha = juego.estado === 'juego' ? clamp(juego.acum / DT, 0, 1) : 1;
    const pose = colocarCoche(m.jugador, j, alpha, t, false);
    pose.z = m.jugador.grupo.position.y;
    // v9: muy tocado, un faro falla: el haz pierde fuerza y a ratos se apaga (sin parpadeo con «efectos suaves»).
    if (m.jugador.destello) {
      const fallo = j.danio > 0.6 && ajustes.efectos !== 'suaves' && Math.sin(t * 17) * Math.sin(t * 2.3) > 0.8;
      m.jugador.destello.material.opacity = fallo ? 0.2 : 1 - clamp((j.danio - 0.6) / 0.4, 0, 1) * 0.45;
    }
    let cerca = false;
    for (const u of p.policia) {
      let v = m.policia.get(u.id);
      if (!v) {
        v = crearCocheVisual(m.esc.escena, u.tipo, { policia: true, texturaMancha: manchaTex });
        m.policia.set(u.id, v);
      }
      colocarCoche(v, u.coche, alpha, t, u.sirena || u.rol === 'control');
      if (u.sirena && u.distJugador < 40) cerca = true;
    }
    // Patrullas fuera de combate: el mismo coche, con el puente de luces apagado y echando humo.
    for (const r of p.restos) {
      const v = m.policia.get(r.id);
      if (v) colocarCoche(v, r.coche, alpha, t, false);
    }
    if (m.policia.size > p.policia.length + p.restos.length) {
      const vivos = new Set([...p.policia.map((u) => u.id), ...p.restos.map((r) => r.id)]);
      for (const [id, v] of m.policia) {
        if (vivos.has(id)) continue;
        m.esc.escena.remove(v.grupo);
        liberar(v.grupo);
        m.policia.delete(id);
      }
    }
    m.trafico.actualizar(alpha);
    emitirHumo(dt, p, pose);
    ruedas(dt, p);
    m.pinchos.actualizar(p.pinchos);
    // El fantasma: tu coche donde la policía cree que estás.
    const o = p.ojo;
    m.fantasma.visible = o.estado === 'ambar';
    if (m.fantasma.visible) {
      m.fantasma.position.set(o.ultima.x, alturaEn(o.ultima.x, o.ultima.y) + 0.02, -o.ultima.y);
      m.fantasma.rotation.set(0, -o.ultima.h, 0);
    }
    if (juego.estado === 'final' || juego.estado === 'resultado') planoFinal(dt, pose);
    else if (juego.estado === 'juego') {
      const ent = juego.ent || {};
      camaras.actualizar(dt, pose, j, {
        mirarAtras: !!ent.mirarAtras, angVolante: ent.angVolante || 0, policiaCerca: cerca,
        reducir: ajustes.efectos === 'suaves', t,
        // v9: la cabeza del piloto se va hacia lo que se mueve cerca (Alberto, 25/09: «va donde hay movimiento»).
        foco: camaras.modo === 'cabina' && ajustes.efectos !== 'suaves' ? foco(j, p.policia.map((u) => u.coche), p.trafico.ronda, p.trafico.barrio) : 0,
      });
    }
    if (!juego.esperaGolpe && juego.estado !== 'pausa' && juego.estado !== 'cuenta' && juego.estado !== 'resultado') hud.actualizar(p, pose, t);
    audio.actualizar(estadoAudio(p, dt));
    efectos(dt, p, cerca);
    m.efectos.actualizar(juego.estado === 'pausa' || juego.estado === 'cuenta' ? 0 : dt, camaras.camara);
    // v8: en cabina, primero el retrovisor (una textura pequeña, uno de cada tres fotogramas) y luego la imagen.
    renderer.info.reset();
    camaras.espejo(renderer, m.esc.escena, calidad >= 1 && (juego.estado === 'juego' || juego.estado === 'pausa' || juego.estado === 'cuenta'));
    renderer.render(m.esc.escena, camaras.camara);
    contar();
  }

  // ---------------------------------------------------------------- rendimiento
  const depurar = /debug/.test(location.search + location.hash);
  const rend = { ventanaT: 0, suma: 0, n: 0, techo: prMax, fps: 60, calls: 0, tris: 0, maxCalls: 0, maxTris: 0 };
  let panel = null, panelT = 0;
  if (depurar) {
    panel = document.createElement('div');
    panel.className = 'depurar';
    raiz.appendChild(panel);
  }
  // Si el móvil no llega a 45 fps, se dibujan menos píxeles (y ya no se vuelve a subir por encima).
  // Lo que va al registro: fps de media y el peor segundo de cada partida (prueba n.º 1 del prompt).
  const medida = { t: 0, n: 0, ventanaT: 0, ventanaN: 0, peor: Infinity };
  function medir(dt) {
    if (dt > 0) rend.fps += (1 / dt - rend.fps) * 0.05;
    if (juego.estado !== 'juego') return;
    medida.t += dt;
    medida.n++;
    medida.ventanaT += dt;
    if (medida.ventanaT > 0) {
      medida.ventanaN++;
      if (medida.ventanaT >= 1) {
        medida.peor = Math.min(medida.peor, medida.ventanaN / medida.ventanaT);
        medida.ventanaT = medida.ventanaN = 0;
      }
    }
    rend.ventanaT += dt;
    if (rend.ventanaT <= 0) return;
    rend.suma += dt;
    rend.n++;
    if (rend.ventanaT >= 2) {
      const media = rend.suma / Math.max(1, rend.n);
      if (media > 1 / 45 && pr > 0.6) {
        rend.techo = pr - 0.05;
        pr = Math.max(0.6, pr - 0.15);
        aplicarTamano();
      } else if (media < 1 / 57 && pr < rend.techo - 0.1) {
        pr = Math.min(rend.techo, pr + 0.1);
        aplicarTamano();
      }
      rend.ventanaT = rend.suma = rend.n = 0;
    }
  }
  function contar() {
    const i = renderer.info.render;
    rend.calls = i.calls;
    rend.tris = i.triangles;
    if (juego.estado === 'juego') {
      rend.maxCalls = Math.max(rend.maxCalls, i.calls);
      rend.maxTris = Math.max(rend.maxTris, i.triangles);
    }
    if (panel && tReal - panelT > 0.25) {
      panelT = tReal;
      panel.textContent = `${Math.round(rend.fps)} fps · ${rend.calls} llamadas · ${Math.round(rend.tris / 1000)}k triángulos · píxeles ×${pr.toFixed(2)} · calidad ${calidad}`;
    }
  }

  function aplicarTamano() {
    const w = Math.max(1, raiz.clientWidth), h = Math.max(1, raiz.clientHeight);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camaras.tamano(w, h);
    const k = TACTIL ? 0.5 : 0.6;
    lineas.width = Math.max(1, Math.round(w * k));
    lineas.height = Math.max(1, Math.round(h * k));
    efecto.pintado = true;
  }

  // ---------------------------------------------------------------- menú
  // v8: la ficha de cada coche para el garaje: punta y 0-100 medidos con la misma física del juego.
  // v10: con las mejoras del taller (m: el modelo mejorado, para las barras de agarre, aguante y discreción).
  const fichas = new Map();
  function fichaCoche(id, mejoras = {}) {
    if (!MODELOS[id]) return null;
    const llave = id + ':' + codigoMejoras(mejoras);
    if (!fichas.has(llave)) {
      const m = modeloConMejoras(id, mejoras);
      const c = crearCoche(m, 0, 0, 0, 0);
      c.agil = 1.5;
      let t = 0;
      while (c.vf < 100 / 3.6 && t < 20) { pasoCoche(c, { gas: 1 }, 1 / 60); t += 1 / 60; }
      fichas.set(llave, {
        m, punta: Math.round(m.vMax * 3.6), cero100: Math.round(t * 10) / 10, pintura: (PINTURA[id] || PINTURA.rayo)[0],
        frena: Math.round((100 / 3.6) ** 2 / (2 * m.frenada)), // metros de 100 a 0
        radio: Math.round((m.ejes / Math.tan(m.giroMax)) * 10) / 10, // radio de giro en parado (m)
      });
    }
    return fichas.get(llave);
  }

  function revancha() {
    const p = juego.p;
    if (!p) return;
    juego.revanchaPulsada = performance.now();
    audio.iniciar();
    empezar(p.escenario, p.semilla, true);
  }

  menu = crearMenu(capas, {
    ajustes,
    record: () => record,
    alJugar: (esc) => { jugar(esc); },
    // v8: la carrera y el garaje.
    carrera: () => carrera,
    prueba: () => prueba,
    comprarCoche(id) {
      const r = comprar(carrera, id);
      if (r.ok) {
        carrera = r.car;
        guardarLS(LS.carrera, carrera);
        if (prueba === id) prueba = null;
      }
      return r.ok;
    },
    // v10: el taller de mejoras (una pieza, un nivel más). Gasta chapas, no rango.
    mejorarCoche(id, pieza) {
      const r = comprarMejora(carrera, id, pieza);
      if (r.ok) {
        carrera = r.car;
        guardarLS(LS.carrera, carrera);
      }
      return r.ok;
    },
    mejorasDe: (id) => mejorasDe(carrera, id),
    elegirCoche(id) {
      carrera = elegir(carrera, id);
      guardarLS(LS.carrera, carrera);
      if (prueba === id) prueba = null;
    },
    probarCoche(id) {
      if (!MODELOS[id]) return;
      prueba = id;
      if (ajustes.modo !== 'practica') {
        ajustes.modo = 'practica';
        guardarLS(LS.ajustes, ajustes);
      }
    },
    quitarPrueba() { prueba = null; },
    fichaCoche,
    cambiarAjuste(k, v) {
      ajustes[k] = v;
      guardarLS(LS.ajustes, ajustes);
      switch (k) {
        case 'control':
          if (v === 'inclinacion') {
            probandoInclinacion = null; // se vuelve a probar dentro de este toque (iPhone pide permiso)
            probarInclinacion().then((ok) => {
              entrada.ponerModo(ok ? 'inclinacion' : 'botones');
              if (!ok) menu.toast('No llegan datos de inclinación: se jugará con botones.', 3500);
            });
          } else entrada.ponerModo('botones');
          break;
        case 'sensibilidad': entrada.ponerSensibilidad(v); break;
        case 'acelerador':
          entrada.ponerAcelerador(v);
          if (v === 'inclinar') {
            probandoInclinacion = null; // pide el permiso dentro de este toque (iPhone)
            probarInclinacion().then((ok) => { if (!ok) menu.toast('No llegan datos de inclinación: el acelerador irá solo (automático).', 3500); });
          }
          break;
        case 'ayudaVolante': entrada.ponerAyuda(v); break;
        case 'camara': camaras.ponerModo(v); break;
        case 'luz': if (mundo) mundo.esc.ponerLuz(v); break;
        case 'musica': case 'efectosVol': case 'motor': aplicarVolumen(); break;
        default: break;
      }
    },
    calibrar() {
      const ok = entrada.calibrar();
      if (ok && ajustes.control === 'inclinacion') entrada.ponerModo('inclinacion');
      return ok;
    },
    registro: {
      contar: () => registro.length,
      texto: () => aTexto(registro),
      async copiar() {
        try {
          await navigator.clipboard.writeText(aTexto(registro));
          return true;
        } catch (_) {
          return false;
        }
      },
    },
    alSeguir: seguir,
    alSalir: alMenu,
    alRevancha: revancha,
    alMenu,
    sonido: (tipo, datos) => audio.evento(tipo, datos),
  });

  // ---------------------------------------------------------------- avisos del sistema
  // El primer toque desbloquea el sonido (y, en iPhone, pide permiso para la inclinación). Tiene que ser al
  // soltar el dedo: los navegadores no cuentan «apoyar el dedo» como gesto para el sonido ni para los permisos.
  function desbloquear() {
    audio.iniciar();
    if (!juego.gesto) {
      juego.gesto = true;
      aplicarVolumen();
      if (juego.estado === 'menu') audio.musica.capa('menu');
      if (ajustes.control === 'inclinacion') probarInclinacion();
    }
  }
  document.addEventListener('pointerup', desbloquear, true);
  document.addEventListener('click', desbloquear, true);
  document.addEventListener('keydown', desbloquear, true);
  document.addEventListener('pointerdown', (ev) => {
    const b = ev.target && ev.target.closest ? ev.target.closest('.menu button') : null;
    if (b) audio.evento('boton');
  }, true);
  window.addEventListener('keydown', (ev) => {
    if (juego.estado === 'pausa' && (ev.code === 'KeyP' || ev.code === 'Escape')) seguir();
  });

  // Llamada, pantalla apagada o cambio de aplicación: la persecución se congela y vuelve con cuenta atrás.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      pausar();
      hud.callar();
      audio.suspender(true);
    } else {
      audio.suspender(false);
      if (juego.estado !== 'menu' && juego.estado !== 'resultado') mantenerPantalla(true);
    }
  });
  window.addEventListener('pagehide', pausar);
  window.addEventListener('resize', aplicarTamano);
  window.addEventListener('orientationchange', () => setTimeout(aplicarTamano, 250));
  lienzo.addEventListener('webglcontextlost', (ev) => {
    ev.preventDefault();
    pausar();
    menu.toast('El móvil ha liberado la memoria del 3D. Si la imagen no vuelve, recarga la página.', 6000);
  });
  let fallos = 0;
  window.addEventListener('error', (ev) => {
    if (fallos++ < 2 && menu) menu.toast(`Algo ha fallado: ${ev.message || 'error'} (haz una captura para quien organiza la prueba)`, 6000);
  });

  // ---------------------------------------------------------------- bucle
  let fotogramaAnterior = performance.now();
  function fotograma(ahoraMs) {
    requestAnimationFrame(fotograma);
    cuadro(ahoraMs);
  }
  function cuadro(ahoraMs) {
    const dt = clamp((ahoraMs - fotogramaAnterior) / 1000, 0, 0.1);
    fotogramaAnterior = ahoraMs;
    tReal += dt;
    medir(dt);
    if (!mundo) return;
    if (juego.estado === 'menu') {
      dibujarFondo(dt);
      return;
    }
    const p = juego.p;
    if (!p) return;
    if (juego.estado === 'juego') simular(dt, p);
    if (juego.estado === 'menu') return; // se abandonó desde dentro
    dibujar(dt, p);
    atenderPistas();
  }

  aplicarVolumen();
  aplicarTamano();
  hud.mostrar(false);
  entrada.mostrar(false);
  menu.portada();
  requestAnimationFrame(fotograma);
  // La ciudad se monta después de enseñar el menú, para que la portada salga al instante.
  setTimeout(() => {
    try {
      prepararMundo(true);
      prepararFondo();
      aplicarTamano();
    } catch (e) {
      console.error(e);
      menu.toast(`No se pudo montar la ciudad 3D: ${e.message}`, 8000);
    }
  }, 60);

  // Para las pruebas y para quien quiera mirar por dentro (consola del navegador).
  globalThis.FUGAZ = {
    juego, ajustes, renderer, rend,
    get mundo() { return mundo; },
    get registro() { return registro; },
    get carrera() { return carrera; }, // v8
    camaras, // v9: para la prueba de humo (cabina y plano de choque)
    menu,
    probarCoche(id) { if (MODELOS[id]) { prueba = id; ajustes.modo = 'practica'; } },
    empezar: (esc = 'mixta', semilla) => empezar(esc, semilla, false),
    pausar, seguir, alMenu, revancha,
    // Avanza n fotogramas a mano (para probar con la pestaña oculta) y devuelve los ms de CPU por fotograma.
    cuadros(n = 60, ms = 1000 / 60) {
      let t = fotogramaAnterior;
      const t0 = performance.now();
      for (let i = 0; i < n; i++) {
        t += ms;
        cuadro(t);
      }
      return (performance.now() - t0) / Math.max(1, n);
    },
  };
}

arrancar();
return {  };
})();
})();
</script>

</body>
