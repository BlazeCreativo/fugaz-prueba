<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FUGAZ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<meta name="description" content="FUGAZ, prototipo de la fase 0: pierde a la policía rompiendo su línea de visión.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@500;700&family=Overpass:wght@400;600;800&family=Saira+Extra+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fondo: #070A12;
  --noche: #0B1122;
  --panel: rgba(9, 13, 24, 0.9);
  --panel-claro: rgba(18, 25, 44, 0.86);
  --borde: rgba(160, 180, 220, 0.2);
  --texto: #E8EDF7;
  --tenue: #9AA6BC;
  --rojo: #FF3355;
  --azul: #3D7BFF;
  --ambar: #FFB020;
  --verde: #3DDC84;
  --cian: #7FE3FF;
  --display: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
  --ui: 'Overpass', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Overpass Mono', ui-monospace, 'SFMono-Regular', monospace;
  --st: env(safe-area-inset-top, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --b: 56px;           /* botón de mando (25/09: 68 tapaba la pantalla) */
  --retro: min(24vw, 168px);
}
@media (max-height: 380px) { :root { --b: 50px; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; }
body { font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cian); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .cuenta-fin i { animation-duration: 8s !important; }
}

#juego { position: fixed; inset: 0; overflow: hidden; background: var(--noche); touch-action: none; }
#lienzo, #lineas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#lineas { pointer-events: none; }
#vineta {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.2;
  background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
}
#vineta[data-borde="azul"] { box-shadow: inset 0 0 110px 18px rgba(61, 123, 255, 0.5); }
#vineta[data-borde="rojo"] { box-shadow: inset 0 0 110px 18px rgba(255, 51, 85, 0.45); }
#capas { position: absolute; inset: 0; pointer-events: none; }

/* ------------------------------------------------------------------ HUD */
.hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
.h-retro {
  position: absolute; top: calc(var(--st) + 6px); left: 50%; transform: translateX(-50%);
  width: var(--retro); aspect-ratio: 360 / 54; border-radius: 7px; overflow: hidden;
  box-shadow: 0 0 0 1.5px rgba(20, 24, 32, 0.9), 0 4px 14px rgba(0, 0, 0, 0.5);
}
.h-retro canvas { width: 100%; height: 100%; display: block; }
.h-ojo {
  --c: var(--rojo);
  position: absolute; top: calc(var(--st) + 12px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%);
  width: 90px; display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.h-ojo[data-estado="ambar"] { --c: var(--ambar); }
.h-ojo[data-estado="cerrado"] { --c: var(--verde); }
.h-ojo svg { width: 44px; height: 44px; overflow: visible; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 55%, transparent)); }
.h-ojo .anillo-fondo { fill: rgba(5, 8, 14, 0.55); stroke: rgba(255, 255, 255, 0.14); stroke-width: 6; }
.h-ojo .anillo { fill: none; stroke: var(--c); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 50% 50%; }
.h-ojo .parpado { fill: rgba(255, 255, 255, 0.1); fill: color-mix(in srgb, var(--c) 22%, transparent); stroke: var(--c); stroke-width: 3.5; }
.h-ojo .iris { fill: var(--c); }
.h-ojo .pupila { fill: #05070A; }
.h-ojo .cerrado { fill: none; stroke: var(--c); stroke-width: 5; stroke-linecap: round; display: none; }
.h-ojo[data-estado="cerrado"] .parpado, .h-ojo[data-estado="cerrado"] .iris, .h-ojo[data-estado="cerrado"] .pupila { display: none; }
.h-ojo[data-estado="cerrado"] .cerrado { display: inline; }
.h-ojo.parpadea svg { animation: parpadeo 0.3s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0.35; } }
.ojo-txt { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: 0.08em; color: var(--c); white-space: nowrap; }
.nivel { display: flex; gap: 4px; }
.nivel i { width: 11px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); }
.nivel i.on { background: var(--rojo); box-shadow: 0 0 6px var(--rojo); }

.h-botin { position: absolute; top: calc(var(--st) + 8px); left: calc(var(--sl) + 14px); display: flex; flex-direction: column; }
.h-botin .chapas { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--ambar); font-variant-numeric: tabular-nums; }
.h-botin .ud { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tenue); }
.h-botin .mult { font-family: var(--mono); font-size: 12px; color: var(--cian); min-height: 15px; }
.premios { position: relative; height: 0; }
.premio {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--verde);
  animation: sube 1.05s ease-out forwards;
}
.premio.cadena { color: var(--ambar); }
.premio.hueco { color: var(--cian); font-size: 28px; }
@keyframes sube { 0% { transform: translateY(6px) scale(0.8); opacity: 0; } 15% { transform: translateY(0) scale(1.1); opacity: 1; } 100% { transform: translateY(-34px) scale(1); opacity: 0; } }

/* Horizontal (lo normal): arriba el botín, el retrovisor con el Ojo y el minimapa; abajo el velocímetro. */
.h-mapa {
  position: absolute; top: calc(var(--st) + 8px); right: calc(var(--sr) + 58px);
  width: min(17vw, 96px); height: min(17vw, 96px); border-radius: 50%; opacity: 0.88;
  box-shadow: 0 0 0 1.5px rgba(160, 180, 220, 0.28), 0 4px 16px rgba(0, 0, 0, 0.5);
}

.h-velo {
  position: absolute; bottom: calc(var(--sb) + 10px); left: 50%; transform: translateX(-50%);
  width: 140px; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 8px;
}
.h-velo .rpm { grid-column: 1 / 3; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; margin-bottom: 3px; }
.h-velo .rpm i { display: block; height: 100%; background: linear-gradient(90deg, var(--cian), var(--ambar) 75%, var(--rojo)); transform-origin: 0 50%; transform: scaleX(0); }
.h-velo .kmh { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: 0.9; text-align: right; font-variant-numeric: tabular-nums; }
.h-velo .uds { grid-column: 1; grid-row: 3; text-align: right; font-size: 10px; letter-spacing: 0.16em; color: var(--tenue); }
.h-velo .marcha { grid-column: 2; grid-row: 2; font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--ambar); border: 1.5px solid rgba(255, 176, 32, 0.6); border-radius: 6px; padding: 1px 7px 0; margin-bottom: 4px; }
.h-velo .barras { grid-column: 1 / 3; display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.h-velo .barras > div { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.h-velo .barras i { display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(0); }
.h-velo .nitro i { background: linear-gradient(90deg, #2F8CFF, var(--cian)); box-shadow: 0 0 8px var(--cian); }
.h-velo .danio { opacity: 0; transition: opacity 0.3s; }
.h-velo .danio.visible { opacity: 1; }
.h-velo .danio i { background: linear-gradient(90deg, #F2C14E, #FF9F1C); }
.h-velo .danio.humo i { background: linear-gradient(90deg, #E07A1F, #FF5A1F); }
.h-velo .danio.fuego i { background: linear-gradient(90deg, #B3122E, var(--rojo)); animation: parpadea 0.7s steps(2) infinite; }
@keyframes parpadea { 50% { opacity: 0.45; } }
.h-velo .crucero { grid-column: 1 / 3; justify-self: center; margin-top: 3px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: var(--cian); border: 1px solid rgba(127, 227, 255, 0.55); border-radius: 4px; padding: 1px 6px; }
.h-modo { margin-top: 4px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: var(--ambar); border: 1px solid rgba(255, 176, 32, 0.55); border-radius: 4px; padding: 1px 6px; align-self: flex-start; }
.h-velo .calor { opacity: 0; transition: opacity 0.3s; }
.h-velo .calor.visible { opacity: 1; }
.h-velo .calor i { background: linear-gradient(90deg, var(--ambar), var(--rojo)); }

/* Salida lanzada: la aguja del cuentavueltas sube y baja; se suelta el freno en la zona verde. */
.h-lanzada {
  position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
  width: 240px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.14);
}
.h-lanzada .zona { position: absolute; left: 60%; width: 25.7%; top: 0; bottom: 0; background: var(--verde); opacity: 0.75; border-radius: 3px; }
.h-lanzada .aguja { position: absolute; top: -5px; width: 4px; height: 24px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 8px #fff; }
.h-lanzada span { position: absolute; bottom: 20px; left: -40px; right: -40px; text-align: center; font-size: 12px; color: var(--texto); white-space: nowrap; }

.h-detencion { position: absolute; top: calc(var(--st) + 150px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%); width: min(50vw, 280px); text-align: center; }
.h-detencion span { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.14em; color: var(--rojo); animation: parpadeo 0.5s steps(2) infinite; }
.h-detencion div { height: 8px; border-radius: 4px; background: rgba(255, 51, 85, 0.2); overflow: hidden; margin-top: 4px; }
.h-detencion i { display: block; height: 100%; background: var(--rojo); transform-origin: 0 50%; transform: scaleX(0); }

.h-aviso {
  position: absolute; top: calc(var(--st) + 112px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(50vw, 420px); padding: 6px 14px; border-radius: 999px; text-align: center;
  font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: 0.04em;
  background: rgba(9, 13, 24, 0.7); border: 1px solid var(--borde);
}
.h-aviso.peligro { color: #fff; background: rgba(160, 18, 42, 0.86); border-color: var(--rojo); }
.h-aviso.bien { color: var(--verde); border-color: rgba(61, 220, 132, 0.5); }

.h-grande {
  position: absolute; top: 34%; left: 0; right: 0; text-align: center; opacity: 0;
  font-family: var(--display); font-weight: 800; font-size: clamp(38px, 9vw, 80px); letter-spacing: 0.04em; line-height: 1;
  text-shadow: 0 0 24px rgba(0, 0, 0, 0.6), 0 2px 0 rgba(0, 0, 0, 0.6);
}
.h-grande.on { opacity: 1; }
.h-grande.entra { animation: golpe 0.34s cubic-bezier(0.2, 1.6, 0.4, 1); }
.h-grande.rojo { color: var(--rojo); }
.h-grande.ambar { color: var(--ambar); }
.h-grande.verde { color: var(--verde); }
.h-grande.libre { color: var(--verde); font-size: clamp(50px, 13vw, 116px); }
.h-grande.hueco { color: var(--cian); }
.h-grande.bien { color: var(--verde); }
@keyframes golpe { 0% { transform: scale(1.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.h-radio {
  position: absolute; bottom: calc(var(--sb) + 84px); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(44vw, 340px); padding: 6px 11px; border-radius: 10px; background: rgba(6, 9, 16, 0.72);
  border-left: 3px solid var(--azul); font-size: 13px; line-height: 1.3;
}
.h-radio[data-quien="central"] { border-left-color: var(--cian); }
.h-radio .quien { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--azul); }
.h-radio[data-quien="central"] .quien { color: var(--cian); }
.h-pista {
  position: absolute; top: calc(var(--st) + 104px); left: calc(var(--sl) + 14px);
  width: min(28vw, 240px); padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.35;
  background: rgba(40, 28, 4, 0.78); border: 1px solid rgba(255, 176, 32, 0.6); color: #FFE7B8; text-shadow: none;
  animation: aparece-izq 0.35s ease-out;
}
@keyframes aparece-izq { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes aparece { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ------------------------------------------------------------------ mandos */
.controles { position: absolute; inset: 0; pointer-events: none; }
.ctl {
  position: absolute; pointer-events: auto; touch-action: none; width: var(--b); height: var(--b); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; padding: 0;
  font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.86);
  background: rgba(12, 17, 30, 0.28); border: 1.5px solid rgba(255, 255, 255, 0.22);
  transition: transform 0.06s, background 0.06s, opacity 0.45s;
}
/* En reposo (2,5 s sin tocar la pantalla) los mandos se apagan casi del todo; cualquier toque los enciende. */
.controles[data-reposo="1"] .ctl:not(.on):not(.motor):not(.reversa) { opacity: 0.32; }
.controles[data-reposo="1"] .ctl.pausa:not(.on), .controles[data-reposo="1"] .ctl.cam:not(.on), .controles[data-reposo="1"] .ctl.mirar:not(.on) { opacity: 0.18; }
.ctl.on { background: rgba(255, 255, 255, 0.28); transform: scale(0.94); }
/* Zona de toque invisible más grande que el dibujo (dibujo 56 px, toque 76 px): se acierta sin tapar la carretera. */
.ctl::before { content: ''; position: absolute; inset: -10px; border-radius: inherit; }
.ctl.pausa::before, .ctl.cam::before, .ctl.mirar::before { inset: -3px; }
.ctl.motor::before, .ctl.reversa::before { inset: -4px; }
.ctl.freno { border-color: rgba(255, 51, 85, 0.7); }
.ctl.nitro { border-color: rgba(127, 227, 255, 0.8); color: var(--cian); }
.ctl.gas { border-color: rgba(61, 220, 132, 0.7); }
.ctl.mano { font-size: 12px; }
.ctl.izq, .ctl.der { font-size: 22px; width: calc(var(--b) * 1.15); height: calc(var(--b) * 1.15); }
/* Columna de la derecha, arriba: pausa, cámara y mirar atrás (este se mantiene pulsado). */
.ctl.pausa, .ctl.cam, .ctl.mirar { width: 38px; height: 38px; right: calc(var(--sr) + 10px); }
.ctl.pausa { top: calc(var(--st) + 8px); font-size: 14px; }
.ctl.cam { top: calc(var(--st) + 52px); font-size: 16px; }
.ctl.mirar { top: calc(var(--st) + 96px); font-size: 18px; }
/* Motor y marcha atrás: solo con el coche parado, encima del pulgar izquierdo. */
.ctl.motor, .ctl.reversa { width: 78px; height: 38px; border-radius: 19px; font-size: 13px; bottom: calc(var(--sb) + 28px + var(--b) * 1.2); }
.ctl.motor { left: calc(var(--sl) + 14px); }
.ctl.reversa { left: calc(var(--sl) + 100px); }
.controles:not([data-parado="1"]) .motor, .controles:not([data-parado="1"]) .reversa { display: none; }
.controles[data-motor="0"] .motor { background: rgba(255, 176, 32, 0.3); border-color: var(--ambar); color: var(--ambar); animation: parpadeo 1s steps(2) infinite; }
.controles[data-motor="0"] .reversa { display: none; }

/* Botones: izquierda y derecha con el pulgar izquierdo; freno, mano, nitro (y gas) con el derecho. */
.controles[data-modo="botones"] .izq { left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .der { left: calc(var(--sl) + 34px + var(--b) * 1.15); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .freno { right: calc(var(--sr) + 34px + var(--b)); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .mano { right: calc(var(--sr) + 34px + var(--b)); bottom: calc(var(--sb) + 36px + var(--b)); }
.controles[data-modo="botones"] .nitro { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"][data-auto="0"] .gas { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"][data-auto="0"] .nitro { bottom: calc(var(--sb) + 36px + var(--b)); }
/* Inclinación: pulgar izquierdo, freno y freno de mano; derecho, nitro (y gas). */
.controles[data-modo="inclinacion"] .izq, .controles[data-modo="inclinacion"] .der { display: none; }
.controles[data-modo="inclinacion"] .freno { left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"] .mano { left: calc(var(--sl) + 36px + var(--b) * 1.2); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="inclinacion"] .nitro { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"][data-auto="0"] .gas { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"][data-auto="0"] .nitro { right: calc(var(--sr) + 36px + var(--b) * 1.2); width: var(--b); height: var(--b); }
.controles[data-auto="1"] .gas { display: none; }
/* Pedal (v6): alto, y cuanto más arriba el pulgar, más gas; el nivel se ve dentro. */
.ctl.gas { overflow: hidden; }
.ctl.gas span { position: relative; }
.ctl.gas i.nivel { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pedal, 0) * 100%); background: rgba(61, 220, 132, 0.3); pointer-events: none; }
.ctl.gas:not(.on) i.nivel { height: 0; }
.controles[data-acel="pedal"] .gas { height: calc(var(--b) * 1.9); border-radius: 16px; align-items: flex-start; padding-top: 10px; }
.controles[data-modo="botones"][data-acel="pedal"] .nitro { bottom: calc(var(--sb) + 36px + var(--b) * 1.9); }
.controles[data-modo="inclinacion"][data-acel="pedal"] .gas { height: calc(var(--b) * 1.9); }
/* Crucero: zona invisible encima del velocímetro. */
.ctl.crucero { left: 50%; margin-left: -75px; bottom: calc(var(--sb) + 4px); width: 150px; height: 74px; border: 0; background: transparent; border-radius: 14px; }
.ctl.crucero::before { inset: -2px; }
.ctl.crucero.on { background: rgba(127, 227, 255, 0.08); transform: none; }
.controles[data-reposo="1"] .ctl.crucero { opacity: 1; }

/* En vertical la pantalla es estrecha: el velocímetro sube por encima de los mandos y el minimapa va a la izquierda. */
@media (orientation: portrait) {
  :root { --b: 54px; --retro: min(36vw, 170px); }
  .h-botin .chapas { font-size: 26px; }
  .h-mapa { top: calc(var(--st) + 92px); right: auto; left: calc(var(--sl) + 12px); width: min(24vw, 92px); height: min(24vw, 92px); }
  .h-velo { bottom: calc(var(--sb) + 30px + var(--b) * 2.3); width: 130px; }
  .ctl.crucero { bottom: calc(var(--sb) + 24px + var(--b) * 2.3); margin-left: -70px; width: 140px; }
  .h-velo .kmh { font-size: 36px; }
  .h-aviso { top: calc(34% + 92px); max-width: calc(100vw - 32px); }
  .h-detencion { top: calc(34% + 136px); width: min(70vw, 280px); }
  .h-radio { bottom: calc(var(--sb) + 116px + var(--b) * 2.3); max-width: calc(100vw - 32px); }
  .h-pista { top: auto; left: 50%; bottom: calc(var(--sb) + 186px + var(--b) * 2.3); width: min(88vw, 420px); transform: translateX(-50%); animation: aparece 0.35s ease-out; }
  .h-lanzada { top: 56%; }
}

/* ------------------------------------------------------------------ menú */
.menu {
  position: absolute; inset: 0; pointer-events: auto; display: flex; align-items: center; justify-content: center;

const ANCHO_CARRIL = 3.6;

const TRAMOS = (() => {
  const nombres = ['la Ronda Norte', 'la curva del Nordeste', 'la Ronda Este', 'la curva del Sudeste',
    'la Ronda Sur', 'la curva del Suroeste', 'la Ronda Oeste', 'la curva del Noroeste'];
  const rectas = [
    { ax: -N, ay: N + R, tx: 1, ty: 0, nx: 0, ny: 1 },
    { ax: N + R, ay: N, tx: 0, ty: -1, nx: 1, ny: 0 },
    { ax: N, ay: -N - R, tx: -1, ty: 0, nx: 0, ny: -1 },
    { ax: -N - R, ay: -N, tx: 0, ty: 1, nx: -1, ny: 0 },
  ];
  const arcos = [
    { cx: N, cy: N, a0: Math.PI / 2 },
    { cx: N, cy: -N, a0: 0 },
    { cx: -N, cy: -N, a0: -Math.PI / 2 },
    { cx: -N, cy: N, a0: Math.PI },
  ];
  const t = [];
  let s = 0;
  for (let i = 0; i < 4; i++) {
    t.push({ tipo: 'recta', s0: s, s1: s + REC, nombre: nombres[2 * i], ...rectas[i] });
    s += REC;
    t.push({ tipo: 'arco', s0: s, s1: s + ARC, nombre: nombres[2 * i + 1], ...arcos[i] });
    s += ARC;
  }
  return t;
})();
const TRAMOS_RONDA = TRAMOS;

function normS(s) {
  s %= LARGO_RONDA;
  return s < 0 ? s + LARGO_RONDA : s;
}
// Diferencia más corta a − b a lo largo del anillo, con signo.
function difS(a, b) {
  let d = normS(a - b);
  if (d > LARGO_RONDA / 2) d -= LARGO_RONDA;
  return d;
}
function tramoDe(s) {
  const par = REC + ARC;
  const i = Math.min(3, Math.floor(s / par));
  return TRAMOS[s - i * par < REC ? 2 * i : 2 * i + 1];
}
function tramoNombre(s) {
  return tramoDe(normS(s)).nombre;
}
function esCurva(s) {
  return tramoDe(normS(s)).tipo === 'arco';
}

// Curvatura (1/m) de la Ronda en s, a la distancia d del eje: en el sentido de la marcha las curvas giran a la derecha (+).
function curvaturaRonda(s, d = 0) {
  return tramoDe(normS(s)).tipo === 'arco' ? 1 / Math.max(R + d, 20) : 0;
}

// Punto de la Ronda a la distancia s y el desplazamiento lateral d, con su tangente (sentido horario) y normal (hacia fuera).
function rondaPunto(s, d = 0) {
  s = normS(s);
  const t = tramoDe(s);
  if (t.tipo === 'recta') {
    const u = s - t.s0;
    return { x: t.ax + t.tx * u + t.nx * d, y: t.ay + t.ty * u + t.ny * d, tx: t.tx, ty: t.ty, nx: t.nx, ny: t.ny };
  }
  const a = t.a0 - (s - t.s0) / R;
  const c = Math.cos(a), sn = Math.sin(a);
  return { x: t.cx + (R + d) * c, y: t.cy + (R + d) * sn, tx: sn, ty: -c, nx: c, ny: sn };
}

// Coordenadas (s, d) de la Ronda para cualquier punto.
function rondaProyectar(x, y) {
  const qx = clamp(x, -N, N), qy = clamp(y, -N, N);
  const vx = x - qx, vy = y - qy;
  const r = Math.hypot(vx, vy);
  if (r < 1e-9) return { s: 0, d: -R - Math.min(N - Math.abs(x), N - Math.abs(y)) };
  const d = r - R;
  const enX = Math.abs(qx) < N, enY = Math.abs(qy) < N;
  let s;
  if (qy === N && enX) s = qx + N;
  else if (qx === N && qy === N) s = REC + (Math.PI / 2 - Math.atan2(vy, vx)) * R;
  else if (qx === N && enY) s = REC + ARC + (N - qy);
  else if (qx === N && qy === -N) s = 2 * REC + ARC - Math.atan2(vy, vx) * R;
  else if (qy === -N && enX) s = 2 * REC + 2 * ARC + (N - qx);
  else if (qx === -N && qy === -N) s = 3 * REC + 2 * ARC + (-Math.PI / 2 - Math.atan2(vy, vx)) * R;
  else if (qx === -N && enY) s = 3 * REC + 3 * ARC + (qy + N);
  else s = 4 * REC + 3 * ARC + (Math.PI - Math.atan2(vy, vx)) * R;
  return { s: normS(s), d };
}

// ------------------------------------------------------------------ la rasante de la Ronda Sur
const CIMA = { s: 2 * REC + 2 * ARC + N, medio: 110, alto: 6 };
function alturaRonda(s) {
  const u = Math.abs(difS(s, CIMA.s));
  return u >= CIMA.medio ? 0 : CIMA.alto * 0.5 * (1 + Math.cos(Math.PI * u / CIMA.medio));
}
function alturaEn(x, y) {
  if (y > -255 || x < -115 || x > 115) return 0;
  const p = rondaProyectar(x, y);
  const a = Math.abs(p.d);
  if (a >= 22) return 0;
  const h = alturaRonda(p.s);
  return a <= 15 ? h : (h * (22 - a)) / 7;
}

// ------------------------------------------------------------------ el barrio
const BARRIO = 230;
const CALLES_NS = [
  { x: -225, ancho: 10, nombre: 'la calle de Poniente' },
  { x: -150, ancho: 9, nombre: 'la calle de las Palmeras' },
  { x: -75, ancho: 9, nombre: 'la calle Mayor' },
  { x: 0, ancho: 16, nombre: 'la avenida Central' },
  { x: 75, ancho: 9, nombre: 'la calle del Hospital' },
  { x: 150, ancho: 9, nombre: 'la calle de la Cerámica' },
  { x: 225, ancho: 10, nombre: 'la calle de Levante' },
];
const CALLES_EO = [
  { y: -225, ancho: 10, nombre: 'la calle de la Estación' },
  { y: -150, ancho: 9, nombre: 'la calle del Faro' },
  { y: -75, ancho: 9, nombre: 'la calle de la Aduana' },
  { y: 0, ancho: 16, nombre: 'la avenida del Puerto' },
  { y: 75, ancho: 9, nombre: 'la calle de los Naranjos' },
  { y: 150, ancho: 9, nombre: 'la calle de San Telmo' },
  { y: 225, ancho: 10, nombre: 'la calle del Mirador' },
];
const TUNEL = { x0: -8, x1: 8, y0: -138, y1: -87, nombre: 'el túnel de la avenida Central' };
const PARKING = { x0: -145.5, x1: -79.5, y0: 79.5, y1: 145.5, nombre: 'el parking de la Ribera' };
const CALLEJONES = [
  { x0: 37.4, x1: 40.6, y0: 79.5, y1: 145.5, nombre: 'el callejón del Gato' },
  { x0: -145.5, x1: -79.5, y0: -40.6, y1: -37.4, nombre: 'el callejón del Horno' },
];
const GLORIETA = { x: 0, y: 0, r: 9, rExt: 26, nombre: 'la glorieta del Puerto' };
// v8: el taller, en el carril derecho de la avenida del Puerto hacia el este (acera sur), entre la calle del Hospital
// y la de la Cerámica. El recuadro es donde tiene que quedar el centro de tu coche.
const TALLER = { x0: 100, x1: 112, y0: -8, y1: -3.6, x: 106, y: -5.8, puerta: -11, nombre: 'el taller del Puerto' };

// Rampas: cuartos de círculo de 39,5 m de radio entre el carril lento de la Ronda y una calle del borde del barrio.
// a0 → a1 es el sentido de la marcha (las salidas van de la Ronda al barrio; las entradas, al revés).
const RAMPA_R = 39.5;
const RAMPA_MEDIO = 4.3;
const RAMPAS = [
  { id: 'S1', tipo: 'salida', cx: 230, cy: 114.5, a0: 0, a1: -Math.PI / 2, barrio: [225, 75], nombre: 'la salida de los Naranjos' },
  { id: 'E1', tipo: 'entrada', cx: 230, cy: -114.5, a0: Math.PI / 2, a1: 0, barrio: [225, -75], nombre: 'la entrada de la Aduana' },
  { id: 'S2', tipo: 'salida', cx: -230, cy: -114.5, a0: Math.PI, a1: Math.PI / 2, barrio: [-225, -75], nombre: 'la salida de la Aduana' },
  { id: 'E2', tipo: 'entrada', cx: -230, cy: 114.5, a0: -Math.PI / 2, a1: -Math.PI, barrio: [-225, 75], nombre: 'la entrada de los Naranjos' },
];
for (const r of RAMPAS) {
  const a = r.tipo === 'salida' ? r.a0 : r.a1;
  const p = rondaProyectar(r.cx + RAMPA_R * Math.cos(a), r.cy + RAMPA_R * Math.sin(a));
  r.sUnion = p.s;
  // Tramo de guardarraíl que se abre: hasta donde el muro exterior de la rampa cruza la línea del guardarraíl.
  r.hueco = r.tipo === 'salida' ? [r.sUnion - 2, r.sUnion + 27.7] : [r.sUnion - 27.7, r.sUnion + 2];
}

function dentro(c, x, y) {
  return x >= c.x0 && x <= c.x1 && y >= c.y0 && y <= c.y1;
}

// Manzanas: el espacio entre calles. Las cuatro del centro se recortan para la glorieta; dos se parten con un callejón.
function manzanas() {
  const out = [];
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 6; j++) {
      const a = CALLES_NS[i], b = CALLES_NS[i + 1], c = CALLES_EO[j], d = CALLES_EO[j + 1];
      const m = { x0: a.x + a.ancho / 2, x1: b.x - b.ancho / 2, y0: c.y + c.ancho / 2, y1: d.y - d.ancho / 2 };
      const cx = (m.x0 + m.x1) / 2, cy = (m.y0 + m.y1) / 2;
      if (dentro(PARKING, cx, cy)) continue;
      if (Math.abs(cx) < 75 && Math.abs(cy) < 75) {
        const sx = Math.sign(cx), sy = Math.sign(cy);
        const q = GLORIETA.rExt;
        out.push(sx > 0 ? { x0: q, x1: m.x1, y0: m.y0, y1: m.y1 } : { x0: m.x0, x1: -q, y0: m.y0, y1: m.y1 });
        const bx0 = sx > 0 ? m.x0 : -q, bx1 = sx > 0 ? q : m.x1;
        out.push(sy > 0 ? { x0: bx0, x1: bx1, y0: q, y1: m.y1 } : { x0: bx0, x1: bx1, y0: m.y0, y1: -q });
        continue;
      }
      let partida = false;
      for (const cj of CALLEJONES) {
        if (!dentro(m, (cj.x0 + cj.x1) / 2, (cj.y0 + cj.y1) / 2)) continue;
        partida = true;
        if (cj.x1 - cj.x0 < cj.y1 - cj.y0) {
          out.push({ x0: m.x0, x1: cj.x0, y0: m.y0, y1: m.y1 }, { x0: cj.x1, x1: m.x1, y0: m.y0, y1: m.y1 });
        } else {
          out.push({ x0: m.x0, x1: m.x1, y0: m.y0, y1: cj.y0 }, { x0: m.x0, x1: m.x1, y0: cj.y1, y1: m.y1 });
        }
      }
      if (!partida) out.push(m);
    }
  }
  return out;
}

const COLORES_FACHADA = ['#2B2F3A', '#34303A', '#2A3640', '#3A3530', '#2F3A34', '#3B3F4A', '#3A2F33', '#2D3440'];

// Edificios dentro de cada manzana, con 3 m de acera. Mismo resultado siempre: la ciudad no cambia entre partidas.
function edificios(lista) {
  const azar = crearAzar(20260925);
  const out = [];
  for (const m of lista) {
    const x0 = m.x0 + 3, x1 = m.x1 - 3, y0 = m.y0 + 3, y1 = m.y1 - 3;
    const w = x1 - x0, h = y1 - y0;
    if (w < 3 || h < 3) continue;
    const enX = w >= h, L = enX ? w : h;
    const n = L > 45 ? azar.entero(2, 3) : L > 22 ? azar.entero(1, 2) : 1;
    const cortes = [0];
    for (let i = 1; i < n; i++) cortes.push(i / n + azar.rango(-0.07, 0.07));
    cortes.push(1);
    const centro = Math.max(Math.abs((m.x0 + m.x1) / 2), Math.abs((m.y0 + m.y1) / 2));
    for (let i = 0; i < n; i++) {
      const hueco = i < n - 1 ? 1 : 0;
      const e = enX
        ? { x0: x0 + cortes[i] * w, x1: x0 + cortes[i + 1] * w - hueco, y0, y1 }
        : { x0, x1, y0: y0 + cortes[i] * h, y1: y0 + cortes[i + 1] * h - hueco };
      const alto = centro < 110 ? azar.rango(16, 34) : azar.rango(8, 21);
      e.alto = Math.round(alto);
      e.color = azar.elegir(COLORES_FACHADA);
      e.semilla = azar.num() * 100;
      out.push(e);
    }
  }
  // Una torre que se ve desde toda la ciudad, para orientarse.
  let torre = null, mejor = Infinity;
  for (const e of out) {
    const d = dist((e.x0 + e.x1) / 2, (e.y0 + e.y1) / 2, 40, -40);
    if (d < mejor) { mejor = d; torre = e; }
  }
  if (torre) torre.alto = 58;
  return out;
}

// ------------------------------------------------------------------ construcción
function crearMapa({ rampasAbiertas = true } = {}) {
  const cajas = [];     // sólidos para chocar: { x0, y0, x1, y1, tipo }
  const muros = [];     // muros de una cara: { ax, ay, bx, by, nx, ny, alto, tipo }
  const circulos = [{ x: GLORIETA.x, y: GLORIETA.y, r: GLORIETA.r }];
  const pantallas = []; // cortan la visión: { ax, ay, bx, by, alto }
  const aparcados = []; // coches aparcados: { x, y, h, ancho, largo }
  const farolas = [];   // { x, y, h, tipo }

  const listaManzanas = manzanas();
  for (const m of listaManzanas) cajas.push({ ...m, tipo: 'manzana' });
  const listaEdificios = edificios(listaManzanas);
  // Paredes del túnel: cortan la visión lateral.
  listaEdificios.push(
    { x0: TUNEL.x0 - 0.4, x1: TUNEL.x0, y0: TUNEL.y0, y1: TUNEL.y1, alto: 6, color: '#252A33', tunel: true },
    { x0: TUNEL.x1, x1: TUNEL.x1 + 0.4, y0: TUNEL.y0, y1: TUNEL.y1, alto: 6, color: '#252A33', tunel: true },
  );

  // Parking: tapia baja con dos entradas y filas de coches aparcados con huecos para meterse.
  const P = PARKING, gr = 0.4;
  cajas.push(
    { x0: P.x0, x1: -116.5, y0: P.y0, y1: P.y0 + gr, tipo: 'tapia' },
    { x0: -108.5, x1: P.x1, y0: P.y0, y1: P.y0 + gr, tipo: 'tapia' },
    { x0: P.x0, x1: P.x1, y0: P.y1 - gr, y1: P.y1, tipo: 'tapia' },
    { x0: P.x0, x1: P.x0 + gr, y0: P.y0, y1: 96, tipo: 'tapia' },
    { x0: P.x0, x1: P.x0 + gr, y0: 104, y1: P.y1, tipo: 'tapia' },
    { x0: P.x1 - gr, x1: P.x1, y0: P.y0, y1: P.y1, tipo: 'tapia' },
  );
  for (const fy of [88.5, 93.1, 108.6, 113.2, 126.6, 131.2]) {
    for (let x = -141; x <= -84; x += 4.2) {
      if (Math.abs(x + 112.5) < 3.8) continue;
      const h = fy === 88.5 || fy === 108.6 || fy === 126.6 ? Math.PI : 0;
      aparcados.push({ x, y: fy, h, ancho: 1.8, largo: 4.2 });
      cajas.push({ x0: x - 0.9, x1: x + 0.9, y0: fy - 2.1, y1: fy + 2.1, tipo: 'aparcado' });
    }
  }

  // Muros de la Ronda: mediana (cara al barrio) y guardarraíl interior, con huecos en las rampas abiertas.
  const tramosS = (s0, s1, paso) => {
    const out = [];
    const n = Math.max(1, Math.ceil((s1 - s0) / paso));
    for (let i = 0; i <= n; i++) out.push(s0 + ((s1 - s0) * i) / n);
    return out;
  };
  const muroRonda = (s0, s1, d, haciaFuera, alto, tipo) => {
    for (const t of TRAMOS) {
      const a = Math.max(s0, t.s0), b = Math.min(s1, t.s1);
      if (b - a < 0.01) continue;
      const ss = tramosS(a, b, t.tipo === 'recta' ? 1000 : 6);
      for (let i = 0; i < ss.length - 1; i++) {
        const p = rondaPunto(ss[i], d), q = rondaPunto(ss[i + 1], d);
        const m = rondaPunto((ss[i] + ss[i + 1]) / 2, d);
        const sg = haciaFuera ? 1 : -1;
        muros.push({ ax: p.x, ay: p.y, bx: q.x, by: q.y, nx: m.nx * sg, ny: m.ny * sg, alto, tipo });
      }
    }
  };
  muroRonda(0, LARGO_RONDA, D_MEDIANA, false, 1, 'mediana');
  const huecos = rampasAbiertas ? RAMPAS.map((r) => r.hueco).sort((a, b) => a[0] - b[0]) : [];
  let s = 0;
  const tramosGuarda = [];
  for (const h of huecos) {
    tramosGuarda.push([s, h[0]]);
    s = h[1];
  }
  tramosGuarda.push([s, LARGO_RONDA]);
  for (const [a, b] of tramosGuarda) {
    muroRonda(a, b, D_GUARDA, true, 1, 'guardarrail');
    // Pantallas acústicas sobre el guardarraíl: esconden el barrio y cortan la vista en las curvas.
    for (const t of TRAMOS) {
      const a2 = Math.max(a, t.s0), b2 = Math.min(b, t.s1);
      if (b2 - a2 < 0.01) continue;
      const ss = tramosS(a2, b2, t.tipo === 'recta' ? 1000 : 6);
      for (let i = 0; i < ss.length - 1; i++) {
        const p = rondaPunto(ss[i], D_GUARDA - 0.3), q = rondaPunto(ss[i + 1], D_GUARDA - 0.3);
        pantallas.push({ ax: p.x, ay: p.y, bx: q.x, by: q.y, alto: 4 });
      }
    }
  }

  // Rampas: muro interior entero y muro exterior solo fuera de la Ronda.
  const arcoMuro = (r, radio, desde, hasta, haciaCentro) => {
    const n = Math.max(2, Math.ceil(Math.abs(hasta - desde) / (Math.PI / 24)));
    for (let i = 0; i < n; i++) {
      const u0 = desde + ((hasta - desde) * i) / n, u1 = desde + ((hasta - desde) * (i + 1)) / n, um = (u0 + u1) / 2;
      const sg = haciaCentro ? -1 : 1;
      muros.push({
        ax: r.cx + radio * Math.cos(u0), ay: r.cy + radio * Math.sin(u0),
        bx: r.cx + radio * Math.cos(u1), by: r.cy + radio * Math.sin(u1),
        nx: Math.cos(um) * sg, ny: Math.sin(um) * sg, alto: 1, tipo: 'rampa',
      });
    }
  };
  const cruce = Math.acos((265.5 - 230) / (RAMPA_R + RAMPA_MEDIO)); // ≈ 35,8°
  if (rampasAbiertas) {
    for (const r of RAMPAS) {
      const sentido = Math.sign(r.a1 - r.a0);
      arcoMuro(r, RAMPA_R - RAMPA_MEDIO, r.a0, r.a1, false);
      if (r.tipo === 'salida') arcoMuro(r, RAMPA_R + RAMPA_MEDIO, r.a0 + sentido * cruce, r.a1, true);
      else arcoMuro(r, RAMPA_R + RAMPA_MEDIO, r.a0, r.a1 - sentido * cruce, true);
    }
  }

  // Borde del barrio: muro con normal hacia dentro y huecos donde llegan las rampas.
  const ladosBarrio = [
    { fijo: 'x', v: BARRIO, nx: -1, ny: 0 },
    { fijo: 'x', v: -BARRIO, nx: 1, ny: 0 },
    { fijo: 'y', v: BARRIO, nx: 0, ny: -1 },
    { fijo: 'y', v: -BARRIO, nx: 0, ny: 1 },
  ];
  for (const l of ladosBarrio) {
    const abiertos = [];
    if (rampasAbiertas) {
      for (const r of RAMPAS) {
        const [bx, by] = r.barrio;
        const lado = Math.sign(bx) * BARRIO;
        if (l.fijo === 'x' && lado === l.v) abiertos.push([by - 4.5, by + 4.5]);
      }
    }
    abiertos.sort((a, b) => a[0] - b[0]);
    let c = -BARRIO;
    const trozos = [];
    for (const [a, b] of abiertos) { trozos.push([c, a]); c = b; }
    trozos.push([c, BARRIO]);
    for (const [a, b] of trozos) {
      if (l.fijo === 'x') muros.push({ ax: l.v, ay: a, bx: l.v, by: b, nx: l.nx, ny: l.ny, alto: 0.9, tipo: 'borde' });
      else muros.push({ ax: a, ay: l.v, bx: b, by: l.v, nx: l.nx, ny: l.ny, alto: 0.9, tipo: 'borde' });
    }
  }

  // Farolas: en la mediana de la Ronda cada 30 m (el ritmo de la velocidad) y en las aceras del barrio.
  for (let s2 = 0; s2 < LARGO_RONDA - 1; s2 += 30) {
    const p = rondaPunto(s2, 0);
    farolas.push({ x: p.x, y: p.y, h: 11, tipo: 'mediana', s: s2 });
  }
  const cercaCruce = (v, lista) => lista.some((c) => Math.abs(v - c) < 8);
  CALLES_NS.forEach((c, i) => {
    let lado = i % 2 ? 1 : -1;
    for (let y = -BARRIO + 12; y <= BARRIO - 12; y += 28) {
      lado = -lado;
      if (cercaCruce(y, CALLES_EO.map((e) => e.y))) continue;
      const x = c.x + lado * (c.ancho / 2 + 1.2), yy = y;
      if (dentro(TUNEL, c.x, yy) || Math.hypot(x, yy) < GLORIETA.rExt + 4 || dentro(PARKING, x, yy)) continue;
      farolas.push({ x, y: yy, h: 7, tipo: 'calle' });
    }
  });
  CALLES_EO.forEach((c, i) => {
    let lado = i % 2 ? 1 : -1;
    for (let x = -BARRIO + 12; x <= BARRIO - 12; x += 28) {
      lado = -lado;

};
const MARCHAS = [0, 0.21, 0.37, 0.53, 0.69, 0.85];
const MODELOS = {};
for (const [id, m] of Object.entries(BASE)) {
  MODELOS[id] = {
    visibilidad: 1, fijar: 0.3, danioMotor: 0.3, aguante: 1, carga: 0, respuesta: 1, nitroDura: 1,
    sonido: { cil: 4, escala: 1, brillo: 1, volumen: 1, graves: 1, turbo: m.turbo ? 1 : 0 },
    ...m,
    id,
    // Resistencia al aire calculada para que la punta salga justo en vMax.
    k: (m.potencia / m.vMax - 0.15) / (m.vMax * m.vMax),
    // Velocidades de cambio a la marcha siguiente (1.ª a 5.ª).
    marchas: MARCHAS.map((f) => f * m.vMax),
  };
}

// v8: una copia del modelo con más motor y más agarre (la policía de los rangos altos). Con la misma resistencia al aire,
// la punta sale de potencia = 0,15·v + k·v³: un 25 % más de motor da un 8 % más de punta.
// v10: también las mejoras del taller (carrera.js): frenos, dirección, nitro y blindaje. Cada cifra es un multiplicador
// (1 = de serie). La potencia va por kilo: el blindaje, que pesa, se la reparte entre más kilos.
function modeloMejorado(id, mult = {}) {
  const b = MODELOS[id];
  const { potencia = 1, agarre = 1, frenada = 1, giroMax = 1, respuesta = 1, masa = 1, aguante = 1, visibilidad = 1, nitroDura = 1 } = mult;
  if ([potencia, agarre, frenada, giroMax, respuesta, masa, aguante, visibilidad, nitroDura].every((x) => x === 1)) return b;
  const P = (b.potencia * potencia) / masa;
  let v = b.vMax;
  for (let i = 0; i < 30; i++) v -= (0.15 * v + b.k * v * v * v - P) / (0.15 + 3 * b.k * v * v);
  return {
    ...b, potencia: P, agarre: b.agarre * agarre, vMax: v, marchas: MARCHAS.map((f) => f * v),
    frenada: b.frenada * frenada, giroMax: b.giroMax * giroMax, respuesta: b.respuesta * respuesta, masa: b.masa * masa,
    aguante: b.aguante * aguante, visibilidad: b.visibilidad * visibilidad, nitroDura: b.nitroDura * nitroDura,
  };
}

// derrape: 2 automática, 1 media, 0 manual · agarre: agarre extra del coche del jugador (dirección asistida, 25/09)
const ASISTENCIA = { direccion: true, derrape: 2, agarre: 1.5 };
const BETA_MAX = [Infinity, 0.8, 0.58];

// Agarre lateral útil (m/s²). c.agil es la dirección asistida: el jugador, 1,5 veces el agarre a partir de 40 m/s
// y hasta 0,4 más a poca velocidad, para las esquinas del barrio. La policía lleva menos (policia.js, AGIL_POLICIA).
function agilDe(c, v) {
  const extra = c.agil || 1;
  return extra > 1 ? extra + 0.4 * clamp((40 - v) / 25, 0, 1) : 1;
}
function agarreDe(c, v) {
  const alerones = c.m.carga ? 1 + c.m.carga * Math.min(1, (v / c.m.vMax) ** 2) : 1;
  return c.m.agarre * alerones * agilDe(c, v) * (c.pinchado ? 0.72 : 1) * (1 - 0.15 * c.danio) * (c.sacudida > 0 ? 0.55 : 1);
}
// Ángulo de volante máximo: con ayuda, el giro a tope gasta justo el agarre a cualquier velocidad.
function giroMaxDe(c, v, asist = ASISTENCIA) {
  return Math.min(c.m.giroMax, Math.atan((c.m.ejes * agarreDe(c, v) * (asist.direccion ? 1.1 : 1.6)) / Math.max(v * v, 1)));
}

// Círculos que forman el coche para chocar: a lo largo de su eje, con radio = medio ancho.
function circulosDe(largo, ancho) {
  const n = Math.max(2, Math.round(largo / ancho));
  const r = ancho / 2, tramo = largo / 2 - r;
  const out = [];
  for (let i = 0; i < n; i++) out.push({ o: n === 1 ? 0 : -tramo + (2 * tramo * i) / (n - 1), r });
  return out;
}

// modelo: el nombre (rayo, lince…) o un modelo ya hecho (modeloMejorado).
function crearCoche(modelo, x, y, h, v = 0) {
  const m = typeof modelo === 'string' ? MODELOS[modelo] : modelo;
  return {
    modelo: m.id, m, x, y, h,
    vx: Math.sin(h) * v, vy: Math.cos(h) * v, w: 0,
    vf: v, vl: 0, ax: 0,
    largo: m.largo, ancho: m.ancho, masa: m.masa,
    circulos: circulosDe(m.largo, m.ancho),
    marcha: 1, rpm: 900, turbo: 0, cambio: 0,
    nitro: 0.35, nitroGolpe: 0, nitroSujeto: 0, nitroActivo: false,
    lanzada: 0, salida: 0, salidaMult: 1,
    derrape: false, deriva: 0, sinMano: 0,
    trompo: 0, patina: 0, gasAltoT: 0,
    motor: true, calor: 0.35, marchaAtras: false, frenoParado: 0,
    rebufo: 0, rebufoAntes: 0, tirachinas: 0, tirachinasT: 0, tirachinasF: 0,
    pinchado: false, pinchadoT: 0, danio: 0, sacudida: 0,
    volante: 0, gasAntes: 0,
  };
}

// Velocidad a la que se sube de la marcha g a la siguiente.
function techoMarcha(m, g) {
  return g < 6 ? m.marchas[g] : m.vMax * 1.04;
}

// Un paso de física. e = { dir -1..1 (derecha +), gas 0..1, freno 0..1, mano, nitro (sujeto), nitroToque }.
// Devuelve eventos: { tipo: 'cambio' | 'salidaPerfecta' | 'salidaMala' | 'salidaPatina' | 'nitroGolpe' | 'tirachinas' | 'tiron' }.
function pasoCoche(c, e, dt, asist = ASISTENCIA) {
  const m = c.m, ev = [];
  c.sacudida = Math.max(0, c.sacudida - dt);
  const fx = Math.sin(c.h), fy = Math.cos(c.h), rx = Math.cos(c.h), ry = -Math.sin(c.h);
  let vf = c.vx * fx + c.vy * fy;
  let vl = c.vx * rx + c.vy * ry;
  const vAbs = Math.abs(vf);
  const gas = c.motor ? clamp(e.gas || 0, 0, 1) : 0;
  const freno = clamp(e.freno || 0, 0, 1);
  const mano = !!e.mano && c.trompo <= 0;
  const dir = c.trompo > 0 ? 0 : clamp(e.dir || 0, -1, 1);

  // Pisar a fondo de golpe: el tirón (la presentación hace la pausa de 40 ms y el empujón de cámara).
  if (gas > 0.9 && c.gasAntes < 0.3 && vAbs < 25 && freno < 0.5) ev.push({ tipo: 'tiron' });
  // v9: soltar el gas de golpe a muchas vueltas escupe una llamarada por el escape (el BMW del vídeo del 25/09).
  // Vale también con el pedal o inclinando: basta con haber ido a fondo en el último cuarto de segundo.
  if (gas >= 0.8) c.gasAltoT = 0.25;
  else {
    if (gas <= 0.2 && c.gasAltoT > 0 && c.rpm > 5200 && c.motor && !m.electrico) {
      ev.push({ tipo: 'petardeo' });
      c.gasAltoT = 0;
    }
    c.gasAltoT = Math.max(0, c.gasAltoT - dt);
  }
  c.gasAntes = gas;

  // Salida lanzada: parado, con freno y gas a la vez; la aguja sube y baja, y hay que soltar el freno en la zona verde.
  if (c.motor && vAbs < 1 && freno > 0.5 && gas > 0.5 && !c.marchaAtras) {
    c.lanzada += dt;
    c.rpm = 4500 + 3100 * Math.sin(c.lanzada * 2 * Math.PI * 0.85 - Math.PI / 2);
    vf = 0;
    vl *= 0.5;
  } else if (c.lanzada > 0) {
    if (gas > 0.5 && freno <= 0.5) {
      if (c.rpm >= 5200 && c.rpm <= 7000) { c.salidaMult = 1.45; c.salida = 1.5; ev.push({ tipo: 'salidaPerfecta' }); }
      else if (c.rpm < 5200) { c.salidaMult = 0.7; c.salida = 0.6; ev.push({ tipo: 'salidaMala' }); }
      else { c.salidaMult = 0.85; c.salida = 0.8; ev.push({ tipo: 'salidaPatina' }); }
    }
    c.lanzada = 0;
  }
  if (c.salida > 0) {
    c.salida -= dt;
    if (c.salida <= 0) c.salidaMult = 1;
  }

  // Marcha atrás: freno sujeto con el coche parado.
  if (vAbs < 0.5 && freno > 0.5 && gas < 0.1 && c.lanzada === 0) {
    c.frenoParado += dt;
    if (c.frenoParado > 0.45) c.marchaAtras = true;
  } else if (gas > 0.3) {
    c.marchaAtras = false;
    c.frenoParado = 0;
  } else if (freno < 0.2) {
    c.frenoParado = 0;
  }

  // Turbo: tarda un tercio de segundo en soplar.
  const turboObj = m.turbo && c.motor && gas > 0.6 && c.rpm > 2800 ? 1 : 0;
  c.turbo += (turboObj - c.turbo) * Math.min(1, dt / (turboObj > c.turbo ? 0.35 : 0.12));

  // Nitro en dos tiempos: el toque da el tirón; sujeto, la punta.
  const tiron = 0.08 / m.nitroDura; // v10: el nitro mejorado gasta menos
  if (e.nitroToque && c.nitro >= tiron && c.nitroGolpe <= 0 && c.motor) {
    c.nitroGolpe = 0.6;
    c.nitro -= tiron;
    ev.push({ tipo: 'nitroGolpe' });
  }
  c.nitroGolpe = Math.max(0, c.nitroGolpe - dt);
  c.nitroSujeto = e.nitro ? c.nitroSujeto + dt : 0;
  c.nitroActivo = !!e.nitro && c.nitroSujeto > 0.25 && c.nitro > 0 && c.motor;
  if (c.nitroActivo) c.nitro = Math.max(0, c.nitro - (0.2 * dt) / m.nitroDura);

  // Rebufo y tirachinas: aguantar detrás de un camión carga un empujón para salir de él.
  if (c.rebufo > 0.5) c.tirachinas = Math.min(1, c.tirachinas + dt / 2);
  else if (c.rebufoAntes > 0.5 && c.tirachinas > 0.4) {
    c.tirachinasT = 1;
    c.tirachinasF = c.tirachinas;
    c.tirachinas = 0;
    ev.push({ tipo: 'tirachinas' });
  } else c.tirachinas = Math.max(0, c.tirachinas - dt / 3);
  c.rebufoAntes = c.rebufo;
  c.tirachinasT = Math.max(0, c.tirachinasT - dt);

  // ---- fuerza longitudinal
  let a = 0;
  if (c.lanzada > 0) {
    a = 0;
  } else if (c.marchaAtras) {
    if (freno > 0.1 && c.motor && vf > -7) a = -3.5 * freno;
    if (gas > 0.1) a += 7 * gas;
  } else {
    const traccion = m.traccion * (c.salida > 0 ? c.salidaMult : 1);
    const potencia = m.potencia * (m.turbo ? 0.74 + 0.26 * c.turbo : 1) * (1 - m.danioMotor * c.danio);
    let aMotor = Math.min(traccion, potencia / Math.max(vAbs, 2.5)) * gas;
    if (c.cambio > 0) aMotor = 0;
    if (c.nitroGolpe > 0) aMotor += 8.5 * Math.max(0, 1 - vf / (1.25 * m.vMax));
    if (c.nitroActivo) aMotor += 2.8 * Math.max(0, 1 - (vf / (1.18 * m.vMax)) ** 2);
    if (c.tirachinasT > 0) aMotor += 5 * c.tirachinasF * c.tirachinasT; // unos 9 km/h al salir con la carga llena
    a = aMotor;
    if (freno > 0 && vf > 0) a -= m.frenada * freno;
    else if (freno > 0 && vf < 0) a += m.frenada * freno;
  }
  const kAire = m.k * (1 - 0.28 * clamp(c.rebufo, 0, 1)) * (c.pinchado ? 2.4 : 1);
  a -= kAire * vf * Math.abs(vf) + 0.15 * Math.sign(vf);
  if (mano && vAbs > 1) a -= 2.5 * Math.sign(vf);
  if (c.trompo > 0) a -= 4 * Math.sign(vf);
  if (c.derrape) a -= Math.abs(vl) * 0.25 * Math.sign(vf);
  let nvf = vf + a * dt;
  if (vf > 0 && nvf < 0 && !c.marchaAtras) nvf = 0;
  if (vf < 0 && nvf > 0 && c.marchaAtras && freno > 0.1) nvf = 0;
  if (c.lanzada > 0) nvf = 0;

  // ---- dirección: con ayuda, el giro máximo gasta justo el agarre a cualquier velocidad
  const agarre = agarreDe(c, vAbs);
  const giroMax = giroMaxDe(c, vAbs, asist);
  const delta = dir * giroMax;
  c.volante = dir;
  const wObj = (vf * Math.tan(delta)) / m.ejes;
  const wLim = agarre / Math.max(vAbs, 1);
  c.deriva = Math.atan2(vl, Math.max(vAbs, 0.5));

      tr.barrio.push(c);
      break;
    }
  }

  // Reserva de la dificultad creciente: se crea la última y con su propio azar, así no cambia nada de lo anterior.
  const az = opciones.azarReserva;
  if (az && nRonda > 0) {
    const n = NIVELES_TRAFICO.reduce((t, nv) => t + (nv ? nv.extra : 0), 0);
    for (let i = 0; i < n; i++) {
      const c = nuevo(id++, i % 5 === 0 ? 'camion' : i % 5 === 1 ? 'furgo' : 'coche', az, 'ronda');
      c.oculto = true;
      tr.reserva.push(c);
    }
  }
  return tr;
}

// Sube el tráfico de la Ronda al nivel dado: saca de la reserva los vehículos de ese nivel y los pone en huecos libres
// a más de 320 m de cada cuerpo de «lejosDe» (tú). Devuelve cuántos han entrado.
function subirTrafico(tr, nivel, lejosDe, azar) {
  const cfg = NIVELES_TRAFICO[nivel];
  if (!cfg || nivel <= tr.nivel) return 0;
  tr.nivel = nivel;
  tr.pausa = cfg.pausa;
  const sLejos = lejosDe.map((b) => rondaProyectar(b.x, b.y).s);
  const ocupados = [[], [], []];
  for (const c of tr.ronda) ocupados[c.carril].push({ s: c.s, largo: c.largo });
  let n = 0;
  for (let k = 0; k < cfg.extra && tr.reserva.length; k++) {
    const c = tr.reserva[tr.reserva.length - 1];
    for (let intento = 0; intento < 80; intento++) {
      const carril = c.tipo === 'camion' ? (cfg.camionCentro && azar.probabilidad(0.4) ? 1 : 2) : c.tipo === 'furgo' ? azar.entero(1, 2) : azar.entero(0, 2);
      const s = azar.rango(0, LARGO_RONDA);
      if (sLejos.some((sj) => Math.abs(difS(s, sj)) < LEJOS_ENTRAR)) continue;
      if (ocupados[carril].some((o) => Math.abs(difS(o.s, s)) < (o.largo + c.largo) / 2 + 22)) continue;
      ocupados[carril].push({ s, largo: c.largo });
      tr.reserva.pop();
      c.oculto = false;
      c.s = s;
      c.carril = carril;
      c.d = CARRILES[carril];
      c.v = c.vDes;
      c.cambioT = azar.rango(1, 4);
      c.apartado = 0;
      colocarRonda(c, c.d, 1);
      tr.ronda.push(c);
      n++;
      break;
    }
  }
  return n;
}

function colocarRonda(c, dAntes, dt) {
  const p = rondaPunto(c.s, c.d);
  const dRate = dt > 0 ? (c.d - dAntes) / dt : 0;
  // d crece hacia fuera, que es la izquierda del sentido de la marcha.
  c.h = angNorm(rumbo(p.tx, p.ty) - Math.atan2(dRate, Math.max(c.v, 3)) + c.giro);
  c.x = p.x;
  c.y = p.y;
  c.vx = p.tx * c.v + p.nx * dRate;
  c.vy = p.ty * c.v + p.ny * dRate;
}

function colocarExterior(c) {
  const p = rondaPunto(c.s, c.d);
  c.x = p.x;
  c.y = p.y;
  c.h = rumbo(-p.tx, -p.ty);
  c.vx = -p.tx * c.v;
  c.vy = -p.ty * c.v;
}

// Punto y rumbo de un coche del barrio según su arista, lo recorrido y su desplazamiento a la derecha.
function colocarBarrio(c, mapa, dt) {
  const e = mapa.grafo.aristas[c.arista];
  const u = c.sentido === 1 ? c.rec : e.largo - c.rec;
  let i = 1;
  while (i < e.acum.length - 1 && e.acum[i] < u) i++;
  const p = e.puntos[i - 1], q = e.puntos[i];
  const k = clamp((u - e.acum[i - 1]) / (e.acum[i] - e.acum[i - 1] || 1), 0, 1);
  let tx = q[0] - p[0], ty = q[1] - p[1];
  const l = Math.hypot(tx, ty) || 1;
  tx = (tx / l) * c.sentido;
  ty = (ty / l) * c.sentido;
  const bx = p[0] + (q[0] - p[0]) * k, by = p[1] + (q[1] - p[1]) * k;
  const lado = e.tipo === 'glorieta' ? 0 : e.ancho / 4;
  const rampa = Math.min(1, c.rec / 8, (e.largo - c.rec) / 8);
  const off = lado * Math.max(0, rampa) + c.lat;
  // Derecha de la marcha: (ty, -tx).
  const nx = bx + ty * off, ny = by - tx * off;
  const hObj = rumbo(tx, ty);
  c.hSuave = c.hSuave === null ? hObj : angNorm(c.hSuave + angDif(hObj, c.hSuave) * Math.min(1, dt * 8));
  c.h = angNorm(c.hSuave + c.giro);
  if (dt > 0 && c.colocado) {
    c.vx = (nx - c.x) / dt;
    c.vy = (ny - c.y) / dt;
  }
  c.colocado = true;
  c.x = nx;
  c.y = ny;
  c.fx = tx;
  c.fy = ty;
}

// Cuerpos ajenos (jugador y policía): { x, y, vx, vy, h, largo, ancho, sirena }.
function pasoTrafico(tr, dt, cuerpos, mapa, azar) {
  tr.t += dt;
  pasoRonda(tr, dt, cuerpos);
  for (const c of tr.exterior) {
    c.s = normS(c.s - c.v * dt);
    colocarExterior(c);
  }
  pasoBarrio(tr, dt, cuerpos, mapa, azar);
}

function pasoRonda(tr, dt, cuerpos) {
  // Obstáculos en coordenadas de la Ronda.
  const obs = tr.ronda.map((c) => ({ s: c.s, d: c.d, v: c.v, largo: c.largoEf ?? c.largo, ancho: c.anchoEf ?? c.ancho, ref: c, sirena: false }));
  for (const b of cuerpos) {
    const p = rondaProyectar(b.x, b.y);
    if (p.d > D_MEDIANA + 1 || p.d < D_GUARDA - 1) continue;
    const q = rondaPunto(p.s, p.d);
    const hu = huella(b, rumbo(q.tx, q.ty)); // cruzado (un trompo, unos restos) ocupa más carril
    obs.push({ s: p.s, d: p.d, v: b.vx * q.tx + b.vy * q.ty, largo: hu.largo, ancho: hu.ancho, ref: b, sirena: !!b.sirena });
  }
  const libre = (c, d, atras, delante) => {
    for (const o of obs) {
      if (o.ref === c) continue;
      if (Math.abs(o.d - d) > (o.ancho + c.ancho) / 2 + 0.7) continue;
      const ds = difS(o.s, c.s);
      if (ds > -atras && ds < delante) return false;
    }
    return true;
  };
  for (const c of tr.ronda) {
    if (c.suelto) {
      pasoSueltoRonda(c, dt);
      continue;
    }
    const dAntes = c.d;
    c.aturdido = Math.max(0, c.aturdido - dt);
    c.cambioT -= dt;
    // Líder: lo que tiene delante en su franja (y en la de destino si está cambiando de carril).
    let lider = null, gap = Infinity, sirenaDetras = null;
    const dDest = CARRILES[c.carril] + c.apartado;
    for (const o of obs) {
      if (o.ref === c) continue;
      const ds = difS(o.s, c.s);
      const enFranja = Math.abs(o.d - c.d) < (o.ancho + c.ancho) / 2 + 0.35 || Math.abs(o.d - dDest) < (o.ancho + c.ancho) / 2 + 0.2;
      if (ds > 0 && ds < 90 && enFranja) {
        const g = ds - (o.largo + c.largo) / 2;
        if (g < gap) { gap = g; lider = o; }
      }
      if (o.sirena && ds < 0 && ds > -75 && Math.abs(o.d - c.d) < 2.6 && o.v > c.v - 2) sirenaDetras = o;
    }
    // Velocidad deseada: algo menos en las curvas; casi parado si le acaban de dar.
    let vObj = c.vDes * (esCurva(c.s) ? 0.93 : 1) * (c.aturdido > 0 ? 0.35 : 1);
    if (lider) {
      const seguro = 5 + c.v * 1.1;
      if (gap < seguro) vObj = Math.min(vObj, Math.max(0, lider.v + (gap - seguro) * 0.6));
      // v7: algo parado delante (un accidente) se ve de lejos: frena a tiempo de pararse, a 6 m/s².
      if (lider.v < c.v) vObj = Math.min(vObj, Math.sqrt(Math.max(0, lider.v) ** 2 + 12 * Math.max(0, gap - 2)));
      if (gap < 1.5) vObj = 0;
    }
    // Sirena detrás: se aparta a la derecha; si ya va por el carril lento, se pega al guardarraíl y afloja.
    c.apartado = 0;
    if (c.aviso) {
      // Con el intermitente puesto: cambia cuando acaba el aviso y solo si el hueco sigue libre.
      c.aviso.t -= dt;
      if (c.aviso.t <= 0) {
        if (c.aturdido <= 0 && libre(c, CARRILES[c.aviso.carril], c.aviso.atras, 24)) c.carril = c.aviso.carril;
        else c.intermitente = 0;
        c.aviso = null;
      }
    } else if (sirenaDetras && c.aturdido <= 0) {
      // Apartarse para la sirena es inmediato; el intermitente se pone igual.
      if (c.carril < 2 && Math.abs(c.d - CARRILES[c.carril]) < 0.4 && libre(c, CARRILES[c.carril + 1], 12, 18)) { c.carril++; c.intermitente = 1; }
      else if (c.carril === 2) { c.apartado = -1.6; vObj = Math.min(vObj, c.vDes * 0.8); }
    } else if ((c.tipo !== 'camion' || (lider && lider.v < 2)) && c.aturdido <= 0 && c.cambioT <= 0 && lider && gap < 35 && lider.v < c.vDes - 2) {
      // Los camiones solo cambian de carril para pasar un coche parado (un accidente).
      // Adelantar por la izquierda (carril más rápido) o, si no se puede, por la derecha.
      const cerca = Math.abs(c.d - CARRILES[c.carril]) < 0.4;
      const aluego = 14 + Math.max(0, 30 - c.v) * 0.5;
      if (cerca && c.carril > 0 && libre(c, CARRILES[c.carril - 1], aluego, 24)) { avisar(c, c.carril - 1, aluego); c.cambioT = tr.pausa; }
      else if (cerca && c.carril < 2 && c.tipo === 'coche' && libre(c, CARRILES[c.carril + 1], aluego, 24)) { avisar(c, c.carril + 1, aluego); c.cambioT = tr.pausa; }
      else c.cambioT = 1;
    }
    if (!c.aviso && c.intermitente && Math.abs(c.d - CARRILES[c.carril]) < 0.3) c.intermitente = 0; // ya está en su carril
    const frenada = gap < 5 + c.v * 0.5 ? 9 : lider && lider.v < c.v - 5 ? 7 : 4.5;
    if (vObj > c.v) c.v += Math.min(vObj - c.v, 2.2 * dt);
    else c.v -= Math.min(c.v - vObj, frenada * dt);
    c.v = Math.max(0, c.v);

    // Lateral: hacia su carril (1,5 m/s), con un vaivén leve y el empujón de un golpe.
    const vaiven = c.amp * Math.sin(c.fase + tr.t * 6.2832 * c.frec);
    const dObj = CARRILES[c.carril] + c.apartado + vaiven;
    c.d += clamp(dObj - c.d, -1.5 * dt, 1.5 * dt) + c.latV * dt;
    c.latV *= Math.exp(-3 * dt);
    c.d = clamp(c.d, D_GUARDA + c.ancho / 2 + 0.2, D_MEDIANA - c.ancho / 2 - 0.2);
    c.giro *= Math.exp(-1.5 * dt);
    c.s = normS(c.s + c.v * dt);
    colocarRonda(c, dAntes, dt);
  }
}

function pasoBarrio(tr, dt, cuerpos, mapa, azar) {
  const todos = tr.barrio.concat(cuerpos);
  for (const c of tr.barrio) {
    if (c.suelto) {
      if (pararSuelto(c, pasoSuelto(c, dt), dt)) volverALaCalle(c, mapa);
      continue;
    }
    c.aturdido = Math.max(0, c.aturdido - dt);
    const e = mapa.grafo.aristas[c.arista];
    const fx = Math.sin(c.h), fy = Math.cos(c.h), rx = Math.cos(c.h), ry = -Math.sin(c.h);
    let gap = Infinity, lider = null, sirena = false;
    for (const o of todos) {
      if (o === c) continue;
      const dx = o.x - c.x, dy = o.y - c.y;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) continue;
      const lon = dx * fx + dy * fy, lat = dx * rx + dy * ry;
      if (lon > 0 && lon < 20 && Math.abs(lat) < (o.ancho + c.ancho) / 2 + 0.5) {
        const g = lon - (o.largo + c.largo) / 2;
        if (g < gap) { gap = g; lider = o; }
      }
      if (o.sirena && lon < 0 && lon > -35 && Math.abs(lat) < 5) sirena = true;
    }
    let vObj = c.vDes * (c.aturdido > 0 ? 0.3 : 1);
    if (e.tipo === 'glorieta') vObj = Math.min(vObj, 7);
    const falta = e.largo - c.rec;
    if (falta < 14 && e.tipo !== 'glorieta') vObj = Math.min(vObj, 5 + falta * 0.45);
    if (lider) {
      const vl = lider.vx * fx + lider.vy * fy;
      const seguro = 3 + c.v * 1.0;
      if (gap < seguro) vObj = Math.min(vObj, Math.max(0, vl + (gap - seguro) * 0.7));
      if (gap < 1.2) vObj = 0;
    }
    // Sirena detrás: a la derecha y casi parado.
    const latObj = sirena ? 1.6 : 0;
    if (sirena) vObj = Math.min(vObj, 3);
    c.lat += clamp(latObj - c.lat, -1.2 * dt, 1.2 * dt) + c.latV * dt;
    c.latV *= Math.exp(-3 * dt);
    c.lat = clamp(c.lat, -3, 3.5);
    if (vObj > c.v) c.v += Math.min(vObj - c.v, 2.5 * dt);
    else c.v -= Math.min(c.v - vObj, 7 * dt);
    c.v = Math.max(0, c.v);
    c.giro *= Math.exp(-1.5 * dt);

    c.rec += c.v * dt;
    while (c.rec > mapa.grafo.aristas[c.arista].largo) {
      const ea = mapa.grafo.aristas[c.arista];
      c.rec -= ea.largo;
      const nodo = mapa.grafo.nodos[c.sentido === 1 ? ea.b : ea.a];
      const opciones = [];
      for (const id of nodo.aristas) {
        const en = mapa.grafo.aristas[id];
        if (en.tipo !== 'calle' && en.tipo !== 'glorieta') continue;
        if (en.dirigida && en.a !== nodo.id) continue;
        if (id === ea.id) continue;
        opciones.push(en);
      }
      if (!opciones.length) {
        c.sentido = -c.sentido; // calle sin salida: media vuelta
        c.hSuave = null;
        continue;
      }
      const sig = azar.elegir(opciones);
      c.arista = sig.id;
      c.sentido = sig.a === nodo.id ? 1 : -1;
    }
    colocarBarrio(c, mapa, dt);
  }
}

// ------------------------------------------------------------------ coches sueltos (v7)
// Lo suelta del carril: desde ahora es un cuerpo libre (la física del golpe ya le ha cambiado vx, vy y el giro).
function soltar(c) {
  if (c.suelto) return false;
  c.suelto = true;
  c.aviso = null;
  c.intermitente = 0;
  c.paradoT = 0;
  c.w = c.w || 0;
  return true;
}

// Cuenta el tiempo parado y pone las luces de emergencia. Devuelve true cuando toca volver a circular.
function pararSuelto(c, parado, dt) {
  if (!parado) {
    c.paradoT = 0;
    return false;
  }
  c.paradoT += dt;
  c.emergencia = !c.quemado; // el quemado ya no tiene luces
  return c.paradoT >= SUELTO.recuperar && c.danio < DANIO_TRAFICO.averiado && !(c.arde > 0);
}

function pasoSueltoRonda(c, dt) {
  const parado = pasoSuelto(c, dt);
  const p = rondaProyectar(c.x, c.y);
  const q = rondaPunto(p.s, p.d);
  c.s = p.s;
  c.d = p.d;
  c.v = c.vx * q.tx + c.vy * q.ty; // lo que avanza por la Ronda, para los que vienen detrás
  const hu = huella(c, rumbo(q.tx, q.ty));
  c.largoEf = hu.largo;
  c.anchoEf = hu.ancho;
  // Solo vuelve si ha quedado dentro de la calzada (no en una salida).
  const dentro = c.d < D_MEDIANA - c.ancho / 2 && c.d > D_GUARDA + c.ancho / 2;
  if (pararSuelto(c, parado, dt) && dentro) volverAlCarril(c, false);
}

// Vuelve a circular por el carril más cercano. deGolpe (la grúa, tras la niebla): recto y en marcha; si no, arranca
// despacio y el morro gira poco a poco hasta ponerse recto.
function volverAlCarril(c, deGolpe) {
  const p = rondaProyectar(c.x, c.y);
  const q = rondaPunto(p.s, p.d);
  c.suelto = false;
  c.emergencia = false;
  c.paradoT = 0;
  c.w = 0;
  c.largoEf = c.anchoEf = undefined;
  c.s = p.s;
  c.d = clamp(p.d, D_GUARDA + c.ancho / 2 + 0.2, D_MEDIANA - c.ancho / 2 - 0.2);
  let k = 0, md = Infinity;
  CARRILES.forEach((d, i) => { if (Math.abs(d - c.d) < md) { md = Math.abs(d - c.d); k = i; } });
  c.carril = k;
  c.v = deGolpe ? c.vDes * 0.6 : 0;
  c.latV = 0;
  c.aturdido = deGolpe ? 0 : 1.5;
  c.giro = deGolpe ? 0 : angDif(c.h, rumbo(q.tx, q.ty));
  c.aviso = null;
  c.intermitente = 0;
  c.cambioT = 3;
  colocarRonda(c, c.d, 1);
}

// Barrio: se vuelve a enganchar a la calle más cercana, en el sentido al que mira, sin saltos (la desviación lateral pasa a
// «lat» y se recoge sola). Lejos de cualquier calle (en una acera), se queda parado hasta la grúa.
function volverALaCalle(c, mapa, deGolpe = false) {
  let mejor = null;
  for (const e of mapa.grafo.aristas) {
    if (e.tipo !== 'calle' && e.tipo !== 'glorieta') continue;
    for (let i = 1; i < e.puntos.length; i++) {
      const a = e.puntos[i - 1], b = e.puntos[i];
      const pr = proyectarSegmento(c.x, c.y, a[0], a[1], b[0], b[1]);
      if (!mejor || pr.d2 < mejor.d2) mejor = { e, i, pr, d2: pr.d2 };
    }
  }
  if (!mejor || mejor.d2 > 36) return false;
  const { e, i, pr } = mejor;
  const a = e.puntos[i - 1], b = e.puntos[i];
  const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
  const dx = (b[0] - a[0]) / l, dy = (b[1] - a[1]) / l;
  const u = e.acum[i - 1] + (e.acum[i] - e.acum[i - 1]) * pr.t;
  c.sentido = Math.sin(c.h) * dx + Math.cos(c.h) * dy >= 0 ? 1 : -1;
  if (e.dirigida) c.sentido = 1; // las de sentido único, por su sentido
  c.arista = e.id;
  c.rec = clamp(c.sentido === 1 ? u : e.largo - u, 0.5, e.largo - 0.5);
  const tx = dx * c.sentido, ty = dy * c.sentido;
  const lado = e.tipo === 'glorieta' ? 0 : e.ancho / 4;
  const rampa = Math.min(1, c.rec / 8, (e.largo - c.rec) / 8);
  const off = (c.x - pr.x) * ty - (c.y - pr.y) * tx; // a la derecha de la marcha: (ty, -tx)
  c.lat = clamp(off - lado * Math.max(0, rampa), -3, 3.5);
  c.latV = 0;
  c.suelto = false;
  c.emergencia = false;
  c.paradoT = 0;
  c.w = 0;
  c.v = deGolpe ? c.vDes * 0.6 : 0;
  c.aturdido = deGolpe ? 0 : 1.5;
  c.hSuave = deGolpe ? null : c.h;
  c.giro = 0;
  c.colocado = false;
  colocarBarrio(c, mapa, 1 / 60);
  return true;
}

// La grúa: lo que ha quedado destrozado o parado en medio y está lejos de ti (tras la niebla) vuelve a circular como nuevo.
// Así la Ronda no se llena de restos en una huida larga. Devuelve cuántos se ha llevado.
function grua(tr, x, y, mapa) {
  let n = 0;
  for (const lista of [tr.ronda, tr.barrio]) {
    for (const c of lista) {
      if (!c.suelto && !c.quemado && !(c.danio > 0)) continue;
      if (c.arde > 0 || Math.hypot(c.x - x, c.y - y) < SUELTO.lejos) continue;
      if (c.suelto) {
        if (c.zona === 'ronda') volverAlCarril(c, true);
        else if (!volverALaCalle(c, mapa, true)) continue;
      }
      c.danio = 0;
      c.quemado = false;
      c.golpes = 0;
      n++;
    }
  }
  return n;
}

// Después de un choque (x, y, vx, vy ya cambiados por la física): vuelve a su carril y se aturde.
function golpeado(c, fuerza) {
  c.aturdido = Math.max(c.aturdido, 1.2 + Math.min(1.5, fuerza * 0.1));
  c.golpes++;
  if (c.zona === 'ronda') {
    const p = rondaProyectar(c.x, c.y);
    c.s = p.s;
    c.d = clamp(p.d, D_GUARDA + c.ancho / 2 + 0.2, D_MEDIANA - c.ancho / 2 - 0.2);
    const q = rondaPunto(c.s, c.d);
    c.v = Math.max(0, c.vx * q.tx + c.vy * q.ty);
    c.latV = clamp(c.vx * q.nx + c.vy * q.ny, -6, 6);
