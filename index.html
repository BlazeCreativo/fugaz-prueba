<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FUGAZ</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<meta name="description" content="FUGAZ, prototipo de la fase 0: pierde a la policía rompiendo su línea de visión.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@500;700&family=Overpass:wght@400;600;800&family=Saira+Extra+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --fondo: #070A12;
  --noche: #0B1122;
  --panel: rgba(9, 13, 24, 0.9);
  --panel-claro: rgba(18, 25, 44, 0.86);
  --borde: rgba(160, 180, 220, 0.2);
  --texto: #E8EDF7;
  --tenue: #9AA6BC;
  --rojo: #FF3355;
  --azul: #3D7BFF;
  --ambar: #FFB020;
  --verde: #3DDC84;
  --cian: #7FE3FF;
  --display: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
  --ui: 'Overpass', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Overpass Mono', ui-monospace, 'SFMono-Regular', monospace;
  --st: env(safe-area-inset-top, 0px);
  --sr: env(safe-area-inset-right, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --b: 68px;           /* botón de mando */
  --retro: min(30vw, 210px);
}
@media (max-height: 380px) { :root { --b: 60px; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; }
body { font-family: var(--ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cian); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .cuenta-fin i { animation-duration: 8s !important; }
}

#juego { position: fixed; inset: 0; overflow: hidden; background: var(--noche); touch-action: none; }
#lienzo, #lineas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#lineas { pointer-events: none; }
#vineta {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.2;
  background: radial-gradient(ellipse 75% 70% at 50% 46%, transparent 52%, rgba(0, 0, 0, 0.88) 100%);
}
#vineta[data-borde="azul"] { box-shadow: inset 0 0 110px 18px rgba(61, 123, 255, 0.5); }
#vineta[data-borde="rojo"] { box-shadow: inset 0 0 110px 18px rgba(255, 51, 85, 0.45); }
#capas { position: absolute; inset: 0; pointer-events: none; }

/* ------------------------------------------------------------------ HUD */
.hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
.h-retro {
  position: absolute; top: calc(var(--st) + 6px); left: 50%; transform: translateX(-50%);
  width: var(--retro); aspect-ratio: 360 / 54; border-radius: 7px; overflow: hidden;
  box-shadow: 0 0 0 1.5px rgba(20, 24, 32, 0.9), 0 4px 14px rgba(0, 0, 0, 0.5);
}
.h-retro canvas { width: 100%; height: 100%; display: block; }
.h-ojo {
  --c: var(--rojo);
  position: absolute; top: calc(var(--st) + 12px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%);
  width: 104px; display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.h-ojo[data-estado="ambar"] { --c: var(--ambar); }
.h-ojo[data-estado="cerrado"] { --c: var(--verde); }
.h-ojo svg { width: 58px; height: 58px; overflow: visible; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--c) 55%, transparent)); }
.h-ojo .anillo-fondo { fill: rgba(5, 8, 14, 0.55); stroke: rgba(255, 255, 255, 0.14); stroke-width: 6; }
.h-ojo .anillo { fill: none; stroke: var(--c); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 50% 50%; }
.h-ojo .parpado { fill: rgba(255, 255, 255, 0.1); fill: color-mix(in srgb, var(--c) 22%, transparent); stroke: var(--c); stroke-width: 3.5; }
.h-ojo .iris { fill: var(--c); }
.h-ojo .pupila { fill: #05070A; }
.h-ojo .cerrado { fill: none; stroke: var(--c); stroke-width: 5; stroke-linecap: round; display: none; }
.h-ojo[data-estado="cerrado"] .parpado, .h-ojo[data-estado="cerrado"] .iris, .h-ojo[data-estado="cerrado"] .pupila { display: none; }
.h-ojo[data-estado="cerrado"] .cerrado { display: inline; }
.h-ojo.parpadea svg { animation: parpadeo 0.3s steps(2) infinite; }
@keyframes parpadeo { 50% { opacity: 0.35; } }
.ojo-txt { font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: 0.08em; color: var(--c); white-space: nowrap; }
.nivel { display: flex; gap: 4px; }
.nivel i { width: 14px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); }
.nivel i.on { background: var(--rojo); box-shadow: 0 0 6px var(--rojo); }

.h-botin { position: absolute; top: calc(var(--st) + 8px); left: calc(var(--sl) + 14px); display: flex; flex-direction: column; }
.h-botin .chapas { font-family: var(--display); font-weight: 800; font-size: 38px; line-height: 1; color: var(--ambar); font-variant-numeric: tabular-nums; }
.h-botin .ud { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--tenue); }
.h-botin .mult { font-family: var(--mono); font-size: 12px; color: var(--cian); min-height: 15px; }
.premios { position: relative; height: 0; }
.premio {
  position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--verde);
  animation: sube 1.05s ease-out forwards;
}
.premio.cadena { color: var(--ambar); }
.premio.hueco { color: var(--cian); font-size: 28px; }
@keyframes sube { 0% { transform: translateY(6px) scale(0.8); opacity: 0; } 15% { transform: translateY(0) scale(1.1); opacity: 1; } 100% { transform: translateY(-34px) scale(1); opacity: 0; } }

/* Horizontal (lo normal): arriba el botín, el retrovisor con el Ojo y el minimapa; abajo el velocímetro. */
.h-mapa {
  position: absolute; top: calc(var(--st) + 10px); right: calc(var(--sr) + 66px);
  width: min(22vw, 124px); height: min(22vw, 124px); border-radius: 50%;
  box-shadow: 0 0 0 1.5px rgba(160, 180, 220, 0.28), 0 4px 16px rgba(0, 0, 0, 0.5);
}

.h-velo {
  position: absolute; bottom: calc(var(--sb) + 10px); left: 50%; transform: translateX(-50%);
  width: 170px; display: grid; grid-template-columns: 1fr auto; align-items: end; column-gap: 8px;
}
.h-velo .rpm { grid-column: 1 / 3; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; margin-bottom: 3px; }
.h-velo .rpm i { display: block; height: 100%; background: linear-gradient(90deg, var(--cian), var(--ambar) 75%, var(--rojo)); transform-origin: 0 50%; transform: scaleX(0); }
.h-velo .kmh { font-family: var(--display); font-weight: 800; font-size: 50px; line-height: 0.9; text-align: right; font-variant-numeric: tabular-nums; }
.h-velo .uds { grid-column: 1; grid-row: 3; text-align: right; font-size: 10px; letter-spacing: 0.16em; color: var(--tenue); }
.h-velo .marcha { grid-column: 2; grid-row: 2; font-family: var(--mono); font-weight: 700; font-size: 18px; color: var(--ambar); border: 1.5px solid rgba(255, 176, 32, 0.6); border-radius: 6px; padding: 1px 7px 0; margin-bottom: 4px; }
.h-velo .barras { grid-column: 1 / 3; display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
.h-velo .barras > div { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
.h-velo .barras i { display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(0); }
.h-velo .nitro i { background: linear-gradient(90deg, #2F8CFF, var(--cian)); box-shadow: 0 0 8px var(--cian); }
.h-velo .calor { opacity: 0; transition: opacity 0.3s; }
.h-velo .calor.visible { opacity: 1; }
.h-velo .calor i { background: linear-gradient(90deg, var(--ambar), var(--rojo)); }

/* Salida lanzada: la aguja del cuentavueltas sube y baja; se suelta el freno en la zona verde. */
.h-lanzada {
  position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
  width: 240px; height: 14px; border-radius: 7px; background: rgba(255, 255, 255, 0.14);
}
.h-lanzada .zona { position: absolute; left: 60%; width: 25.7%; top: 0; bottom: 0; background: var(--verde); opacity: 0.75; border-radius: 3px; }
.h-lanzada .aguja { position: absolute; top: -5px; width: 4px; height: 24px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 8px #fff; }
.h-lanzada span { position: absolute; bottom: 20px; left: -40px; right: -40px; text-align: center; font-size: 12px; color: var(--texto); white-space: nowrap; }

.h-detencion { position: absolute; top: calc(var(--st) + 150px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%); width: min(50vw, 280px); text-align: center; }
.h-detencion span { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: 0.14em; color: var(--rojo); animation: parpadeo 0.5s steps(2) infinite; }
.h-detencion div { height: 8px; border-radius: 4px; background: rgba(255, 51, 85, 0.2); overflow: hidden; margin-top: 4px; }
.h-detencion i { display: block; height: 100%; background: var(--rojo); transform-origin: 0 50%; transform: scaleX(0); }

.h-aviso {
  position: absolute; top: calc(var(--st) + 112px + var(--retro) * 0.15); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(50vw, 420px); padding: 6px 14px; border-radius: 999px; text-align: center;
  font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.04em;
  background: rgba(9, 13, 24, 0.78); border: 1px solid var(--borde);
}
.h-aviso.peligro { color: #fff; background: rgba(160, 18, 42, 0.86); border-color: var(--rojo); }
.h-aviso.bien { color: var(--verde); border-color: rgba(61, 220, 132, 0.5); }

.h-grande {
  position: absolute; top: 34%; left: 0; right: 0; text-align: center; opacity: 0;
  font-family: var(--display); font-weight: 800; font-size: clamp(44px, 11vw, 96px); letter-spacing: 0.04em; line-height: 1;
  text-shadow: 0 0 24px rgba(0, 0, 0, 0.6), 0 2px 0 rgba(0, 0, 0, 0.6);
}
.h-grande.on { opacity: 1; }
.h-grande.entra { animation: golpe 0.34s cubic-bezier(0.2, 1.6, 0.4, 1); }
.h-grande.rojo { color: var(--rojo); }
.h-grande.ambar { color: var(--ambar); }
.h-grande.libre { color: var(--verde); font-size: clamp(56px, 15vw, 132px); }
.h-grande.hueco { color: var(--cian); }
.h-grande.bien { color: var(--verde); }
@keyframes golpe { 0% { transform: scale(1.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.h-radio {
  position: absolute; bottom: calc(var(--sb) + 96px); left: 50%; transform: translateX(-50%);
  width: max-content; max-width: min(50vw, 400px); padding: 7px 12px; border-radius: 10px; background: rgba(6, 9, 16, 0.82);
  border-left: 3px solid var(--azul); font-size: 14px; line-height: 1.3;
}
.h-radio[data-quien="central"] { border-left-color: var(--cian); }
.h-radio .quien { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; color: var(--azul); }
.h-radio[data-quien="central"] .quien { color: var(--cian); }
.h-pista {
  position: absolute; top: calc(var(--st) + 104px); left: calc(var(--sl) + 14px);
  width: min(32vw, 280px); padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.35;
  background: rgba(40, 28, 4, 0.9); border: 1px solid rgba(255, 176, 32, 0.6); color: #FFE7B8; text-shadow: none;
  animation: aparece-izq 0.35s ease-out;
}
@keyframes aparece-izq { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes aparece { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ------------------------------------------------------------------ mandos */
.controles { position: absolute; inset: 0; pointer-events: none; }
.ctl {
  position: absolute; pointer-events: auto; touch-action: none; width: var(--b); height: var(--b); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; padding: 0;
  font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: 0.06em; color: rgba(255, 255, 255, 0.92);
  background: rgba(12, 17, 30, 0.42); border: 1.5px solid rgba(255, 255, 255, 0.26);
  transition: transform 0.06s, background 0.06s;
}
.ctl.on { background: rgba(255, 255, 255, 0.28); transform: scale(0.94); }
.ctl.freno { border-color: rgba(255, 51, 85, 0.7); }
.ctl.nitro { border-color: rgba(127, 227, 255, 0.8); color: var(--cian); }
.ctl.gas { border-color: rgba(61, 220, 132, 0.7); }
.ctl.mano { font-size: 13px; }
.ctl.izq, .ctl.der { font-size: 26px; width: calc(var(--b) * 1.12); height: calc(var(--b) * 1.12); }
/* Columna de la derecha, arriba: pausa, cámara y mirar atrás (este se mantiene pulsado). */
.ctl.pausa, .ctl.cam, .ctl.mirar { width: 44px; height: 44px; right: calc(var(--sr) + 12px); }
.ctl.pausa { top: calc(var(--st) + 10px); font-size: 16px; }
.ctl.cam { top: calc(var(--st) + 60px); font-size: 18px; }
.ctl.mirar { top: calc(var(--st) + 110px); font-size: 21px; }
/* Motor y marcha atrás: solo con el coche parado, encima del pulgar izquierdo. */
.ctl.motor, .ctl.reversa { width: 86px; height: 42px; border-radius: 21px; font-size: 14px; bottom: calc(var(--sb) + 28px + var(--b) * 1.2); }
.ctl.motor { left: calc(var(--sl) + 14px); }
.ctl.reversa { left: calc(var(--sl) + 110px); }
.controles:not([data-parado="1"]) .motor, .controles:not([data-parado="1"]) .reversa { display: none; }
.controles[data-motor="0"] .motor { background: rgba(255, 176, 32, 0.3); border-color: var(--ambar); color: var(--ambar); animation: parpadeo 1s steps(2) infinite; }
.controles[data-motor="0"] .reversa { display: none; }

/* Botones: izquierda y derecha con el pulgar izquierdo; freno, mano, nitro (y gas) con el derecho. */
.controles[data-modo="botones"] .izq { left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .der { left: calc(var(--sl) + 26px + var(--b) * 1.12); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .freno { right: calc(var(--sr) + 26px + var(--b)); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"] .mano { right: calc(var(--sr) + 26px + var(--b)); bottom: calc(var(--sb) + 28px + var(--b)); }
.controles[data-modo="botones"] .nitro { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"][data-auto="0"] .gas { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="botones"][data-auto="0"] .nitro { bottom: calc(var(--sb) + 28px + var(--b)); }
/* Inclinación: pulgar izquierdo, freno y freno de mano; derecho, nitro (y gas). */
.controles[data-modo="inclinacion"] .izq, .controles[data-modo="inclinacion"] .der { display: none; }
.controles[data-modo="inclinacion"] .freno { left: calc(var(--sl) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"] .mano { left: calc(var(--sl) + 30px + var(--b) * 1.2); bottom: calc(var(--sb) + 16px); }
.controles[data-modo="inclinacion"] .nitro { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"][data-auto="0"] .gas { right: calc(var(--sr) + 14px); bottom: calc(var(--sb) + 16px); width: calc(var(--b) * 1.2); height: calc(var(--b) * 1.2); }
.controles[data-modo="inclinacion"][data-auto="0"] .nitro { right: calc(var(--sr) + 30px + var(--b) * 1.2); width: var(--b); height: var(--b); }
.controles[data-auto="1"] .gas { display: none; }

/* En vertical la pantalla es estrecha: el velocímetro sube por encima de los mandos y el minimapa va a la izquierda. */
@media (orientation: portrait) {
  :root { --b: 62px; --retro: min(40vw, 190px); }
  .h-botin .chapas { font-size: 30px; }
  .h-mapa { top: calc(var(--st) + 104px); right: auto; left: calc(var(--sl) + 12px); width: min(28vw, 108px); height: min(28vw, 108px); }
  .h-velo { bottom: calc(var(--sb) + 30px + var(--b) * 2.3); width: 150px; }
  .h-velo .kmh { font-size: 42px; }
  .h-aviso { top: calc(34% + 92px); max-width: calc(100vw - 32px); }
  .h-detencion { top: calc(34% + 136px); width: min(70vw, 280px); }
  .h-radio { bottom: calc(var(--sb) + 116px + var(--b) * 2.3); max-width: calc(100vw - 32px); }
  .h-pista { top: auto; left: 50%; bottom: calc(var(--sb) + 186px + var(--b) * 2.3); width: min(88vw, 420px); transform: translateX(-50%); animation: aparece 0.35s ease-out; }
  .h-lanzada { top: 56%; }
}

/* ------------------------------------------------------------------ menú */
.menu {
  position: absolute; inset: 0; pointer-events: auto; display: flex; align-items: center; justify-content: center;
  overflow-y: auto; padding: calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px);
  background: linear-gradient(180deg, rgba(5, 7, 12, 0.35), rgba(5, 7, 12, 0.88));
}
.menu.transparente { background: none; pointer-events: none; }
.menu.velo { background: rgba(5, 7, 12, 0.72); }
.menu.final-on { background: radial-gradient(ellipse at 50% 40%, rgba(5, 7, 12, 0.55), rgba(5, 7, 12, 0.92)); }
.menu h2 { font-family: var(--display); font-weight: 800; font-size: 28px; letter-spacing: 0.03em; margin: 0 0 12px; }
.menu h3 { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: 0.06em; color: var(--tenue); margin: 0 0 8px; text-transform: uppercase; }
.pri, .sec {
  border-radius: 999px; padding: 11px 20px; font-family: var(--display); font-weight: 800; font-size: 19px; letter-spacing: 0.05em; min-height: 44px;
}
.pri { background: var(--rojo); border: 0; color: #fff; box-shadow: 0 6px 20px rgba(255, 51, 85, 0.35); }
.pri:active { transform: scale(0.97); }
.sec { background: transparent; border: 1.5px solid var(--borde); color: var(--texto); }
.sec:active { background: rgba(255, 255, 255, 0.08); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--borde); border-radius: 22px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 18px; padding: 8px 13px; font-size: 14px; font-weight: 600; min-height: 38px; }
.seg button.sel { background: var(--texto); color: #0A0E18; }

.portada { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 12px; }
.portada header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.portada h1 {
  margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(56px, 12vw, 104px); line-height: 0.85; letter-spacing: 0.02em;
  background: linear-gradient(90deg, #fff 0%, #fff 55%, var(--rojo) 55%, var(--rojo) 78%, var(--azul) 78%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.portada .lema { margin: 0; color: var(--tenue); font-size: 16px; }
.escenarios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.esc {
  text-align: left; padding: 14px 14px 12px; border-radius: 16px; background: var(--panel-claro); border: 1.5px solid var(--borde);
  display: flex; flex-direction: column; gap: 5px; min-height: 108px;
}
.esc b { font-family: var(--display); font-weight: 800; font-size: 25px; letter-spacing: 0.02em; }
.esc span { font-size: 13px; line-height: 1.35; color: var(--tenue); }
.esc:active, .esc:hover { border-color: var(--rojo); background: rgba(40, 14, 24, 0.9); }
.esc::after { content: 'JUGAR ▸'; margin-top: auto; font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: 0.1em; color: var(--rojo); }
.portada .fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.record { margin: 0; color: var(--ambar); font-size: 14px; }
.pie { margin: 0; color: var(--tenue); font-size: 12px; opacity: 0.75; }
@media (max-width: 640px) { .escenarios { grid-template-columns: 1fr; } .esc { min-height: 0; } }

.panel {

  const p = rondaProyectar(r.cx + RAMPA_R * Math.cos(a), r.cy + RAMPA_R * Math.sin(a));
  r.sUnion = p.s;
  // Tramo de guardarraíl que se abre: hasta donde el muro exterior de la rampa cruza la línea del guardarraíl.
  r.hueco = r.tipo === 'salida' ? [r.sUnion - 2, r.sUnion + 27.7] : [r.sUnion - 27.7, r.sUnion + 2];
}

function dentro(c, x, y) {
  return x >= c.x0 && x <= c.x1 && y >= c.y0 && y <= c.y1;
}

// Manzanas: el espacio entre calles. Las cuatro del centro se recortan para la glorieta; dos se parten con un callejón.
function manzanas() {
  const out = [];
  for (let i = 0; i < 6; i++) {
    for (let j = 0; j < 6; j++) {
      const a = CALLES_NS[i], b = CALLES_NS[i + 1], c = CALLES_EO[j], d = CALLES_EO[j + 1];
      const m = { x0: a.x + a.ancho / 2, x1: b.x - b.ancho / 2, y0: c.y + c.ancho / 2, y1: d.y - d.ancho / 2 };
      const cx = (m.x0 + m.x1) / 2, cy = (m.y0 + m.y1) / 2;
      if (dentro(PARKING, cx, cy)) continue;
      if (Math.abs(cx) < 75 && Math.abs(cy) < 75) {
        const sx = Math.sign(cx), sy = Math.sign(cy);
        const q = GLORIETA.rExt;
        out.push(sx > 0 ? { x0: q, x1: m.x1, y0: m.y0, y1: m.y1 } : { x0: m.x0, x1: -q, y0: m.y0, y1: m.y1 });
        const bx0 = sx > 0 ? m.x0 : -q, bx1 = sx > 0 ? q : m.x1;
        out.push(sy > 0 ? { x0: bx0, x1: bx1, y0: q, y1: m.y1 } : { x0: bx0, x1: bx1, y0: m.y0, y1: -q });
        continue;
      }
      let partida = false;
      for (const cj of CALLEJONES) {
        if (!dentro(m, (cj.x0 + cj.x1) / 2, (cj.y0 + cj.y1) / 2)) continue;
        partida = true;
        if (cj.x1 - cj.x0 < cj.y1 - cj.y0) {
          out.push({ x0: m.x0, x1: cj.x0, y0: m.y0, y1: m.y1 }, { x0: cj.x1, x1: m.x1, y0: m.y0, y1: m.y1 });
        } else {
          out.push({ x0: m.x0, x1: m.x1, y0: m.y0, y1: cj.y0 }, { x0: m.x0, x1: m.x1, y0: cj.y1, y1: m.y1 });
        }
      }
      if (!partida) out.push(m);
    }
  }
  return out;
}

const COLORES_FACHADA = ['#2B2F3A', '#34303A', '#2A3640', '#3A3530', '#2F3A34', '#3B3F4A', '#3A2F33', '#2D3440'];

// Edificios dentro de cada manzana, con 3 m de acera. Mismo resultado siempre: la ciudad no cambia entre partidas.
function edificios(lista) {
  const azar = crearAzar(20260925);
  const out = [];
  for (const m of lista) {
    const x0 = m.x0 + 3, x1 = m.x1 - 3, y0 = m.y0 + 3, y1 = m.y1 - 3;
    const w = x1 - x0, h = y1 - y0;
    if (w < 3 || h < 3) continue;
    const enX = w >= h, L = enX ? w : h;
    const n = L > 45 ? azar.entero(2, 3) : L > 22 ? azar.entero(1, 2) : 1;
    const cortes = [0];
    for (let i = 1; i < n; i++) cortes.push(i / n + azar.rango(-0.07, 0.07));
    cortes.push(1);
    const centro = Math.max(Math.abs((m.x0 + m.x1) / 2), Math.abs((m.y0 + m.y1) / 2));
    for (let i = 0; i < n; i++) {
      const hueco = i < n - 1 ? 1 : 0;
      const e = enX
        ? { x0: x0 + cortes[i] * w, x1: x0 + cortes[i + 1] * w - hueco, y0, y1 }
        : { x0, x1, y0: y0 + cortes[i] * h, y1: y0 + cortes[i + 1] * h - hueco };
      const alto = centro < 110 ? azar.rango(16, 34) : azar.rango(8, 21);
      e.alto = Math.round(alto);
      e.color = azar.elegir(COLORES_FACHADA);
      e.semilla = azar.num() * 100;
      out.push(e);
    }
  }
  // Una torre que se ve desde toda la ciudad, para orientarse.
  let torre = null, mejor = Infinity;
  for (const e of out) {
    const d = dist((e.x0 + e.x1) / 2, (e.y0 + e.y1) / 2, 40, -40);
    if (d < mejor) { mejor = d; torre = e; }
  }
  if (torre) torre.alto = 58;
  return out;
}

// ------------------------------------------------------------------ construcción
function crearMapa({ rampasAbiertas = true } = {}) {
  const cajas = [];     // sólidos para chocar: { x0, y0, x1, y1, tipo }
  const muros = [];     // muros de una cara: { ax, ay, bx, by, nx, ny, alto, tipo }
  const circulos = [{ x: GLORIETA.x, y: GLORIETA.y, r: GLORIETA.r }];
  const pantallas = []; // cortan la visión: { ax, ay, bx, by, alto }
  const aparcados = []; // coches aparcados: { x, y, h, ancho, largo }
  const farolas = [];   // { x, y, h, tipo }

  const listaManzanas = manzanas();
  for (const m of listaManzanas) cajas.push({ ...m, tipo: 'manzana' });
  const listaEdificios = edificios(listaManzanas);
  // Paredes del túnel: cortan la visión lateral.
  listaEdificios.push(
    { x0: TUNEL.x0 - 0.4, x1: TUNEL.x0, y0: TUNEL.y0, y1: TUNEL.y1, alto: 6, color: '#252A33', tunel: true },
    { x0: TUNEL.x1, x1: TUNEL.x1 + 0.4, y0: TUNEL.y0, y1: TUNEL.y1, alto: 6, color: '#252A33', tunel: true },
  );

  // Parking: tapia baja con dos entradas y filas de coches aparcados con huecos para meterse.
  const P = PARKING, gr = 0.4;
  cajas.push(
    { x0: P.x0, x1: -116.5, y0: P.y0, y1: P.y0 + gr, tipo: 'tapia' },
    { x0: -108.5, x1: P.x1, y0: P.y0, y1: P.y0 + gr, tipo: 'tapia' },
    { x0: P.x0, x1: P.x1, y0: P.y1 - gr, y1: P.y1, tipo: 'tapia' },
    { x0: P.x0, x1: P.x0 + gr, y0: P.y0, y1: 96, tipo: 'tapia' },
    { x0: P.x0, x1: P.x0 + gr, y0: 104, y1: P.y1, tipo: 'tapia' },
    { x0: P.x1 - gr, x1: P.x1, y0: P.y0, y1: P.y1, tipo: 'tapia' },
  );
  for (const fy of [88.5, 93.1, 108.6, 113.2, 126.6, 131.2]) {
    for (let x = -141; x <= -84; x += 4.2) {
      if (Math.abs(x + 112.5) < 3.8) continue;
      const h = fy === 88.5 || fy === 108.6 || fy === 126.6 ? Math.PI : 0;
      aparcados.push({ x, y: fy, h, ancho: 1.8, largo: 4.2 });
      cajas.push({ x0: x - 0.9, x1: x + 0.9, y0: fy - 2.1, y1: fy + 2.1, tipo: 'aparcado' });
    }
  }

  // Muros de la Ronda: mediana (cara al barrio) y guardarraíl interior, con huecos en las rampas abiertas.
  const tramosS = (s0, s1, paso) => {
    const out = [];
    const n = Math.max(1, Math.ceil((s1 - s0) / paso));
    for (let i = 0; i <= n; i++) out.push(s0 + ((s1 - s0) * i) / n);
    return out;
  };
  const muroRonda = (s0, s1, d, haciaFuera, alto, tipo) => {
    for (const t of TRAMOS) {
      const a = Math.max(s0, t.s0), b = Math.min(s1, t.s1);
      if (b - a < 0.01) continue;
      const ss = tramosS(a, b, t.tipo === 'recta' ? 1000 : 6);
      for (let i = 0; i < ss.length - 1; i++) {
        const p = rondaPunto(ss[i], d), q = rondaPunto(ss[i + 1], d);
        const m = rondaPunto((ss[i] + ss[i + 1]) / 2, d);
        const sg = haciaFuera ? 1 : -1;
        muros.push({ ax: p.x, ay: p.y, bx: q.x, by: q.y, nx: m.nx * sg, ny: m.ny * sg, alto, tipo });
      }
    }
  };
  muroRonda(0, LARGO_RONDA, D_MEDIANA, false, 1, 'mediana');
  const huecos = rampasAbiertas ? RAMPAS.map((r) => r.hueco).sort((a, b) => a[0] - b[0]) : [];
  let s = 0;
  const tramosGuarda = [];
  for (const h of huecos) {
    tramosGuarda.push([s, h[0]]);
    s = h[1];
  }
  tramosGuarda.push([s, LARGO_RONDA]);
  for (const [a, b] of tramosGuarda) {
    muroRonda(a, b, D_GUARDA, true, 1, 'guardarrail');
    // Pantallas acústicas sobre el guardarraíl: esconden el barrio y cortan la vista en las curvas.
    for (const t of TRAMOS) {
      const a2 = Math.max(a, t.s0), b2 = Math.min(b, t.s1);
      if (b2 - a2 < 0.01) continue;
      const ss = tramosS(a2, b2, t.tipo === 'recta' ? 1000 : 6);
      for (let i = 0; i < ss.length - 1; i++) {
        const p = rondaPunto(ss[i], D_GUARDA - 0.3), q = rondaPunto(ss[i + 1], D_GUARDA - 0.3);
        pantallas.push({ ax: p.x, ay: p.y, bx: q.x, by: q.y, alto: 4 });
      }
    }
  }

  // Rampas: muro interior entero y muro exterior solo fuera de la Ronda.
  const arcoMuro = (r, radio, desde, hasta, haciaCentro) => {
    const n = Math.max(2, Math.ceil(Math.abs(hasta - desde) / (Math.PI / 24)));
    for (let i = 0; i < n; i++) {
      const u0 = desde + ((hasta - desde) * i) / n, u1 = desde + ((hasta - desde) * (i + 1)) / n, um = (u0 + u1) / 2;
      const sg = haciaCentro ? -1 : 1;
      muros.push({
        ax: r.cx + radio * Math.cos(u0), ay: r.cy + radio * Math.sin(u0),
        bx: r.cx + radio * Math.cos(u1), by: r.cy + radio * Math.sin(u1),
        nx: Math.cos(um) * sg, ny: Math.sin(um) * sg, alto: 1, tipo: 'rampa',
      });
    }
  };
  const cruce = Math.acos((265.5 - 230) / (RAMPA_R + RAMPA_MEDIO)); // ≈ 35,8°
  if (rampasAbiertas) {
    for (const r of RAMPAS) {
      const sentido = Math.sign(r.a1 - r.a0);
      arcoMuro(r, RAMPA_R - RAMPA_MEDIO, r.a0, r.a1, false);
      if (r.tipo === 'salida') arcoMuro(r, RAMPA_R + RAMPA_MEDIO, r.a0 + sentido * cruce, r.a1, true);
      else arcoMuro(r, RAMPA_R + RAMPA_MEDIO, r.a0, r.a1 - sentido * cruce, true);
    }
  }

  // Borde del barrio: muro con normal hacia dentro y huecos donde llegan las rampas.
  const ladosBarrio = [
    { fijo: 'x', v: BARRIO, nx: -1, ny: 0 },
    { fijo: 'x', v: -BARRIO, nx: 1, ny: 0 },
    { fijo: 'y', v: BARRIO, nx: 0, ny: -1 },
    { fijo: 'y', v: -BARRIO, nx: 0, ny: 1 },
  ];
  for (const l of ladosBarrio) {
    const abiertos = [];
    if (rampasAbiertas) {
      for (const r of RAMPAS) {
        const [bx, by] = r.barrio;
        const lado = Math.sign(bx) * BARRIO;
        if (l.fijo === 'x' && lado === l.v) abiertos.push([by - 4.5, by + 4.5]);
      }
    }
    abiertos.sort((a, b) => a[0] - b[0]);
    let c = -BARRIO;
    const trozos = [];
    for (const [a, b] of abiertos) { trozos.push([c, a]); c = b; }
    trozos.push([c, BARRIO]);
    for (const [a, b] of trozos) {
      if (l.fijo === 'x') muros.push({ ax: l.v, ay: a, bx: l.v, by: b, nx: l.nx, ny: l.ny, alto: 0.9, tipo: 'borde' });
      else muros.push({ ax: a, ay: l.v, bx: b, by: l.v, nx: l.nx, ny: l.ny, alto: 0.9, tipo: 'borde' });
    }
  }

  // Farolas: en la mediana de la Ronda cada 30 m (el ritmo de la velocidad) y en las aceras del barrio.
  for (let s2 = 0; s2 < LARGO_RONDA - 1; s2 += 30) {
    const p = rondaPunto(s2, 0);
    farolas.push({ x: p.x, y: p.y, h: 11, tipo: 'mediana', s: s2 });
  }
  const cercaCruce = (v, lista) => lista.some((c) => Math.abs(v - c) < 8);
  CALLES_NS.forEach((c, i) => {
    let lado = i % 2 ? 1 : -1;
    for (let y = -BARRIO + 12; y <= BARRIO - 12; y += 28) {
      lado = -lado;
      if (cercaCruce(y, CALLES_EO.map((e) => e.y))) continue;
      const x = c.x + lado * (c.ancho / 2 + 1.2), yy = y;
      if (dentro(TUNEL, c.x, yy) || Math.hypot(x, yy) < GLORIETA.rExt + 4 || dentro(PARKING, x, yy)) continue;
      farolas.push({ x, y: yy, h: 7, tipo: 'calle' });
    }
  });
  CALLES_EO.forEach((c, i) => {
    let lado = i % 2 ? 1 : -1;
    for (let x = -BARRIO + 12; x <= BARRIO - 12; x += 28) {
      lado = -lado;
      if (cercaCruce(x, CALLES_NS.map((e) => e.x))) continue;
      const y = c.y + lado * (c.ancho / 2 + 1.2);
      if (Math.hypot(x, y) < GLORIETA.rExt + 4 || dentro(PARKING, x, y)) continue;
      farolas.push({ x, y, h: 7, tipo: 'calle' });
    }
  });
  for (let y = TUNEL.y0 + 3; y <= TUNEL.y1 - 3; y += 6) farolas.push({ x: 0, y, h: 5.4, tipo: 'tunel' });
  for (const [x, y] of [[-128, 100], [-97, 100], [-128, 120], [-97, 120]]) farolas.push({ x, y, h: 9, tipo: 'parking' });

  // Rejilla para buscar rápido con qué puede chocar un coche.
  const CEL = 16, ORI = -336, NC = 42;
  const rejilla = Array.from({ length: NC * NC }, () => ({ cajas: [], muros: [], circulos: [] }));
  const marcar = (x0, y0, x1, y1, lista, i) => {
    const c0 = clamp(Math.floor((x0 - 1.5 - ORI) / CEL), 0, NC - 1), c1 = clamp(Math.floor((x1 + 1.5 - ORI) / CEL), 0, NC - 1);
    const f0 = clamp(Math.floor((y0 - 1.5 - ORI) / CEL), 0, NC - 1), f1 = clamp(Math.floor((y1 + 1.5 - ORI) / CEL), 0, NC - 1);
    for (let f = f0; f <= f1; f++) for (let c = c0; c <= c1; c++) rejilla[f * NC + c][lista].push(i);
  };
  cajas.forEach((b, i) => marcar(b.x0, b.y0, b.x1, b.y1, 'cajas', i));
  muros.forEach((m, i) => marcar(Math.min(m.ax, m.bx), Math.min(m.ay, m.by), Math.max(m.ax, m.bx), Math.max(m.ay, m.by), 'muros', i));
  circulos.forEach((c, i) => marcar(c.x - c.r, c.y - c.r, c.x + c.r, c.y + c.r, 'circulos', i));
  const vacia = { cajas: [], muros: [], circulos: [] };
  function cercanos(x, y) {
    const c = Math.floor((x - ORI) / CEL), f = Math.floor((y - ORI) / CEL);
    if (c < 0 || f < 0 || c >= NC || f >= NC) return vacia;
    return rejilla[f * NC + c];
  }

  const grafo = construirGrafo(rampasAbiertas);

  function zonaEn(x, y) {
    if (Math.abs(x) <= BARRIO && Math.abs(y) <= BARRIO) {
      if (dentro(PARKING, x, y)) return 'parking';
      if (dentro(TUNEL, x, y)) return 'tunel';
      for (const c of CALLEJONES) if (dentro(c, x, y)) return 'callejon';
      if (x * x + y * y < GLORIETA.rExt * GLORIETA.rExt) return 'glorieta';
      return 'barrio';
    }
    const p = rondaProyectar(x, y);
    if (p.d <= 0.5 && p.d >= -14.6) return 'ronda';
    if (p.d > 0.5 && p.d <= 15) return 'rondaExterior';
    return 'rampa';
  }

  function nombreLugar(x, y) {
    const z = zonaEn(x, y);
    if (z === 'ronda' || z === 'rondaExterior') {
      const p = rondaProyectar(x, y);
      return `${tramoNombre(p.s)}, kilómetro ${(p.s / 1000).toFixed(1).replace('.', ',')}`;
    }
    if (z === 'rampa') {
      let mejor = RAMPAS[0], md = Infinity;
      for (const r of RAMPAS) {
        const d = Math.abs(dist(x, y, r.cx, r.cy) - RAMPA_R);
        if (d < md) { md = d; mejor = r; }
      }
      return mejor.nombre;
    }
    if (z === 'parking') return PARKING.nombre;
    if (z === 'tunel') return TUNEL.nombre;
    if (z === 'glorieta') return GLORIETA.nombre;
    if (z === 'callejon') return CALLEJONES.find((c) => dentro(c, x, y)).nombre;
    let nombre = CALLES_NS[0].nombre, md = Infinity;
    for (const c of CALLES_NS) { const d = Math.abs(x - c.x); if (d < md) { md = d; nombre = c.nombre; } }
    for (const c of CALLES_EO) { const d = Math.abs(y - c.y); if (d < md) { md = d; nombre = c.nombre; } }
    return nombre;
  }

  // Línea de visión entre dos coches. opciones.camiones: cajas orientadas de camiones { x, y, h, ml, ma }.
  function visible(ax, ay, bx, by, opciones = {}) {
    const x0 = Math.min(ax, bx), x1 = Math.max(ax, bx), y0 = Math.min(ay, by), y1 = Math.max(ay, by);
    for (const e of listaEdificios) {
      if (e.x1 < x0 || e.x0 > x1 || e.y1 < y0 || e.y0 > y1) continue;
      if (segmentoCortaCaja(ax, ay, bx, by, e.x0, e.y0, e.x1, e.y1)) return false;
    }
    for (const p of pantallas) {
      if (Math.max(p.ax, p.bx) < x0 || Math.min(p.ax, p.bx) > x1 || Math.max(p.ay, p.by) < y0 || Math.min(p.ay, p.by) > y1) continue;
      if (segmentosSeCortan(ax, ay, bx, by, p.ax, p.ay, p.bx, p.by)) return false;
    }
    // La rasante: la recta entre los ojos no puede pasar por debajo del asfalto.
    if (y0 < -255 && x1 > -115 && x0 < 115) {
      const ha = alturaEn(ax, ay) + 1.35, hb = alturaEn(bx, by) + 1.15;
      const largo = Math.hypot(bx - ax, by - ay);
      const n = Math.min(40, Math.max(2, Math.ceil(largo / 8)));
      for (let i = 1; i < n; i++) {
        const t = i / n;
        if (alturaEn(ax + (bx - ax) * t, ay + (by - ay) * t) + 0.25 > ha + (hb - ha) * t) return false;
      }
    }
    if (opciones.camiones) {
      for (const c of opciones.camiones) {
        if (c.x + 12 < x0 || c.x - 12 > x1 || c.y + 12 < y0 || c.y - 12 > y1) continue;
        if (segmentoCortaCajaOrientada(ax, ay, bx, by, c.x, c.y, c.h, c.ml, c.ma)) return false;
      }
    }
    return true;
  }

  return {
    rampasAbiertas,
    cajas, muros, circulos, pantallas, aparcados, farolas,
    manzanas: listaManzanas,
    edificios: listaEdificios,
    grafo,
    cercanos,
    zonaEn,
    nombreLugar,
    visible,
    ruta: (ox, oy, dx, dy, op) => ruta(grafo, ox, oy, dx, dy, op),
    aristaCercana: (x, y, op) => aristaCercana(grafo, x, y, op),
    nodosCerca: (x, y, r, op) => nodosCerca(grafo, x, y, r, op),
  };
}

// ------------------------------------------------------------------ el grafo de calles para la IA
function construirGrafo(rampasAbiertas) {
  const nodos = [], aristas = [];
  const indice = new Map();
  const clave = (x, y) => Math.round(x * 4) + ':' + Math.round(y * 4);
  const nodo = (x, y, tipo = 'cruce') => {
    const k = clave(x, y);
    let id = indice.get(k);
    if (id === undefined) {
      id = nodos.length;
      nodos.push({ id, x, y, tipo, aristas: [] });
      indice.set(k, id);
    }
    return id;
  };
  const arista = (a, b, puntos, props = {}) => {
    const acum = [0];
    for (let i = 1; i < puntos.length; i++) {
      acum.push(acum[i - 1] + dist(puntos[i - 1][0], puntos[i - 1][1], puntos[i][0], puntos[i][1]));
    }
    const e = {
      id: aristas.length, a, b, puntos, acum, largo: acum[acum.length - 1],
      tipo: 'calle', dirigida: false, tunel: false, nombre: '', ancho: 9, ...props,
    };
    aristas.push(e);
    nodos[a].aristas.push(e.id);
    nodos[b].aristas.push(e.id);
    return e;
  };

  // Calles: cada una se parte en sus cruces y en las bocas de callejones y del parking.
  const extrasNS = { '-150': [-39, 100], '-75': [-39] };
  const extrasEO = { 75: [-112.5, 39], 150: [39] };
  for (const c of CALLES_NS) {
    let ys = CALLES_EO.map((e) => e.y);
    if (c.x === 0) ys = ys.filter((y) => y !== 0).concat([-18, 18]);
    ys = ys.concat(extrasNS[String(c.x)] || []).sort((a, b) => a - b);
    for (let i = 0; i < ys.length - 1; i++) {
      if (c.x === 0 && ys[i] === -18 && ys[i + 1] === 18) continue;
      const tunel = c.x === 0 && ys[i] === -150 && ys[i + 1] === -75;

      pinchazos: 0, pits: 0, contraSeg: 0, escondidoSeg: 0,
    },
  };
  decir(p, 'inicio', { unidad: lince.nombre });
  return p;
}

// La presentación recoge los eventos una vez por fotograma.
function sacarEventos(p) {
  const ev = p.eventos;
  p.eventos = [];
  return ev;
}

function emitir(p, tipo, datos = {}) {
  p.eventos.push({ ...datos, tipo, t: p.t });
}

// ------------------------------------------------------------------ radio
function decir(p, clave, datos = {}, inmediata = false) {
  const lugar = datos.lugar ?? p.mapa.nombreLugar(p.jugador.x, p.jugador.y);
  const unidad = datos.unidad ?? (p.policia[0] ? p.policia[0].nombre : 'CENTRAL');
  const linea = lineaRadio(clave, { color: p.color, coche: p.cocheNombre, ...datos, lugar, unidad }, p.azar.radio);
  if (!linea) return;
  linea.prioridad = PRIORIDAD[clave] ?? 3;
  linea.t = p.t;
  if (inmediata) {
    p.radio.actual = linea;
    p.radio.espera = 2.4;
    emitir(p, 'radio', { linea });
    return;
  }
  p.radio.cola.push(linea);
  p.radio.cola.sort((a, b) => b.prioridad - a.prioridad || a.t - b.t);
  if (p.radio.cola.length > 3) p.radio.cola.length = 3;
}

function pasoRadio(p, dt) {
  p.radio.espera -= dt;
  if (p.radio.cola.length) p.radio.cola = p.radio.cola.filter((l) => p.t - l.t < 6);
  if (p.radio.espera <= 0 && p.radio.cola.length) {
    const linea = p.radio.cola.shift();
    p.radio.actual = linea;
    p.radio.espera = 2.4;
    emitir(p, 'radio', { linea });
  }
  // Mientras te buscan, la radio va contando la búsqueda.
  if (p.ojo.estado === 'ambar') {
    p.radio.busquedaT -= dt;
    if (p.radio.busquedaT <= 0) {
      p.radio.busquedaT = 4.5;
      const u = p.policia.length ? p.azar.radio.elegir(p.policia) : null;
      const enRonda = p.mapa.zonaEn(p.ojo.ultima.x, p.ojo.ultima.y) === 'ronda';
      decir(p, enRonda ? 'busquedaRonda' : 'busqueda', { unidad: u ? u.nombre : 'CENTRAL', lugar: p.mapa.nombreLugar(p.ojo.ultima.x, p.ojo.ultima.y) });
    }
  } else p.radio.busquedaT = 3;
}

// ------------------------------------------------------------------ choques
// Choques con el decorado. Rozar un muro frena: nada de ir apoyado en la mediana.
function choquesMundo(p, c, dt) {
  let golpe = 0, toca = false;
  const fx = Math.sin(c.h), fy = Math.cos(c.h);
  for (const k of c.circulos) {
    const cx = c.x + fx * k.o, cy = c.y + fy * k.o;
    const cel = p.mapa.cercanos(cx, cy);
    for (const i of cel.cajas) {
      const b = p.mapa.cajas[i];
      const r = circuloCaja(c.x + fx * k.o, c.y + fy * k.o, k.r, b.x0, b.y0, b.x1, b.y1);
      if (r) golpe = Math.max(golpe, choqueFijo(c, r.nx, r.ny, r.pen, fx * k.o, fy * k.o));
    }
    for (const i of cel.muros) {
      const r = circuloMuro(c.x + fx * k.o, c.y + fy * k.o, k.r, p.mapa.muros[i]);
      if (r) golpe = Math.max(golpe, choqueFijo(c, r.nx, r.ny, r.pen, fx * k.o, fy * k.o));
    }
    for (const i of cel.circulos) {
      const o = p.mapa.circulos[i];
      const r = circuloCirculo(c.x + fx * k.o, c.y + fy * k.o, k.r, o.x, o.y, o.r);
      if (r) golpe = Math.max(golpe, choqueFijo(c, r.nx, r.ny, r.pen, fx * k.o, fy * k.o));
    }
  }
  toca = golpe > 0 || c.roceT > 0;
  c.roce = false;
  if (golpe > 0) {
    c.roceT = 0.1;
    const v = Math.hypot(c.vx, c.vy);
    if (v > 1) {
      const k = Math.max(0, v - 6 * dt) / v;
      c.vx *= k;
      c.vy *= k;
      c.roce = v > 4;
    }
  } else c.roceT = Math.max(0, (c.roceT || 0) - dt);
  return toca ? golpe : 0;
}

// Contacto entre dos coches (círculos a lo largo de cada eje). Normal de b hacia a.
function contacto(a, b) {
  const lim = (a.largo + b.largo) / 2 + 0.3;
  if (Math.abs(a.x - b.x) > lim || Math.abs(a.y - b.y) > lim) return null;
  if (!b.circulos) b.circulos = circulosDe(b.largo, b.ancho);
  const fa = [Math.sin(a.h), Math.cos(a.h)], fb = [Math.sin(b.h), Math.cos(b.h)];
  let mejor = null;
  for (const ka of a.circulos) {
    const ax = a.x + fa[0] * ka.o, ay = a.y + fa[1] * ka.o;
    for (const kb of b.circulos) {
      const bx = b.x + fb[0] * kb.o, by = b.y + fb[1] * kb.o;
      const dx = ax - bx, dy = ay - by, d = Math.hypot(dx, dy) || 1e-6;
      const pen = ka.r + kb.r - d;
      if (pen > 0 && (!mejor || pen > mejor.pen)) mejor = { nx: dx / d, ny: dy / d, pen };
    }
  }
  return mejor;
}

// ------------------------------------------------------------------ el paso
// entrada: { dir, gas, freno, mano, nitro, nitroToque, motorToque, arrancar }
function pasoPartida(p, entrada = {}, dt = DT) {
  if (p.final) return;
  p.t += dt;
  p.pasos++;
  const j = p.jugador, mapa = p.mapa, tr = p.trafico;
  grabar(p, entrada);

  // 1. Tu coche.
  if (entrada.motorToque) {
    if (j.motor && Math.abs(j.vf) < 3) { j.motor = false; emitir(p, 'apagar'); }
    else if (!j.motor) { j.motor = true; emitir(p, 'arranque'); }
  } else if (entrada.arrancar && !j.motor) {
    j.motor = true;
    emitir(p, 'arranque');
  }
  const e = {
    dir: clamp(entrada.dir || 0, -1, 1), gas: clamp(entrada.gas || 0, 0, 1), freno: clamp(entrada.freno || 0, 0, 1),
    mano: !!entrada.mano, nitro: !!entrada.nitro, nitroToque: !!entrada.nitroToque,
  };
  for (const ev of pasoCoche(j, e, dt, p.asistencia)) {
    emitir(p, ev.tipo, ev);
    if (ev.tipo === 'salidaPerfecta') decir(p, 'salidaPerfecta');
    if (ev.tipo === 'tirachinas' && p.rebufoGap < 6) {
      // Saliste del rebufo en el último metro: quien venga pegado detrás se queda 3 s sin verte.
      for (const u of p.policia) {
        const dx = u.coche.x - j.x, dy = u.coche.y - j.y;
        const lon = dx * Math.sin(j.h) + dy * Math.cos(j.h);
        if (lon < 0 && lon > -45) { u.ciego = 3; u.ve = false; }
      }
    }
  }

  // 2. Tráfico y policía.
  const cuerpos = [j];
  for (const u of p.policia) { u.coche.sirena = u.sirena; cuerpos.push(u.coche); }
  pasoTrafico(tr, dt, cuerpos, mapa, p.azar.trafico);
  const ctx = { jugador: j, mapa, ojo: p.ojo, zonaJugador: p.zona, azar: p.azar.policia, pinchos: p.pinchos, otros: [], orden: 0 };
  p.policia.forEach((u, i) => {
    ctx.otros = cercaDe(tr, u.coche.x, u.coche.y, 60);
    for (const o of p.policia) if (o !== u) ctx.otros.push(o.coche);
    ctx.orden = i;
    for (const ev of pasoUnidad(u, ctx, dt)) {
      emitir(p, ev.tipo, ev);
      if (ev.tipo === 'pitAviso') decir(p, 'pit', { unidad: u.nombre });
      if (ev.tipo === 'pitFallo') decir(p, 'pitFallo', { unidad: u.nombre });
    }
  });

  // 3. Choques.
  const golpeMuro = choquesMundo(p, j, dt);
  if (golpeMuro > 3) { emitir(p, 'golpe', { fuerza: golpeMuro, con: 'muro' }); p.stats.choques++; }
  for (const u of p.policia) choquesMundo(p, u.coche, dt);
  const cercanos = cercaDe(tr, j.x, j.y, 16);
  for (const t of cercanos) {
    const k = contacto(j, t);
    if (!k) continue;
    const f = choqueEntre(j, t, k.nx, k.ny, k.pen);
    golpeado(t, f);
    const seg = p.casi.get(t.id);
    if (seg) seg.tocado = true;
    if (f > 1.5) {
      romperCadena(p.botin);
      p.stats.choques++;
      emitir(p, 'golpe', { fuerza: f, con: 'trafico' });
      if (f > 8 && p.ojo.estado === 'rojo') {
        p.riesgo += 0.18;
        decir(p, 'choque');
      }
    }
  }
  for (const u of p.policia) {
    const k = contacto(j, u.coche);
    if (k) {
      const f = choqueEntre(j, u.coche, k.nx, k.ny, k.pen);
      if (f > 1.5) emitir(p, 'golpe', { fuerza: f, con: 'policia' });
      if (u.pit && u.pit.fase === 'ataque') {
        j.trompo = 1.4;
        j.w = u.pit.lado * 3.8;
        j.derrape = false;
        u.pit = null;
        u.pitEnfriar = 10;
        p.stats.pits++;
        emitir(p, 'pit', { unidad: u.id });
        decir(p, 'pitHecho', { unidad: u.nombre });
      }
    }
    for (const t of cercaDe(tr, u.coche.x, u.coche.y, 16)) {
      const k2 = contacto(u.coche, t);
      if (k2) golpeado(t, choqueEntre(u.coche, t, k2.nx, k2.ny, k2.pen));
    }
  }
  for (let a = 0; a < p.policia.length; a++) {
    for (let b = a + 1; b < p.policia.length; b++) {
      const k = contacto(p.policia[a].coche, p.policia[b].coche);
      if (k) choqueEntre(p.policia[a].coche, p.policia[b].coche, k.nx, k.ny, k.pen);
    }
  }

  // 4. Dónde estás.
  const zona = mapa.zonaEn(j.x, j.y);
  if (zona !== p.zona) cambioZona(p, p.zona, zona);
  p.zona = zona;
  const vJ = Math.abs(j.vf);
  p.stats.velMaxKmh = Math.max(p.stats.velMaxKmh, vJ * 3.6);

  // 5. Estilo: casi-choques, huecos, rebufo y derrape.
  estilo(p, cercanos, dt);

  // 6. Te ven: línea de visión de cada unidad.
  deteccion(p, dt);

  // 7. Alerta, pinchos, riesgo y detención.
  escalar(p, dt);
  pasoPinchos(p, dt);
  riesgo(p, dt);
  if (!p.final) detencion(p, dt);

  // 8. Botín y radio.
  if (!p.final) {
    pasoBotin(p.botin, dt, p.ojo.estado, p.nivel);
    pasoRadio(p, dt);
  }
}

function grabar(p, en) {
  // La cinta: la semilla más las entradas bastan para repetir la partida (repeticiones, clips, Sombras).
  const k = `${Math.round((en.dir || 0) * 100)},${Math.round((en.gas || 0) * 100)},${Math.round((en.freno || 0) * 100)},${en.mano ? 1 : 0}${en.nitro ? 1 : 0}${en.nitroToque ? 1 : 0}${en.motorToque ? 1 : 0}${en.arrancar ? 1 : 0}`;
  if (k !== p.ultimaEntrada && p.cinta.length < 60000) {
    p.cinta.push([p.pasos, k]);
    p.ultimaEntrada = k;
  }
}

function cambioZona(p, de, a) {
  emitir(p, 'zona', { de, a });
  if (a === 'tunel') emitir(p, 'tunelEntra');
  if (de === 'tunel') emitir(p, 'tunelSale');
  if (p.ojo.estado !== 'rojo') return;
  const unidad = cercana(p);
  if (a === 'tunel') decir(p, 'tunel', { unidad });
  else if (a === 'parking') decir(p, 'parking', { unidad });
  else if (a === 'callejon') decir(p, 'callejon', { unidad });
  else if (de === 'ronda' && a === 'rampa') decir(p, 'salidaRonda', { unidad });
}

function cercana(p) {
  let mejor = p.policia[0], md = Infinity;
  for (const u of p.policia) if (u.distJugador < md) { md = u.distJugador; mejor = u; }
  return mejor ? mejor.nombre : 'CENTRAL';
}

function estilo(p, cercanos, dt) {
  const j = p.jugador, b = p.botin;
  const vJ = Math.abs(j.vf);
  // Casi-choques: se sigue cada vehículo mientras vas a su altura; al dejarlo atrás sin tocarlo, se puntúa.
  const vistos = new Set();
  for (const t of cercanos) {
    vistos.add(t.id);
    const fx = Math.sin(t.h), fy = Math.cos(t.h), rx = Math.cos(t.h), ry = -Math.sin(t.h);
    const dx = j.x - t.x, dy = j.y - t.y;
    const lon = dx * fx + dy * fy, lat = dx * rx + dy * ry;
    const solape = Math.abs(lon) < (t.largo + j.largo) / 2 + 0.4;
    const gap = Math.abs(lat) - (t.ancho + j.ancho) / 2;
    let seg = p.casi.get(t.id);
    if (solape && gap < 1.6) {
      if (!seg) { seg = { min: gap, lat, vRel: 0, tocado: false }; p.casi.set(t.id, seg); }
      if (gap < seg.min) { seg.min = gap; seg.lat = lat; }
      seg.vRel = Math.max(seg.vRel, Math.abs(j.vx * fx + j.vy * fy - (t.vx * fx + t.vy * fy)));
    } else if (seg) {
      terminarCasi(p, seg, vJ);
      p.casi.delete(t.id);
    }
  }
  for (const [id, seg] of p.casi) {
    if (!vistos.has(id)) { terminarCasi(p, seg, vJ); p.casi.delete(id); }
  }

  // Rebufo: detrás de un camión, en su estela, a más de 80 km/h.
  let reb = 0, gapReb = Infinity;
  if (p.zona === 'ronda' && vJ > 22) {
    for (const t of p.trafico.ronda) {
      if (t.tipo !== 'camion') continue;
      const fx = Math.sin(t.h), fy = Math.cos(t.h);
      const dx = j.x - t.x, dy = j.y - t.y;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) continue;
      const lon = dx * fx + dy * fy, lat = dx * Math.cos(t.h) - dy * Math.sin(t.h);
      const g = -lon - (t.largo + j.largo) / 2;
      if (g >= 0 && g <= 20 && Math.abs(lat) < 1.2) {
        const r = 1 - (0.5 * g) / 20;
        if (r > reb) { reb = r; gapReb = g; }
      }
    }
  }
  j.rebufo = reb;
  if (reb > 0) p.rebufoGap = gapReb;
  else if (j.tirachinas <= 0) p.rebufoGap = Infinity;
  if ((reb > 0.5) !== p.rebufoOn) {
    p.rebufoOn = reb > 0.5;
    emitir(p, 'rebufo', { on: p.rebufoOn });
  }
  // Los Lobo también cogen rebufo: detrás de camiones y detrás de ti.
  for (const u of p.policia) {
    const c = u.coche;
    let r = 0;
    const fuentes = [j, ...p.trafico.ronda.filter((t) => t.tipo === 'camion')];
    for (const f of fuentes) {
      const fx = Math.sin(f.h), fy = Math.cos(f.h);
      const dx = c.x - f.x, dy = c.y - f.y;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) continue;
      const lon = dx * fx + dy * fy, lat = dx * Math.cos(f.h) - dy * Math.sin(f.h);
      const g = -lon - (f.largo + c.largo) / 2;
      const alcance = f === j ? 12 : 20;
      if (g >= 0 && g <= alcance && Math.abs(lat) < 1.2 && Math.abs(c.vf) > 22) r = Math.max(r, 1 - (0.5 * g) / alcance);
    }
    c.rebufo = r;
  }

  // Derrape: se paga mientras dura (el doble en la glorieta). En sentido contrario, nada puntúa.
  if (j.derrape && vJ > 8) {
    p.stats.derrapeSeg += dt;
    if (!p.contra) derrape(b, dt, p.zona === 'glorieta');
  }
}

function terminarCasi(p, seg, vJ) {
  if (seg.tocado || seg.min >= 1.1 || seg.vRel < 5 || vJ < 15 || p.contra) return;
  const fuerza = clamp(1 - seg.min / 1.1, 0, 1);
  const lado = seg.lat > 0 ? 'izquierda' : 'derecha'; // lado del coche rebasado, visto desde ti
  const gana = casiChoque(p.botin, fuerza);
  p.jugador.nitro = Math.min(1, p.jugador.nitro + 0.05);
  p.stats.casiChoques++;
  emitir(p, 'casiChoque', { lado, fuerza, gana, cadena: p.botin.cadena, mult: p.botin.mult });
  // HUECO: dos casi-choques por lados opuestos en 0,4 s, con menos de medio metro en cada uno.
  const u = p.ultimoCasi;
  if (u && p.t - u.t < 0.4 && u.lado !== lado && u.min < 0.55 && seg.min < 0.55) {
    const g = hueco(p.botin);
    p.jugador.nitro = Math.min(1, p.jugador.nitro + 0.12);
    p.stats.huecos++;
    emitir(p, 'hueco', { gana: g });
    decir(p, 'hueco', { unidad: cercana(p) });
    p.ultimoCasi = null;
  } else p.ultimoCasi = { t: p.t, lado, min: seg.min };
}

// ------------------------------------------------------------------ el Ojo
function alcanceDeteccion(p) {
  const j = p.jugador;
  const z = p.zona;
  const base = z === 'ronda' || z === 'rondaExterior' || z === 'rampa' ? ALCANCE.ronda : ALCANCE.barrio;
  const parado = Math.abs(j.vf) < 0.5;
  let r;
  if (!j.motor && parado) {
    r = 5 + 35 * j.calor;
    if (z === 'parking') r *= 0.6;
    else if (z === 'tunel' || z === 'callejon') r *= 0.8;
  } else if (parado) r = base * 0.75;
  else r = base;
  if (p.fuga120) r *= 0.5;
  return r;
}

function deteccion(p, dt) {
  const j = p.jugador, mapa = p.mapa;
  // Fuga a 120: con el Ojo en ámbar, en la Ronda, entre el tráfico y a 115-123 km/h.
  const kmh = Math.abs(j.vf) * 3.6;
  let vecinos = 0;
  if (p.ojo.estado === 'ambar' && p.zona === 'ronda' && kmh >= 115 && kmh <= 123) {
    for (const t of p.trafico.ronda) if (Math.abs(t.x - j.x) < 45 && Math.abs(t.y - j.y) < 45) vecinos++;
  }
  p.fuga120 = vecinos >= 2;
  if (p.fuga120) {
    p.fuga120T += dt;
    if (p.fuga120T > 2 && p.fuga120T - dt <= 2) decir(p, 'fuga120', { unidad: cercana(p) });
  } else p.fuga120T = 0;
  if (!j.motor && Math.abs(j.vf) < 0.5) p.stats.escondidoSeg += dt;

  const alcance = alcanceDeteccion(p);
  let cam = null;
  let visto = false, distMin = Infinity, quien = null;
  p.policia.forEach((u, i) => {
    const c = u.coche;
    const d = dist(c.x, c.y, j.x, j.y);
    let r = alcance;
    const ang = Math.abs(Math.atan2(Math.sin(rumbo(j.x - c.x, j.y - c.y) - c.h), Math.cos(rumbo(j.x - c.x, j.y - c.y) - c.h)));
    if (ang > 1.9) r *= 0.55;
    let ve = false;
    if (u.ciego <= 0 && d <= r) {
      // La línea de visión se recalcula 15 veces por segundo por unidad (escalonadas).
      if ((p.pasos + i) % 4 === 0 || u.los === undefined) {
        if (!cam) cam = { camiones: camiones(p.trafico) };
        u.los = mapa.visible(c.x, c.y, j.x, j.y, cam);
      }
      ve = u.los;
    } else u.los = undefined;
    // Para volver a verte cuando ya te buscan hace falta mantener la vista 0,3 s.
    if (ve) u.veT += dt;
    else u.veT = 0;
    u.ve = ve && (p.ojo.estado === 'rojo' || u.veT >= 0.3);
    if (u.ve) {
      visto = true;
      if (d < distMin) { distMin = d; quien = u; }
    }
  });
  const antes = p.ojo.estado;
  for (const ev of pasoOjo(p.ojo, visto, j, p.nivel, dt, p.t, distMin)) {
    if (ev === 'visto') {
      p.stats.vecesVisto++;
      emitir(p, 'ojo', { estado: 'rojo', antes });
      decir(p, 'visto', { unidad: quien ? quien.nombre : 'CENTRAL' });
    } else if (ev === 'perdido') {
      emitir(p, 'ojo', { estado: 'ambar', antes });
      const u = p.policia.reduce((a, b) => (b.distJugador < a.distJugador ? b : a), p.policia[0]);
      const lugar = mapa.nombreLugar(p.ojo.ultima.x, p.ojo.ultima.y);
      const trasCamion = u && camionEntre(p, u.coche, j);
      decir(p, trasCamion ? 'relevo' : enRasante(p) ? 'rasante' : 'perdido', { unidad: u ? u.nombre : 'CENTRAL', lugar });
    } else if (ev === 'libre') {
      emitir(p, 'ojo', { estado: 'cerrado', antes });
      terminar(p, finalDeEscape(p.ojo));
    }
  }
}

function camionEntre(p, c, j) {
  for (const t of p.trafico.ronda) {
    if (t.tipo !== 'camion') continue;
    if (!p.mapa.visible(c.x, c.y, j.x, j.y, { camiones: [{ x: t.x, y: t.y, h: t.h, ml: t.largo / 2, ma: t.ancho / 2 }] })) return true;
  }
  return false;
}

function enRasante(p) {
  const j = p.jugador;
  return j.y < -255 && Math.abs(j.x) < 115;
}

// ------------------------------------------------------------------ alerta: niveles, refuerzos, controles y pinchos

    { w: 0.34, h: 0.14, d: 0.05, x: A / 2 - 0.3, y: yL, z: -L / 2 - 0.02, color: '#FFF4D6' },
    { w: 0.3, h: 0.12, d: 0.05, x: -A / 2 + 0.25, y: yL + 0.08, z: L / 2 + 0.02, color: '#FF2A1A' },
    { w: 0.3, h: 0.12, d: 0.05, x: A / 2 - 0.25, y: yL + 0.08, z: L / 2 + 0.02, color: '#FF2A1A' },
  ];
  return { cuerpo: fundirCajas(partes), luces: fundirCajas(luces), largo: L, ancho: A };
}

// ------------------------------------------------------------------ texturas
function texturaBarrio(res) {
  const c = lienzo(res, res), g = c.getContext('2d');
  const S = res / 470, px = (x) => (x + 235) * S, py = (y) => (235 - y) * S;
  g.fillStyle = '#2B2E35';
  g.fillRect(0, 0, res, res);
  // Calles.
  g.fillStyle = '#16181D';
  for (const c2 of CALLES_NS) g.fillRect(px(c2.x - c2.ancho / 2), 0, c2.ancho * S, res);
  for (const c2 of CALLES_EO) g.fillRect(0, py(c2.y + c2.ancho / 2), res, c2.ancho * S);
  for (const cj of CALLEJONES) g.fillRect(px(cj.x0), py(cj.y1), (cj.x1 - cj.x0) * S, (cj.y1 - cj.y0) * S);
  g.fillRect(px(PARKING.x0), py(PARKING.y1), (PARKING.x1 - PARKING.x0) * S, (PARKING.y1 - PARKING.y0) * S);
  // Glorieta.
  g.beginPath();
  g.arc(px(0), py(0), GLORIETA.rExt * S, 0, Math.PI * 2);
  g.fill();
  // Marcas: línea central discontinua en calles; doble continua en avenidas.
  g.strokeStyle = 'rgba(235,235,225,0.75)';
  g.lineWidth = Math.max(1, 0.15 * S);
  g.setLineDash([3 * S, 5 * S]);
  for (const c2 of CALLES_NS) if (c2.ancho < 16) { g.beginPath(); g.moveTo(px(c2.x), 0); g.lineTo(px(c2.x), res); g.stroke(); }
  for (const c2 of CALLES_EO) if (c2.ancho < 16) { g.beginPath(); g.moveTo(0, py(c2.y)); g.lineTo(res, py(c2.y)); g.stroke(); }
  g.setLineDash([]);
  for (const o of [-0.25, 0.25]) {
    g.beginPath(); g.moveTo(px(o), 0); g.lineTo(px(o), py(GLORIETA.rExt)); g.moveTo(px(o), py(-GLORIETA.rExt)); g.lineTo(px(o), res); g.stroke();
    g.beginPath(); g.moveTo(0, py(o)); g.lineTo(px(-GLORIETA.rExt), py(o)); g.moveTo(px(GLORIETA.rExt), py(o)); g.lineTo(res, py(o)); g.stroke();
  }
  // Pasos de cebra en las bocas de los cruces.
  g.fillStyle = 'rgba(230,230,220,0.55)';
  for (const a of CALLES_NS) for (const b of CALLES_EO) {
    if (Math.abs(a.x) < 1 && Math.abs(b.y) < 1) continue;
    for (const lado of [-1, 1]) {
      const yz = b.y + lado * (b.ancho / 2 + 1.6);
      for (let k = -a.ancho / 2 + 0.6; k < a.ancho / 2 - 0.4; k += 1.2) g.fillRect(px(a.x + k), py(yz + 1.2), 0.6 * S, 2.4 * S);
      const xz = a.x + lado * (a.ancho / 2 + 1.6);
      for (let k = -b.ancho / 2 + 0.6; k < b.ancho / 2 - 0.4; k += 1.2) g.fillRect(px(xz - 1.2), py(b.y + k + 0.6), 2.4 * S, 0.6 * S);
    }
  }
  // Plazas del parking.
  g.strokeStyle = 'rgba(230,230,220,0.6)';
  g.lineWidth = Math.max(1, 0.12 * S);
  for (const fy of [88.5, 93.1, 108.6, 113.2, 126.6, 131.2]) {
    for (let x = -143.1; x <= -81; x += 4.2) {
      g.beginPath(); g.moveTo(px(x), py(fy - 2.2)); g.lineTo(px(x), py(fy + 2.2)); g.stroke();
    }
  }
  // Isleta de la glorieta.
  g.fillStyle = '#1E3322';
  g.beginPath();
  g.arc(px(0), py(0), GLORIETA.r * S, 0, Math.PI * 2);
  g.fill();
  return texturaDe(c);
}

function texturaRonda() {
  // u: de d = -15 (borde del barrio) a d = +15 (borde exterior); v: 24 m por repetición.
  const W = 1024, H = 256, c = lienzo(W, H), g = c.getContext('2d');
  const u = (d) => ((d + 15) / 30) * W;
  g.fillStyle = '#17191E';
  g.fillRect(0, 0, W, H);
  // Algo de grano para que el asfalto no parezca plástico.
  const azar = crearAzar(7);
  for (let i = 0; i < 1800; i++) {
    g.fillStyle = `rgba(255,255,255,${azar.rango(0.01, 0.05)})`;
    g.fillRect(azar.rango(0, W), azar.rango(0, H), 1, 1);
  }
  g.fillStyle = '#4A4C52';
  g.fillRect(u(-0.5), 0, u(0.5) - u(-0.5), H);
  g.fillStyle = 'rgba(246,246,236,0.95)';
  const linea = (d, discontinua) => {
    const w = 0.2 / 30 * W;
    if (!discontinua) g.fillRect(u(d) - w / 2, 0, w, H);
    else for (const y0 of [0, H / 2]) g.fillRect(u(d) - w / 2, y0, w, H * (4.5 / 24));
  };
  for (const s of [-1, 1]) {
    linea(s * 1.1, false);
    linea(s * 14.0, false);
    linea(s * 5.1, true);
    linea(s * 8.7, true);
  }
  const t = texturaDe(c, true);
  t.anisotropy = 8; // las marcas viales se siguen viendo a lo lejos y en ángulo rasante
  return t;
}

function texturaPantalla() {
  const c = lienzo(128, 128), g = c.getContext('2d');
  g.fillStyle = '#233247';
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#34465F';
  g.fillRect(0, 0, 128, 10);
  g.fillStyle = '#8C949E'; // guardarraíl abajo
  g.fillRect(0, 104, 128, 16);
  g.fillStyle = '#5D646D';
  g.fillRect(0, 118, 128, 10);
  g.fillStyle = '#10151E'; // postes cada 2 m: el ritmo de la velocidad
  g.fillRect(0, 0, 10, 128);
  g.fillRect(64, 0, 6, 104);
  return texturaDe(c, true);
}

function texturaVentanas() {
  const c = lienzo(256, 256), g = c.getContext('2d');
  const e = lienzo(256, 256), ge = e.getContext('2d');
  g.fillStyle = '#FFFFFF';
  g.fillRect(0, 0, 256, 256);
  ge.fillStyle = '#000000';
  ge.fillRect(0, 0, 256, 256);
  const azar = crearAzar(99);
  const calidos = ['#FFD9A0', '#FFE7B8', '#FFC77A', '#CFE3FF', '#FFF1D8'];
  for (let fil = 0; fil < 8; fil++) {
    for (let col = 0; col < 8; col++) {
      const x = col * 32 + 7, y = fil * 32 + 9;
      const encendida = azar.probabilidad(0.32);
      g.fillStyle = encendida ? '#7A6A52' : '#20262F';
      g.fillRect(x, y, 18, 16);
      if (encendida) {
        ge.fillStyle = azar.elegir(calidos);
        ge.globalAlpha = azar.rango(0.55, 1);
        ge.fillRect(x, y, 18, 16);
        ge.globalAlpha = 1;
      }
    }
  }
  const t = texturaDe(c, true), te = texturaDe(e, true);
  return { mapa: t, brillo: te };
}

function texturaHorizonte() {
  const W = 2048, H = 256, c = lienzo(W, H), g = c.getContext('2d');
  const cielo = g.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, '#060912');
  cielo.addColorStop(0.55, '#101A33');
  cielo.addColorStop(0.8, '#2A2440');
  cielo.addColorStop(1, '#3A2A3A');
  g.fillStyle = cielo;
  g.fillRect(0, 0, W, H);
  const azar = crearAzar(3);
  let x = 0;
  while (x < W) {
    const w = azar.rango(14, 46), h = azar.rango(18, 95);
    g.fillStyle = '#070A12';
    g.fillRect(x, H - h, w, h);
    for (let wy = H - h + 4; wy < H - 4; wy += 6) for (let wx = x + 3; wx < x + w - 3; wx += 5) {
      if (azar.probabilidad(0.18)) {
        g.fillStyle = azar.probabilidad(0.8) ? 'rgba(255,210,150,0.8)' : 'rgba(180,210,255,0.8)';
        g.fillRect(wx, wy, 2, 2);
      }
    }
    x += w + azar.rango(0, 10);
  }
  return texturaDe(c, true);
}

// ------------------------------------------------------------------ la escena
function crearEscena(mapa, opciones = {}) {
  const calidad = opciones.calidad ?? 1;
  const escena = new THREE.Scene();
  escena.background = new THREE.Color(COLOR_NOCHE);
  escena.fog = new THREE.Fog(COLOR_NOCHE, 70, calidad < 1 ? 330 : 430);
  escena.add(new THREE.HemisphereLight('#6D7FAF', '#1A1410', 0.55));
  const luna = new THREE.DirectionalLight('#9FB2FF', 0.35);
  luna.position.set(-0.4, 1, 0.3);
  escena.add(luna);

  const mat = {
    hormigon: new THREE.MeshLambertMaterial({ color: '#5A5D63' }),
    cuerpo: new THREE.MeshLambertMaterial({ vertexColors: true }),
    luces: new THREE.MeshBasicMaterial({ vertexColors: true }),
  };

  // Suelo lejano y el barrio.
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), new THREE.MeshLambertMaterial({ color: '#0C1015' }));
  suelo.rotation.x = -Math.PI / 2;
  suelo.position.y = -0.06;
  escena.add(suelo);
  const barrio = new THREE.Mesh(new THREE.PlaneGeometry(470, 470), new THREE.MeshLambertMaterial({ map: texturaBarrio(calidad < 1 ? 1024 : 2048) }));
  barrio.rotation.x = -Math.PI / 2;
  escena.add(barrio);

  // La Ronda: una tira con las dos calzadas y la mediana, que sube en la rasante.
  const puntos = [], normales = [];
  for (let s = 0; s <= LARGO_RONDA + 0.01; s += 5) {
    const p = rondaPunto(s, 0);
    puntos.push({ x: p.x, y: p.y, h: alturaRonda(s) });
    normales.push({ x: p.nx, y: p.ny });
  }
  // La pintura de las marcas brilla un poco sola, como la pintura reflectante de noche: son las que dan la velocidad.
  const texRonda = texturaRonda();
  const ronda = new THREE.Mesh(tira(puntos, normales, -15, 15, 24, 0.03), new THREE.MeshLambertMaterial({ map: texRonda, emissive: '#FFFFFF', emissiveMap: texRonda, emissiveIntensity: 0.3 }));
  escena.add(ronda);
  // Mediana: dos caras y el lomo.
  const med = new THREE.Group();
  const matMediana = new THREE.MeshLambertMaterial({ color: '#5A5D63', side: THREE.DoubleSide });
  med.add(new THREE.Mesh(pared(puntos, normales, -0.5, 0, 1, 10), matMediana));
  med.add(new THREE.Mesh(pared(puntos, normales, 0.5, 0, 1, 10), matMediana));
  med.add(new THREE.Mesh(tira(puntos, normales, -0.5, 0.5, 10, 1.0), matMediana));
  escena.add(med);
  // Pantallas acústicas: del lado del barrio (con huecos en las salidas abiertas) y del lado de fuera.
  const matPantalla = new THREE.MeshLambertMaterial({ map: texturaPantalla(), side: THREE.DoubleSide });
  const geoPant = [];
  const pantallasExt = pared(puntos, normales, 14.8, 0, 4.6, 4);
  geoPant.push(pantallasExt);
  // Las del barrio salen de los segmentos que usa la línea de visión: lo que se ve es lo que tapa.
  {
    const pos = [], uv = [], idx = [];
    let k = 0, acum = 0;
    for (const s of mapa.pantallas) {
      const ha = alturaEn(s.ax, s.ay), hb = alturaEn(s.bx, s.by);
      const largo = Math.hypot(s.bx - s.ax, s.by - s.ay);
      pos.push(s.ax, -0.05, -s.ay, s.ax, ha + 4.6, -s.ay, s.bx, -0.05, -s.by, s.bx, hb + 4.6, -s.by);
      uv.push(acum / 4, 0, acum / 4, 1, (acum + largo) / 4, 0, (acum + largo) / 4, 1);
      acum += largo;
      idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
      k += 4;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    geoPant.push(g);
  }
  for (const g of geoPant) escena.add(new THREE.Mesh(g, matPantalla));

  // Rampas y muros bajos (rampas, borde del barrio).
  const matRampa = new THREE.MeshLambertMaterial({ color: '#1A1C21' });
  if (mapa.rampasAbiertas) {
    for (const r of RAMPAS) {
      const pts = [], nor = [];
      for (let k = 0; k <= 18; k++) {
        const a = r.a0 + ((r.a1 - r.a0) * k) / 18;
        pts.push({ x: r.cx + RAMPA_R * Math.cos(a), y: r.cy + RAMPA_R * Math.sin(a), h: 0 });
        nor.push({ x: Math.cos(a), y: Math.sin(a) });
      }
      escena.add(new THREE.Mesh(tira(pts, nor, -RAMPA_MEDIO - 0.3, RAMPA_MEDIO + 0.3, 24, 0.025), matRampa));
    }
  }
  {
    const pos = [], idx = [];
    let k = 0;
    for (const m of mapa.muros) {
      if (m.tipo !== 'rampa' && m.tipo !== 'borde') continue;
      pos.push(m.ax, 0, -m.ay, m.ax, m.alto, -m.ay, m.bx, 0, -m.by, m.bx, m.alto, -m.by);
      idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
      k += 4;
    }
    for (const b of mapa.cajas) {
      if (b.tipo !== 'tapia') continue;
      const alto = 1.3;
      for (const [ax, ay, bx, by] of [[b.x0, b.y0, b.x1, b.y0], [b.x1, b.y0, b.x1, b.y1], [b.x1, b.y1, b.x0, b.y1], [b.x0, b.y1, b.x0, b.y0]]) {
        pos.push(ax, 0, -ay, ax, alto, -ay, bx, 0, -by, bx, alto, -by);
        idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
        k += 4;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    escena.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: '#6B6E74', side: THREE.DoubleSide })));
  }

  // Edificios: una sola geometría; ventanas de una textura (las encendidas brillan solas).
  const vent = texturaVentanas();
  {
    const pos = [], nor = [], uv = [], col = [], idx = [];
    const c = new THREE.Color();
    let k = 0;
    const azar = crearAzar(4242);
    const cara = (p0, p1, alto, nx, nz, ox, oy, sinVentanas) => {
      const largo = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      pos.push(p0[0], 0, -p0[1], p1[0], 0, -p1[1], p1[0], alto, -p1[1], p0[0], alto, -p0[1]);
      for (let i = 0; i < 4; i++) nor.push(nx, 0, nz);
      if (sinVentanas) uv.push(0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01);
      else {
        const u0 = ox, u1 = ox + largo / 24, v0 = oy, v1 = oy + alto / 25.6;
        uv.push(u0, v0, u1, v0, u1, v1, u0, v1);
      }
      for (let i = 0; i < 4; i++) col.push(c.r, c.g, c.b);
      idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
      k += 4;
    };
    for (const e of mapa.edificios) {
      c.set(e.color || '#303440');
      const sin = !!e.tunel;
      const ox = azar.rango(0, 1), oy = azar.rango(0, 1);
      cara([e.x0, e.y0], [e.x1, e.y0], e.alto, 0, 1, ox, oy, sin);          // sur (normal hacia -y del mundo = +z)
      cara([e.x1, e.y1], [e.x0, e.y1], e.alto, 0, -1, ox + 0.3, oy, sin);   // norte
      cara([e.x1, e.y0], [e.x1, e.y1], e.alto, 1, 0, ox + 0.6, oy, sin);    // este
      cara([e.x0, e.y1], [e.x0, e.y0], e.alto, -1, 0, ox + 0.9, oy, sin);   // oeste
      // Tejado, algo más oscuro.
      c.multiplyScalar(0.6);
      pos.push(e.x0, e.alto, -e.y0, e.x1, e.alto, -e.y0, e.x1, e.alto, -e.y1, e.x0, e.alto, -e.y1);
      for (let i = 0; i < 4; i++) { nor.push(0, 1, 0); uv.push(0.01, 0.01); col.push(c.r, c.g, c.b); }
      idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
      k += 4;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    const m = new THREE.MeshLambertMaterial({ map: vent.mapa, emissiveMap: vent.brillo, emissive: new THREE.Color('#FFFFFF'), vertexColors: true, side: THREE.DoubleSide });
    escena.add(new THREE.Mesh(g, m));
  }

  // Túnel: techo y luces en el techo que pasan como un estroboscopio.
  const techo = new THREE.Mesh(new THREE.BoxGeometry(TUNEL.x1 - TUNEL.x0 + 0.8, 0.8, TUNEL.y1 - TUNEL.y0), mat.hormigon);
  techo.position.set(0, 6.0, -(TUNEL.y0 + TUNEL.y1) / 2);
  escena.add(techo);

  // Farolas: postes, cabezas encendidas y manchas de luz en el suelo (tres llamadas de dibujo en total).
  const farolas = mapa.farolas;
  const cabezas = [];
  for (const f of farolas) {
    if (f.tipo === 'mediana') {
      const p = rondaPunto(f.s, 0), hr = alturaRonda(f.s);
      for (const d of [-4.5, 4.5]) cabezas.push({ x: p.x + p.nx * d, y: p.y + p.ny * d, h: hr + f.h, pool: [p.x + p.nx * d * 1.5, p.y + p.ny * d * 1.5, hr], color: 'blanca' });
    } else if (f.tipo === 'tunel') cabezas.push({ x: f.x, y: f.y, h: f.h, pool: [f.x, f.y, 0], color: 'tunel' });
    else cabezas.push({ x: f.x, y: f.y, h: f.h, pool: [f.x, f.y, 0], color: f.tipo === 'parking' ? 'blanca' : 'sodio' });
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), esc = new THREE.Vector3();
  {
    const postes = farolas.filter((f) => f.tipo !== 'tunel');
    const geo = new THREE.BoxGeometry(0.16, 1, 0.16);
    geo.translate(0, 0.5, 0);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: '#3B3F46' }), postes.length);
    postes.forEach((f, i) => {
      const h = f.tipo === 'mediana' ? alturaRonda(f.s) : 0;
      m4.compose(v3.set(f.x, h, -f.y), q.identity(), esc.set(1, f.h, 1));
      im.setMatrixAt(i, m4);
    });
    im.frustumCulled = false;
    escena.add(im);
  }
  {
    const geo = new THREE.BoxGeometry(0.7, 0.14, 0.4);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: '#FFFFFF' }), cabezas.length);
    const col = new THREE.Color();
    cabezas.forEach((cb, i) => {
      m4.compose(v3.set(cb.x, cb.h, -cb.y), q.identity(), esc.set(cb.color === 'tunel' ? 2.2 : 1, 1, 1));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(cb.color === 'sodio' ? '#FFB561' : cb.color === 'tunel' ? '#FFE9C2' : '#E4EEFF'));
    });
    im.frustumCulled = false;
    escena.add(im);
  }
  const conManchas = calidad >= 1;
  if (conManchas) {
    const geo = new THREE.PlaneGeometry(1, 1);
    geo.rotateX(-Math.PI / 2);
    const matMancha = new THREE.MeshBasicMaterial({ map: texturaMancha('#FFFFFF'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: true });
    const im = new THREE.InstancedMesh(geo, matMancha, cabezas.length);
    const col = new THREE.Color();
    cabezas.forEach((cb, i) => {
      const r = cb.color === 'tunel' ? 7 : cb.color === 'blanca' ? 13 : 12;
      m4.compose(v3.set(cb.pool[0], cb.pool[2] + 0.06, -cb.pool[1]), q.identity(), esc.set(r, 1, r));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(cb.color === 'sodio' ? '#5A3A14' : cb.color === 'tunel' ? '#4A3E2A' : '#2A3448'));
    });
    im.frustumCulled = false;
    escena.add(im);
  }

  // Glorieta: isleta con un monumento que se ve desde lejos.
  const isleta = new THREE.Mesh(new THREE.CylinderGeometry(GLORIETA.r, GLORIETA.r, 0.4, 24), new THREE.MeshLambertMaterial({ color: '#23402A' }));
  isleta.position.y = 0.2;
  escena.add(isleta);
  const obelisco = new THREE.Mesh(new THREE.BoxGeometry(1.4, 12, 1.4), new THREE.MeshLambertMaterial({ color: '#8C8778', emissive: '#2A2418' }));
  obelisco.position.y = 6;
