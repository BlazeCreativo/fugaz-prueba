  }
  const J = impulso(f, otro.masa, t.masa);
  giroGolpe(t, k.ob, -k.nx * J, -k.ny * J);
}

// Daño de un vehículo del tráfico. Muy tocado, se para (suelto); al 1, arde y explota cuando se acaba la mecha.
// Si ya arde, un golpe más lo hace explotar al momento.
function daniarTrafico(p, t, cantidad, f) {
  if (t.quemado || !(cantidad > 0 || t.arde > 0)) return;
  if (t.arde > 0) {
    if (f >= DANIO_TRAFICO.rematar) t.arde = Math.min(t.arde, 1e-3);
    return;
  }
  t.danio = Math.min(1, t.danio + cantidad);
  if (t.danio >= DANIO_TRAFICO.averiado && soltar(t)) p.stats.sueltos++;
  if (t.danio >= 1) {
    t.arde = f >= DANIO_TRAFICO.brutal ? DANIO_TRAFICO.mechaCorta : DANIO_TRAFICO.mecha;
    emitir(p, 'fuego', { id: t.id, x: t.x, y: t.y, mecha: t.arde });
  }
}

// Daño de una patrulla (0-1). Al 1 queda fuera de combate al final de los choques de este paso.
function daniarPatrulla(u, cantidad, causa) {
  if (!(cantidad > 0) || u.caida) return;
  u.coche.danio = Math.min(1, u.coche.danio + cantidad);
  if (u.coche.danio >= 1) u.caida = causa;
}

function choquesAccidente(p, dt) {
  const tr = p.trafico, j = p.jugador;
  let fuerte = 0, fx = 0, fy = 0;
  for (const lista of [tr.ronda, tr.barrio]) {
    for (const t of lista) {
      if (!t.suelto) continue;
      if (!t.circulos) t.circulos = circulosDe(t.largo, t.ancho);
      const g = choquesMundo(p, t, dt);
      if (g > DANIO_TRAFICO.umbral) daniarTrafico(p, t, danioTrafico(g, Infinity, t.masa), g);
      for (const o of cercaDe(tr, t.x, t.y, 16)) {
        if (o === t || (o.suelto && o.id < t.id)) continue; // cada pareja de sueltos, una sola vez
        const k = contacto(t, o);
        if (!k) continue;
        const f = choqueEntre(t, o, k.nx, k.ny, k.pen);
        if (f <= 0) continue;
        golpearTrafico(p, o, t, k, f, 'trafico');
        giroGolpe(t, k.oa, k.nx * impulso(f, t.masa, o.masa), k.ny * impulso(f, t.masa, o.masa));
        if (f > DANIO_TRAFICO.umbral) daniarTrafico(p, t, danioTrafico(f, o.masa, t.masa), f);
        if (f > fuerte) { fuerte = f; fx = t.x; fy = t.y; }
      }
    }
  }
  // Los restos de las patrullas también se llevan por delante al tráfico.
  for (const r of p.restos) {
    choquesMundo(p, r.coche, dt);
    for (const t of cercaDe(tr, r.coche.x, r.coche.y, 16)) {
      const k = contacto(r.coche, t);
      if (!k) continue;
      const f = choqueEntre(r.coche, t, k.nx, k.ny, k.pen);
      if (f > 0) golpearTrafico(p, t, r.coche, k, f, 'restos');
    }
  }
  // El estruendo de un choque entre otros, para el sonido (como mucho uno cada 0,15 s).
  if (fuerte > 6 && p.t - p.estruendoT > 0.15) {
    p.estruendoT = p.t;
    emitir(p, 'estruendo', { x: fx, y: fy, fuerza: fuerte, dist: dist(fx, fy, j.x, j.y) });
  }
}

// Mechas, la grúa y los restos que ya quedan lejos.
function pasoAccidentes(p, dt) {
  const tr = p.trafico, j = p.jugador;
  for (const lista of [tr.ronda, tr.barrio]) {
    for (const t of lista) {
      if (!(t.arde > 0)) continue;
      t.arde -= dt;
      if (t.arde <= 0) explotar(p, t);
    }
  }
  p.gruaT -= dt;
  if (p.gruaT <= 0) {
    p.gruaT = 1;
    grua(tr, j.x, j.y, p.mapa);
    for (let i = p.restos.length - 1; i >= 0; i--) {
      const c = p.restos[i].coche;
      if (p.t - p.restos[i].t > 8 && dist(c.x, c.y, j.x, j.y) > TUMBAR.lejos) p.restos.splice(i, 1);
    }
  }
}

// Un coche en llamas explota: empuja lo que hay cerca, daña tu coche si estás al lado (De verdad), deja fuera de combate
// a las patrullas de al lado y prende a los coches tocados que haya cerca (explosiones en cadena, con su mecha).
function explotar(p, t) {
  const j = p.jugador, x = t.x, y = t.y;
  t.arde = 0;
  t.quemado = true;
  t.danio = 1;
  soltar(t);
  t.emergencia = false;
  p.stats.explosiones++;
  const empujar = (c, d) => {
    const dv = empuje(d, c.masa);
    if (dv < 0.05) return;
    const nx = d > 0.1 ? (c.x - x) / d : 0, ny = d > 0.1 ? (c.y - y) / d : 1;
    c.vx += nx * dv;
    c.vy += ny * dv;
  };
  const dj = dist(x, y, j.x, j.y);
  if (dj < EXPLOSION.radio) {
    empujar(j, dj);
    j.sacudida = Math.max(j.sacudida, 0.6 * alcance(dj, EXPLOSION.radio));
  }
  if (dj < EXPLOSION.radioJugador) daniar(p, EXPLOSION.jugador * alcance(dj, EXPLOSION.radioJugador), 'explosion');
  for (const u of p.policia) {
    const d = dist(x, y, u.coche.x, u.coche.y);
    if (d < EXPLOSION.radio) empujar(u.coche, d);
    if (d < EXPLOSION.patrulla) daniarPatrulla(u, 1, 'explosion');
  }
  for (const r of p.restos) {
    const d = dist(x, y, r.coche.x, r.coche.y);
    if (d < EXPLOSION.radio) empujar(r.coche, d);
  }
  for (const o of cercaDe(p.trafico, x, y, EXPLOSION.radio)) {
    if (o === t) continue;
    const d = dist(x, y, o.x, o.y);
    if (d >= EXPLOSION.radio) continue;
    if (empuje(d, o.masa) > 1.5 && soltar(o)) p.stats.sueltos++;
    if (o.suelto) {
      empujar(o, d);
      o.w = (o.w || 0) + ((o.id % 2) * 2 - 1) * 1.5 * alcance(d, EXPLOSION.radio);
    }
    if (d < EXPLOSION.cadena) daniarTrafico(p, o, EXPLOSION.cadenaDanio * alcance(d, EXPLOSION.cadena), 0);
  }
  emitir(p, 'explosion', { x, y, id: t.id, fuerza: t.tipo === 'camion' ? 1.4 : 1, dist: dj, por: t.porUltimo || null });
  if (p.t - p.explosionT > 8) decir(p, 'explosion', { unidad: cercana(p), lugar: p.mapa.nombreLugar(x, y) });
  p.explosionT = p.t;
}

// Las patrullas que han caído en este paso: fuera de combate. Sus restos se quedan; te pagan, te dan medio nitro (el
// informe 13 cita el nitro lleno de Burnout y Hot Pursuit; aquí caen más a menudo, hasta 1-2 por minuto en el banco con
// un piloto que choca mucho) y a los 15 s llega otra, así que la persecución no se acaba sola.
function caerPatrullas(p) {
  for (let i = p.policia.length - 1; i >= 0; i--) {
    const u = p.policia[i];
    if (!u.caida) continue;
    p.policia.splice(i, 1);
    const c = u.coche;
    u.sirena = c.sirena = false;
    u.emb = u.pit = null;
    u.ve = false;
    c.motor = false;
    c.trompo = Math.max(c.trompo, 1.2);
    if (Math.abs(c.w) < 1) c.w = (u.numero % 2 ? 1 : -1) * 2;
    p.restos.push({ id: u.id, tipo: u.tipo, nombre: u.nombre, coche: c, t: p.t, causa: u.caida });
    const gana = premio(p.botin, Math.round(TUMBAR.premio * p.botin.mult));
    p.jugador.nitro = Math.min(1, p.jugador.nitro + 0.5);
    p.stats.tumbadas++;
    if (u.rol !== 'control') p.programa.push({ t: p.t + TUMBAR.relevo, tipo: 'relevo', modelo: u.tipo, rol: u.rol });
    emitir(p, 'fueraDeCombate', { unidad: u.id, nombre: u.nombre, causa: u.caida, gana, x: c.x, y: c.y });
    decir(p, 'fueraCombate', { unidad: u.nombre }, true);
  }
}

// ------------------------------------------------------------------ el paso
// entrada: { dir, gas, freno, mano, nitro, nitroToque, motorToque, arrancar }
function pasoPartida(p, entrada = {}, dt = DT) {
  if (p.final) return;
  p.t += dt;
  p.pasos++;
  const j = p.jugador, mapa = p.mapa, tr = p.trafico;
  grabar(p, entrada);
  entrada = cuantizar(entrada);

  // 1. Tu coche.
  if (entrada.motorToque) {
    if (j.motor && Math.abs(j.vf) < 3) { j.motor = false; emitir(p, 'apagar'); }
    else if (!j.motor) { j.motor = true; emitir(p, 'arranque'); }
  } else if (entrada.arrancar && !j.motor) {
    j.motor = true;
    emitir(p, 'arranque');
  }
  const e = {
    dir: clamp(entrada.dir || 0, -1, 1), gas: clamp(entrada.gas || 0, 0, 1), freno: clamp(entrada.freno || 0, 0, 1),
    mano: !!entrada.mano, nitro: !!entrada.nitro, nitroToque: !!entrada.nitroToque,
  };
  p.crucero = entrada.crucero > 0 ? entrada.crucero : 0;
  asistir(p.ayuda, j, p.zona, entrada, e, dt);
  // Motor tocado (80 % de daño o más): se ahoga un cuarto de segundo cada 3 s.
  if (j.danio >= DANIO.fuego && p.t % DANIO.falloCada < DANIO.falloDura) e.gas *= 0.15;
  for (const ev of pasoCoche(j, e, dt, p.asistencia)) {
    emitir(p, ev.tipo, ev);
    if (ev.tipo === 'salidaPerfecta') decir(p, 'salidaPerfecta');
    if (ev.tipo === 'tirachinas' && p.rebufoGap < 6) {
      // Saliste del rebufo en el último metro: quien venga pegado detrás se queda 3 s sin verte.
      for (const u of p.policia) {
        const dx = u.coche.x - j.x, dy = u.coche.y - j.y;
        const lon = dx * Math.sin(j.h) + dy * Math.cos(j.h);
        if (lon < 0 && lon > -45) { u.ciego = 3; u.ve = false; }
      }
    }
  }

  p.respiro = Math.max(0, p.respiro - dt);
  // Pinchazo: 12 s cojeando y después la rueda de emergencia (informe 11: pinchado toda la huida ibas más lento que el Lince).
  if (j.pinchado && j.pinchadoT > 0) {
    j.pinchadoT -= dt;
    if (j.pinchadoT <= 0) {
      j.pinchado = false;
      daniar(p, 0.08, 'rueda');
      emitir(p, 'ruedaEmergencia', { danio: j.danio });
    }
  }

  // Cuanto más dura la huida, más tráfico en la Ronda (idea de Alberto, 25/09).
  if (p.traficoNivel < 4 && p.t >= TRAFICO_T[p.traficoNivel + 1]) subirNivelTrafico(p);

  // 2. Tráfico y policía.
  const cuerpos = [j];
  for (const u of p.policia) { u.coche.sirena = u.sirena; cuerpos.push(u.coche); }
  for (const r of p.restos) cuerpos.push(r.coche);
  pasoTrafico(tr, dt, cuerpos, mapa, p.azar.trafico);
  // Las patrullas fuera de combate se deslizan hasta pararse (el trompo lo hace coche.js) y estorban a todos.
  for (const r of p.restos) pasoCoche(r.coche, { gas: 0, freno: 0.7, dir: 0 }, dt);
  const ctx = { jugador: j, mapa, ojo: p.ojo, zonaJugador: p.zona, azar: p.azar.policia, pinchos: p.pinchos, otros: [], orden: 0 };
  p.policia.forEach((u, i) => {
    ctx.otros = cercaDe(tr, u.coche.x, u.coche.y, 60);
    for (const o of p.policia) if (o !== u) ctx.otros.push(o.coche);
    for (const r of p.restos) ctx.otros.push(r.coche);
    ctx.orden = i;
    ctx.ataqueOcupado = p.policia.some((o) => o !== u && (o.emb || o.pit));
    ctx.respiro = p.respiro;
    ctx.pitsAvisados = p.pitsAvisados;
    for (const ev of pasoUnidad(u, ctx, dt)) {
      if (ev.tipo === 'embisteFallo' && ev.esquivada) {
        ev.gana = premio(p.botin, Math.round(50 * p.botin.mult));
        p.stats.embestidasEsquivadas++;
        decir(p, 'embisteFallo', { unidad: u.nombre });
      }
      if (ev.tipo === 'embisteAviso') decir(p, 'embisteAviso', { unidad: u.nombre });
      if (ev.tipo === 'pitAviso') p.pitsAvisados++;
      if (ev.tipo === 'pitFallo' && ev.esquivada) ev.gana = premio(p.botin, Math.round(60 * p.botin.mult));
      emitir(p, ev.tipo, ev);
      if (ev.tipo === 'pitAviso') decir(p, 'pit', { unidad: u.nombre });
      if (ev.tipo === 'pitFallo') decir(p, 'pitFallo', { unidad: u.nombre });
    }
  });

  // 3. Choques.
  const golpeMuro = choquesMundo(p, j, dt);
  if (golpeMuro > 3) { emitir(p, 'golpe', { fuerza: golpeMuro, con: 'muro', ...(j.tocaEn || {}) }); p.stats.choques++; }
  if (golpeMuro > DANIO.umbral) daniar(p, danioGolpe(golpeMuro, Infinity, j.masa), 'muro');
  for (const u of p.policia) {
    const g = choquesMundo(p, u.coche, dt);
    if (g > TUMBAR.umbral) daniarPatrulla(u, danioPatrulla(g, Infinity, u.coche.masa), 'muro');
  }
  const cercanos = cercaDe(tr, j.x, j.y, 16);
  for (const t of cercanos) {
    const k = contacto(j, t);
    if (!k) continue;
    const f = choqueEntre(j, t, k.nx, k.ny, k.pen);
    tocarCoche(j, t, k);
    golpearTrafico(p, t, j, k, f, 'jugador');
    if (f > DANIO.umbral) daniar(p, danioGolpe(f, t.masa, j.masa), t.quemado ? 'restos' : 'trafico');
    const seg = p.casi.get(t.id);
    if (seg) seg.tocado = true;
    if (f > 1.5) {
      romperCadena(p.botin);
      p.stats.choques++;
      emitir(p, 'golpe', { fuerza: f, con: 'trafico', ...j.tocaEn });
      if (f > 8 && p.ojo.estado === 'rojo') {
        p.riesgo += 0.18;
        decir(p, 'choque');
      }
    }
  }
  for (const u of p.policia) {
    const k = contacto(j, u.coche);
    if (k) {
      const f = choqueEntre(j, u.coche, k.nx, k.ny, k.pen);
      tocarCoche(j, u.coche, k);
      if (f > 1.5) emitir(p, 'golpe', { fuerza: f, con: 'policia', ...j.tocaEn });
      const embiste = u.emb && u.emb.fase === 'ataque';
      if (!embiste && f > DANIO.umbral) daniar(p, danioGolpe(f, u.coche.masa, j.masa), 'policia');
      if (embiste) {
        // Embestida: pierdes velocidad, el coche se abolla (menos potencia y agarre) y se rompe la cadena de rebases.
        // Después, 6 s de respiro sin otro ataque y +30 % de nitro de rabia (informe 11).
        const fuerza = EMBESTIDA_TIPO[u.tipo] || EMBESTIDA_TIPO.lince;
        j.vx *= 1 - fuerza.frena;
        j.vy *= 1 - fuerza.frena;
        daniar(p, fuerza.danio, 'embestida');
        j.sacudida = Math.max(j.sacudida, fuerza.sacudida);
        j.nitro = Math.min(1, j.nitro + 0.3);
        p.respiro = 6;
        u.coche.vx *= 0.9;
        u.coche.vy *= 0.9;
        romperCadena(p.botin);
        emitir(p, 'embestida', { unidad: u.id, lado: u.emb.lado, danio: j.danio });
        decir(p, 'embestida', { unidad: u.nombre });
        u.emb = null;
        u.embEnfriar = EMBESTIDA.enfriar;
        p.stats.embestidas++;
      }
      if (u.pit && u.pit.fase === 'ataque') {
        j.nitro = Math.min(1, j.nitro + 0.3);
        p.respiro = 8;
        j.trompo = 1.4;
        j.w = u.pit.lado * 3.8;
        j.derrape = false;
        u.pit = null;
        u.pitEnfriar = 10;
        p.stats.pits++;
        emitir(p, 'pit', { unidad: u.id });
        decir(p, 'pitHecho', { unidad: u.nombre });
      }
    }
    for (const t of cercaDe(tr, u.coche.x, u.coche.y, 16)) {
      const k2 = contacto(u.coche, t);
      if (!k2) continue;
      const f = choqueEntre(u.coche, t, k2.nx, k2.ny, k2.pen);
      golpearTrafico(p, t, u.coche, k2, f, 'policia');
      if (f > TUMBAR.umbral) daniarPatrulla(u, danioPatrulla(f, t.masa, u.coche.masa), t.suelto ? 'accidente' : 'trafico');
    }
    for (const r of p.restos) {
      const k3 = contacto(u.coche, r.coche);
      if (!k3) continue;
      const f = choqueEntre(u.coche, r.coche, k3.nx, k3.ny, k3.pen);
      if (f > TUMBAR.umbral) daniarPatrulla(u, danioPatrulla(f, r.coche.masa, u.coche.masa), 'restos');
    }
  }
  for (let a = 0; a < p.policia.length; a++) {
    for (let b = a + 1; b < p.policia.length; b++) {
      const ua = p.policia[a], ub = p.policia[b];
      const k = contacto(ua.coche, ub.coche);
      if (!k) continue;
      const f = choqueEntre(ua.coche, ub.coche, k.nx, k.ny, k.pen);
      if (f > TUMBAR.umbral) {
        daniarPatrulla(ua, danioPatrulla(f, ub.coche.masa, ua.coche.masa), 'patrulla');
        daniarPatrulla(ub, danioPatrulla(f, ua.coche.masa, ub.coche.masa), 'patrulla');
      }
    }
  }
  for (const r of p.restos) {
    const k = contacto(j, r.coche);
    if (!k) continue;
    const f = choqueEntre(j, r.coche, k.nx, k.ny, k.pen);
    if (f > 1.5) emitir(p, 'golpe', { fuerza: f, con: 'restos' });
    if (f > DANIO.umbral) daniar(p, danioGolpe(f, r.coche.masa, j.masa), 'restos');
  }
  // v7: los coches sueltos chocan con el decorado y entre sí (choques en cadena); las mechas encendidas explotan;
  // las patrullas que han caído pasan a restos.
  choquesAccidente(p, dt);
  pasoAccidentes(p, dt);
  caerPatrullas(p);

  // 4. Dónde estás.
  const zona = mapa.zonaEn(j.x, j.y);
  if (zona !== p.zona) cambioZona(p, p.zona, zona);
  p.zona = zona;
  const vJ = Math.abs(j.vf);
  p.stats.velMaxKmh = Math.max(p.stats.velMaxKmh, vJ * 3.6);

  // 5. Estilo: casi-choques, huecos, rebufo y derrape. Y el taller (v8).
  estilo(p, cercanos, dt);
  pasoTaller(p, dt);

  // 6. Te ven: línea de visión de cada unidad.
  deteccion(p, dt);

  // 7. Alerta, pinchos, riesgo y detención.
  escalar(p, dt);
  pasoPinchos(p, dt);
  riesgo(p, dt);
  if (!p.final) detencion(p, dt);

  // 8. Botín y radio.
  if (!p.final) {
    pasoBotin(p.botin, dt, p.ojo.estado, p.nivel);
    pasoRadio(p, dt);
  }
}

// La cinta guarda las entradas redondeadas (centésimas; el crucero, décimas), y la partida se simula con esas mismas:
// así la semilla y la cinta repiten la partida exacta. Antes se simulaba con las exactas y la repetición se desviaba
// (informe 14: es la base de «Te reto», la fuga del día y los fantasmas).
function cuantizar(en = {}) {
  return {
    dir: Math.round((en.dir || 0) * 100) / 100, gas: Math.round((en.gas || 0) * 100) / 100, freno: Math.round((en.freno || 0) * 100) / 100,
    mano: !!en.mano, nitro: !!en.nitro, nitroToque: !!en.nitroToque, motorToque: !!en.motorToque, arrancar: !!en.arrancar,
    trazada: !!en.trazada, frenadaAuto: !!en.frenadaAuto, crucero: Math.round((en.crucero || 0) * 10) / 10,
  };
}

// La entrada de un paso a partir de una línea de la cinta (la inversa de grabar).
function entradaDeCinta(k) {
  const [dir, gas, freno, bits, crucero] = k.split(',');
  const b = (i) => bits[i] === '1';
  return {
    dir: Number(dir) / 100, gas: Number(gas) / 100, freno: Number(freno) / 100,
    mano: b(0), nitro: b(1), nitroToque: b(2), motorToque: b(3), arrancar: b(4), trazada: b(5), frenadaAuto: b(6),
    crucero: Number(crucero || 0) / 10,
  };
}

function grabar(p, en) {
  // La cinta: la semilla más las entradas bastan para repetir la partida (repeticiones, clips, Sombras).
  const k = `${Math.round((en.dir || 0) * 100)},${Math.round((en.gas || 0) * 100)},${Math.round((en.freno || 0) * 100)},${en.mano ? 1 : 0}${en.nitro ? 1 : 0}${en.nitroToque ? 1 : 0}${en.motorToque ? 1 : 0}${en.arrancar ? 1 : 0}${en.trazada ? 1 : 0}${en.frenadaAuto ? 1 : 0},${Math.round((en.crucero || 0) * 10)}`;
  if (k !== p.ultimaEntrada && p.cinta.length < 60000) {
    p.cinta.push([p.pasos, k]);
    p.ultimaEntrada = k;
  }
}

// Segundos de huida para subir el tráfico a los niveles 2, 3 y 4. Lejos de los Lobos (35 s) y del Toro (80 s), que llegan
// con el Ojo en rojo: dos sustos a la vez no se leen (informe 10, 25/09).
const TRAFICO_T = [0, 0, 25, 60, 110];
const premioTrafico = (nivel) => 1 + 0.25 * (nivel - 1); // cada rebase vale más cuanto más tráfico

function subirNivelTrafico(p) {
  const nivel = p.traficoNivel + 1;
  const nuevos = subirTrafico(p.trafico, nivel, [p.jugador], p.azar.reserva);
  p.traficoNivel = nivel;
  p.stats.traficoMax = nivel;
  emitir(p, 'trafico', { nivel, nuevos, premio: premioTrafico(nivel) });
  decir(p, 'trafico' + nivel);
}

function cambioZona(p, de, a) {
  emitir(p, 'zona', { de, a });
  if (a === 'tunel') emitir(p, 'tunelEntra');
  if (de === 'tunel') emitir(p, 'tunelSale');
  if (p.ojo.estado !== 'rojo') return;
  const unidad = cercana(p);
  if (a === 'tunel') decir(p, 'tunel', { unidad });
  else if (a === 'parking') decir(p, 'parking', { unidad });
  else if (a === 'callejon') decir(p, 'callejon', { unidad });
  else if (de === 'ronda' && a === 'rampa') decir(p, 'salidaRonda', { unidad });
}

function cercana(p) {
  let mejor = p.policia[0], md = Infinity;
  for (const u of p.policia) if (u.distJugador < md) { md = u.distJugador; mejor = u; }
  return mejor ? mejor.nombre : 'CENTRAL';
}

function estilo(p, cercanos, dt) {
  const j = p.jugador, b = p.botin;
  const vJ = Math.abs(j.vf);
  // Casi-choques: se sigue cada vehículo mientras vas a su altura; al dejarlo atrás sin tocarlo, se puntúa.
  const vistos = new Set();
  for (const t of cercanos) {
    vistos.add(t.id);
    const fx = Math.sin(t.h), fy = Math.cos(t.h), rx = Math.cos(t.h), ry = -Math.sin(t.h);
    const dx = j.x - t.x, dy = j.y - t.y;
    const lon = dx * fx + dy * fy, lat = dx * rx + dy * ry;
    const solape = Math.abs(lon) < (t.largo + j.largo) / 2 + 0.4;
    const gap = Math.abs(lat) - (t.ancho + j.ancho) / 2;
    let seg = p.casi.get(t.id);
    if (solape && gap < 1.6) {
      if (!seg) { seg = { min: gap, lat, vRel: 0, tocado: false }; p.casi.set(t.id, seg); }
      if (gap < seg.min) { seg.min = gap; seg.lat = lat; }
      seg.vRel = Math.max(seg.vRel, Math.abs(j.vx * fx + j.vy * fy - (t.vx * fx + t.vy * fy)));
    } else if (seg) {
      terminarCasi(p, seg, vJ);
      p.casi.delete(t.id);
    }
  }
  for (const [id, seg] of p.casi) {
    if (!vistos.has(id)) { terminarCasi(p, seg, vJ); p.casi.delete(id); }
  }

  // Rebufo: detrás de un camión, en su estela, a más de 80 km/h.
  let reb = 0, gapReb = Infinity;
  if (p.zona === 'ronda' && vJ > 22) {
    for (const t of p.trafico.ronda) {
      if (t.tipo !== 'camion') continue;
      const fx = Math.sin(t.h), fy = Math.cos(t.h);
      const dx = j.x - t.x, dy = j.y - t.y;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) continue;
      const lon = dx * fx + dy * fy, lat = dx * Math.cos(t.h) - dy * Math.sin(t.h);
      const g = -lon - (t.largo + j.largo) / 2;
      if (g >= 0 && g <= 20 && Math.abs(lat) < 1.2) {
        const r = 1 - (0.5 * g) / 20;
        if (r > reb) { reb = r; gapReb = g; }
      }
    }
  }
  j.rebufo = reb;
  if (reb > 0) p.rebufoGap = gapReb;
  else if (j.tirachinas <= 0) p.rebufoGap = Infinity;
  if ((reb > 0.5) !== p.rebufoOn) {
    p.rebufoOn = reb > 0.5;
    emitir(p, 'rebufo', { on: p.rebufoOn });
  }
  // Los Lobo también cogen rebufo: detrás de camiones y detrás de ti.
  for (const u of p.policia) {
    const c = u.coche;
    let r = 0;
    const fuentes = [j, ...p.trafico.ronda.filter((t) => t.tipo === 'camion')];
    for (const f of fuentes) {
      const fx = Math.sin(f.h), fy = Math.cos(f.h);
      const dx = c.x - f.x, dy = c.y - f.y;
      if (Math.abs(dx) > 40 || Math.abs(dy) > 40) continue;
      const lon = dx * fx + dy * fy, lat = dx * Math.cos(f.h) - dy * Math.sin(f.h);
      const g = -lon - (f.largo + c.largo) / 2;
      const alcance = f === j ? 12 : 20;
      if (g >= 0 && g <= alcance && Math.abs(lat) < 1.2 && Math.abs(c.vf) > 22) r = Math.max(r, 1 - (0.5 * g) / alcance);
    }
    c.rebufo = r;
  }

  // Derrape: se paga mientras dura (el doble en la glorieta). En sentido contrario, nada puntúa.
  if (j.derrape && vJ > 8) {
    p.stats.derrapeSeg += dt;
    if (!p.contra) derrape(b, dt, p.zona === 'glorieta');
  }
}

function terminarCasi(p, seg, vJ) {
  if (seg.tocado || seg.min >= 1.1 || seg.vRel < 5 || vJ < 15 || p.contra) return;
  const fuerza = clamp(1 - seg.min / 1.1, 0, 1);
  const lado = seg.lat > 0 ? 'izquierda' : 'derecha'; // lado del coche rebasado, visto desde ti
  const gana = casiChoque(p.botin, fuerza, premioTrafico(p.traficoNivel));
  p.jugador.nitro = Math.min(1, p.jugador.nitro + 0.05);
  p.stats.casiChoques++;
  emitir(p, 'casiChoque', { lado, fuerza, gana, cadena: p.botin.cadena, mult: p.botin.mult });
  // HUECO: dos casi-choques por lados opuestos en 0,4 s, con menos de medio metro en cada uno.
  const u = p.ultimoCasi;
  if (u && p.t - u.t < 0.4 && u.lado !== lado && u.min < 0.55 && seg.min < 0.55) {
    const g = hueco(p.botin, premioTrafico(p.traficoNivel));
    p.jugador.nitro = Math.min(1, p.jugador.nitro + 0.12);
    p.stats.huecos++;
    emitir(p, 'hueco', { gana: g });
    decir(p, 'hueco', { unidad: cercana(p) });
    p.ultimoCasi = null;
  } else p.ultimoCasi = { t: p.t, lado, min: seg.min };
}

// ------------------------------------------------------------------ el Ojo
function alcanceDeteccion(p) {
  const j = p.jugador;
  const z = p.zona;
  const base = z === 'ronda' || z === 'rondaExterior' || z === 'rampa' ? ALCANCE.ronda : ALCANCE.barrio;
  const parado = Math.abs(j.vf) < 0.5;
  let r;
  if (!j.motor && parado) {
    r = 5 + 35 * j.calor;
    if (z === 'parking') r *= 0.6;
    else if (z === 'tunel' || z === 'callejon') r *= 0.8;
  } else if (parado) r = base * 0.75;
  else r = base;
  if (p.fuga120) r *= 0.5;
  return r * j.m.visibilidad; // v8: el Pulga se ve de más cerca; el Cóndor, de más lejos
}

function deteccion(p, dt) {
  const j = p.jugador, mapa = p.mapa;
  // Fuga a 120: con el Ojo en ámbar, en la Ronda, entre el tráfico y a 115-123 km/h.
  const kmh = Math.abs(j.vf) * 3.6;
  let vecinos = 0;
  if (p.ojo.estado === 'ambar' && p.zona === 'ronda' && kmh >= 115 && kmh <= 123) {
    for (const t of p.trafico.ronda) if (Math.abs(t.x - j.x) < 45 && Math.abs(t.y - j.y) < 45) vecinos++;
  }
  p.fuga120 = vecinos >= 2;
  if (p.fuga120) {
    p.fuga120T += dt;
    if (p.fuga120T > 2 && p.fuga120T - dt <= 2) decir(p, 'fuga120', { unidad: cercana(p) });
  } else p.fuga120T = 0;
  if (!j.motor && Math.abs(j.vf) < 0.5) p.stats.escondidoSeg += dt;

  const alcance = alcanceDeteccion(p);
  let cam = null;
  let visto = false, distMin = Infinity, quien = null;
  p.policia.forEach((u, i) => {
    const c = u.coche;
    const d = dist(c.x, c.y, j.x, j.y);
    let r = alcance;
    const ang = Math.abs(Math.atan2(Math.sin(rumbo(j.x - c.x, j.y - c.y) - c.h), Math.cos(rumbo(j.x - c.x, j.y - c.y) - c.h)));
    if (ang > 1.9) r *= 0.55;
    let ve = false;
    if (u.ciego <= 0 && d <= r) {
      // La línea de visión se recalcula 15 veces por segundo por unidad (escalonadas).
      if ((p.pasos + i) % 4 === 0 || u.los === undefined) {
        if (!cam) cam = { camiones: camiones(p.trafico) };
        u.los = mapa.visible(c.x, c.y, j.x, j.y, cam);
      }
      ve = u.los;
    } else u.los = undefined;
    // Para volver a verte cuando ya te buscan hace falta mantener la vista 0,3 s (v8: el Pulga, 0,6 s; el Cóndor, 0,2 s).
    if (ve) u.veT += dt;
    else u.veT = 0;
    u.ve = ve && (p.ojo.estado === 'rojo' || u.veT >= j.m.fijar);
    if (u.ve) {
      visto = true;
      if (d < distMin) { distMin = d; quien = u; }
    }
  });
  const antes = p.ojo.estado;
  for (const ev of pasoOjo(p.ojo, visto, j, p.nivel, dt, p.t, distMin)) {
    if (ev === 'visto') {
      p.stats.vecesVisto++;
      emitir(p, 'ojo', { estado: 'rojo', antes });
      decir(p, 'visto', { unidad: quien ? quien.nombre : 'CENTRAL' });
    } else if (ev === 'perdido') {
      emitir(p, 'ojo', { estado: 'ambar', antes });
      const u = p.policia.reduce((a, b) => (b.distJugador < a.distJugador ? b : a), p.policia[0]);
      const lugar = mapa.nombreLugar(p.ojo.ultima.x, p.ojo.ultima.y);
      const trasCamion = u && camionEntre(p, u.coche, j);
      decir(p, trasCamion ? 'relevo' : enRasante(p) ? 'rasante' : 'perdido', { unidad: u ? u.nombre : 'CENTRAL', lugar });
      interceptar(p);
    } else if (ev === 'libre') {
      emitir(p, 'ojo', { estado: 'cerrado', antes });
      terminar(p, finalDeEscape(p.ojo));
    }
  }
}

// v8 (Alberto, 25/09: «se escapa fácilmente… no viene un refuerzo más rápido, más potente»): la primera vez que te
// pierden, Central manda un Lobo a cortarte el paso, si aún no hay ninguno. Una vez por huida.
function interceptar(p) {
  if (p.interceptor || p.t < 8 || p.final || p.policia.some((u) => u.tipo === 'lobo')) return;
  p.interceptor = true;
  const u = aparecer(p, 'lobo', 1, 'cortar');
  emitir(p, 'interceptor', { id: u.id, nombre: u.nombre });
  decir(p, 'interceptor', { unidad: u.nombre, lugar: p.mapa.nombreLugar(p.ojo.ultima.x, p.ojo.ultima.y) });
}

function camionEntre(p, c, j) {
  for (const t of p.trafico.ronda) {
    if (t.tipo !== 'camion') continue;
    if (!p.mapa.visible(c.x, c.y, j.x, j.y, { camiones: [{ x: t.x, y: t.y, h: t.h, ml: t.largo / 2, ma: t.ancho / 2 }] })) return true;
  }
  return false;
}

function enRasante(p) {
  const j = p.jugador;
  return j.y < -255 && Math.abs(j.x) < 115;
}

// ------------------------------------------------------------------ alerta: niveles, refuerzos, controles y pinchos
// Número libre para una unidad nueva: nunca se repite el de una que ya salió (sus restos pueden seguir en la calle).
function siguienteNumero(p, tipo, desde = 1) {
  let n = desde;
  while (p.usados.has(`${tipo}${n}`)) n++;
  return n;
}

function aparecer(p, tipo, numero, rol) {
  const j = p.jugador;
  const cam = { camiones: camiones(p.trafico) };
  const a = puntoAparicion(p.mapa, j, p.azar.policia, p.zona, cam, rol);
  const u = crearUnidad(tipo, siguienteNumero(p, tipo, numero), a.x, a.y, a.h, a.v, rol, p.modelosPolicia[tipo]);
  p.usados.add(u.id);
  ponerMarcha(u.coche);
  p.policia.push(u);
  emitir(p, 'unidad', { id: u.id, nombre: u.nombre, modelo: tipo });
  return u;
}

// Al subir el nivel de alerta, todas las patrullas (también las que ya están) aprietan un poco más.
function mejorarPolicia(p) {
  p.modelosPolicia = modelosPolicia(p.reglas, p.nivel);
  for (const u of p.policia) u.coche.m = p.modelosPolicia[u.tipo];
}

function escalar(p, dt) {
  if (p.ojo.estado === 'rojo') p.tRojo += dt;
  // v8: el nivel también sube con lo que dura la huida, no solo con el tiempo a la vista: quien se escapa rápido
  // también acaba viendo los Lobos y el Toro (rango 1: nivel 2 al minuto y nivel 3 a los 2 minutos).
  if (p.nivel === 1 && (p.tRojo >= p.reglas.nivel2 || p.t >= p.reglas.nivel2 * 1.7)) {
    p.nivel = 2;
    mejorarPolicia(p);
    emitir(p, 'nivel', { nivel: 2 });
    decir(p, 'nivel2', {}, true);
    aparecer(p, 'lobo', 2, 'perseguir');
    aparecer(p, 'lobo', 5, 'cortar');
    if (p.reglas.loboExtra) aparecer(p, 'lobo', 7, 'perseguir'); // desde el rango 6
    if (p.mapa.rampasAbiertas) p.programa.push({ t: p.t + 6, tipo: 'controles' });
  } else if (p.nivel === 2 && (p.tRojo >= p.reglas.nivel3 || p.t >= p.reglas.nivel3 * 1.5)) {
    p.nivel = 3;
    mejorarPolicia(p);
    emitir(p, 'nivel', { nivel: 3 });
    decir(p, 'nivel3', {}, true);
    aparecer(p, 'toro', 1, 'cortar');
    p.pinchosT = 3;
  }
  p.stats.nivelMax = Math.max(p.stats.nivelMax, p.nivel);
  for (let i = p.programa.length - 1; i >= 0; i--) {
    const pr = p.programa[i];
    if (p.t < pr.t) continue;
    p.programa.splice(i, 1);
    if (pr.tipo === 'lince2') {
      const u = aparecer(p, 'lince', 2, 'cortar');
      decir(p, 'refuerzo', { unidad: u.nombre, lugar: p.mapa.nombreLugar(u.coche.x, u.coche.y) });
    } else if (pr.tipo === 'relevo') {
      // Llega otra patrulla en lugar de la que quedó fuera de combate.
      const u = aparecer(p, pr.modelo, 1, pr.rol);
      decir(p, 'refuerzo', { unidad: u.nombre, lugar: p.mapa.nombreLugar(u.coche.x, u.coche.y) });
    } else if (pr.tipo === 'controles') {
      // Clave 5: una patrulla cruzada al final de cada salida de la Ronda.
      for (const r of RAMPAS) {
        if (r.tipo !== 'salida') continue;
        const [bx, by] = r.barrio;
        const x = bx - Math.sign(bx) * 4;
        const u = crearUnidad('lince', siguienteNumero(p, 'lince', 3), x, by, 0, 0, 'control', p.modelosPolicia.lince);
        p.usados.add(u.id);
        p.policia.push(u);
        emitir(p, 'unidad', { id: u.id, nombre: u.nombre, modelo: 'lince', control: true });
      }
      decir(p, 'control', { salida: 'las dos salidas de la Ronda' });
    }
  }
}

function pasoPinchos(p, dt) {
  const j = p.jugador;
  if (p.pinchosT !== null && p.nivel >= 3) {
    p.pinchosT -= dt;
    if (p.pinchosT <= 0) {
      // Los pinchos los pone el Toro: si ha quedado fuera de combate, esperan a su relevo.
      if (p.zona === 'ronda' && p.policia.some((u) => u.tipo === 'toro')) {
        const pj = rondaProyectar(j.x, j.y);
        const s = normS(pj.s + Math.max(250, Math.abs(j.vf) * 7));
        const libre = p.azar.pinchos.entero(0, 2);
        const carriles = [0, 1, 2].filter((k) => k !== libre);
        const c = rondaPunto(s, CARRILES[1]);
        p.pinchos.push({ s, carriles, libre, aviso: 5, activos: false, vida: 25, pisado: false, pasado: false, x: c.x, y: c.y });
        emitir(p, 'pinchosAviso', { s, libre });
        decir(p, 'pinchosAviso', { unidad: 'TORO 1', lugar: p.mapa.nombreLugar(c.x, c.y) }, true);
        p.pinchosT = 22;
      } else p.pinchosT = 5;
    }
  }
  if (!p.pinchos.length) return;
  const pj = p.zona === 'ronda' ? rondaProyectar(j.x, j.y) : null;
  for (let i = p.pinchos.length - 1; i >= 0; i--) {
    const pz = p.pinchos[i];
    if (!pz.activos) {
      pz.aviso -= dt;
      if (pz.aviso <= 0) pz.activos = true;
      continue;
    }
    pz.vida -= dt;
    if (pz.vida <= 0) { p.pinchos.splice(i, 1); continue; }
    if (!pj) continue;
    const ds = difS(pj.s, pz.s);
    if (Math.abs(ds) < 1.2 && !pz.pisado && !j.pinchado) {
      for (const k of pz.carriles) {
        if (Math.abs(pj.d - CARRILES[k]) < 1.8 + j.ancho / 2) {
          pz.pisado = true;
          j.pinchado = true;
          j.pinchadoT = 12;
          p.stats.pinchazos++;
          emitir(p, 'pinchazo');
          decir(p, 'pinchosCaida', { unidad: 'TORO 1' });
          break;
        }
      }
    }
    if (ds > 1.5 && ds < 30 && !pz.pasado) {
      pz.pasado = true;
      if (!pz.pisado) decir(p, 'pinchosFallo', { unidad: 'TORO 1' });
    }
  }
  // Las unidades también revientan si los pisan.
  for (const u of p.policia) {
    const c = u.coche;
    if (c.pinchado || p.mapa.zonaEn(c.x, c.y) !== 'ronda') continue;
    const pu = rondaProyectar(c.x, c.y);
    for (const pz of p.pinchos) {
      if (!pz.activos || Math.abs(difS(pu.s, pz.s)) > 1.2) continue;
      if (pz.carriles.some((k) => Math.abs(pu.d - CARRILES[k]) < 1.8 + c.ancho / 2)) c.pinchado = true;
    }
  }
}

// Clave 9: la policía cancela si la persecución se vuelve un peligro (sentido contrario, choques con civiles).
function riesgo(p, dt) {
  const j = p.jugador;
  p.contra = false;
  if (p.zona === 'ronda' && Math.abs(j.vf) > 8) {
    const pj = rondaProyectar(j.x, j.y);
    const q = rondaPunto(pj.s, pj.d);
    const cos = (Math.sin(j.h) * q.tx + Math.cos(j.h) * q.ty) * Math.sign(j.vf);
    if (cos < -0.4) p.contra = true;
  }
  if (p.contra) {
    const antes = p.riesgo;
    p.riesgo += dt / 6;
    p.stats.contraSeg += dt;
    if (antes < 0.15 && p.riesgo >= 0.15) decir(p, 'sentido1', { unidad: cercana(p) }, true);
    if (antes < 0.6 && p.riesgo >= 0.6) decir(p, 'sentido2', {}, true);
  } else p.riesgo = Math.max(0, p.riesgo - 0.03 * dt);
  if (p.riesgo >= 1) terminar(p, 'CLAVE9');
}

function detencion(p, dt) {
  const j = p.jugador;
  const v = Math.hypot(j.vx, j.vy);
  let n = 0;
  for (const u of p.policia) if (u.distJugador < 8.5) n++;
  if (p.ojo.estado === 'rojo' && v < 2.2 && n > 0) p.detencion += (dt / 2.5) * (n >= 2 ? 1.6 : 1);
  else p.detencion = Math.max(0, p.detencion - dt * 0.8);
  if (p.detencion >= 1) terminar(p, 'DETENIDO');
}

function terminar(p, final) {
  if (p.final) return;
  const j = p.jugador;
  // Se cobra sobre el botín que ve el jugador (redondeado), para que la cuenta cuadre en pantalla.
  // v8: × el nivel de alerta si escapas y × tu rango (carrera.js).
  const botin = Math.round(p.botin.enJuego);
  const cuenta = desglose(final, botin, p.nivel, p.reglas.pago);
  p.final = {
    final,
    cobro: cuenta.total,
    botin,
    desglose: cuenta,
    rango: p.rango,
    coche: j.modelo,
    t: p.t,
    escondido: !j.motor && Math.abs(j.vf) < 0.5,
    quemado: p.ojo.vistoCerca > LIMITE_FANTASMA || final === 'DETENIDO' || final === 'SINIESTRO',
    modo: p.modo,
    danio: j.danio,
    causa: final === 'SINIESTRO' ? p.ultimaCausa : null, // qué dio el último golpe (informe 13: medirlo en la beta)
    lugar: p.mapa.nombreLugar(j.x, j.y),
    stats: { ...p.stats, duracion: p.t, vistoCerca: p.ojo.vistoCerca, vistoTotal: p.ojo.vistoTotal },
  };
  const unidad = cercana(p);
  if (final === 'FANTASMA') decir(p, 'fantasma', {}, true);
  else if (final === 'LIMPIO') decir(p, 'libre', { unidad }, true);
  else if (final === 'CLAVE9') decir(p, 'clave9', {}, true);
  else if (final === 'DETENIDO') decir(p, 'detenido', { unidad }, true);
  else if (final === 'SINIESTRO') decir(p, 'siniestro', { unidad }, true);
  for (const u of p.policia) u.sirena = final === 'DETENIDO' || final === 'SINIESTRO';
  emitir(p, 'final', { ...p.final });
}

  a5sb: { L: 4.76, A: 1.84, alto: 1.39, cab: [2.3, 0.2], rejilla: 'audi', escapes: 2 },

  m5: { L: 4.98, A: 1.9, alto: 1.47, cab: [2.35, 0.15], rejilla: 'bmw', escapes: 4 },

// Los detalles de un turismo: rejilla, escapes, alerones, franjas y tomas de aire.
function detalles(f, partes, pintura) {
  const { L, A, alto, cab } = f;
  const baja = alto * 0.48;
  const cubierta = 0.25 + baja;
  const frente = -L / 2 - 0.01;
  if (f.rejilla === 'bmw') for (const s of [-1, 1]) partes.push({ w: 0.24, h: 0.2, d: 0.04, x: s * 0.16, y: 0.25 + baja * 0.62, z: frente, color: NEGRO });
  if (f.rejilla === 'audi') partes.push({ w: 0.66, h: 0.3, d: 0.04, x: 0, y: 0.25 + baja * 0.5, z: frente, color: NEGRO });
  if (f.rejilla === 'aston') partes.push({ w: 0.9, h: 0.22, d: 0.04, x: 0, y: 0.25 + baja * 0.42, z: frente, color: GRIS });
  if (f.escapes) {
    const xs = f.escapes === 4 ? [-0.72, -0.56, 0.56, 0.72] : [-0.6, 0.6];
    for (const x of xs) partes.push({ w: 0.11, h: 0.09, d: 0.06, x: (x * A) / 1.9, y: 0.32, z: L / 2 + 0.01, color: NEGRO });
  }
  if (f.aleron === 'golf') partes.push({ w: A * 0.9, h: 0.06, d: 0.35, x: 0, y: alto - 0.05, z: L / 2 - 0.2, color: GRIS });
  if (f.aleron === 'lobo') partes.push({ w: A * 0.95, h: 0.08, d: 0.3, x: 0, y: baja + 0.45, z: L / 2 - 0.15, color: GRIS });
  if (f.aleron === 'techo') partes.push({ w: A * 0.8, h: 0.05, d: 0.3, x: 0, y: alto + 0.03, z: cab[1] + cab[0] / 2 - 0.1, color: GRIS });
  if (f.aleron === 'labio') partes.push({ w: A * 0.7, h: 0.04, d: 0.16, x: 0, y: cubierta + 0.02, z: L / 2 - 0.12, color: NEGRO });
  if (f.aleron === 'ballena') {
    partes.push({ w: A * 0.78, h: 0.06, d: 0.45, x: 0, y: cubierta + 0.14, z: L / 2 - 0.32, color: pintura });
    partes.push({ w: A * 0.5, h: 0.12, d: 0.1, x: 0, y: cubierta + 0.06, z: L / 2 - 0.32, color: GRIS });
  }
  if (f.aleron === 'ala') {
    const ala = alto + 0.13;
    partes.push({ w: A * 0.95, h: 0.06, d: 0.42, x: 0, y: ala + 0.03, z: L / 2 - 0.35, color: pintura });
    for (const s of [-1, 1]) partes.push({ w: 0.06, h: ala - cubierta, d: 0.12, x: s * 0.55, y: (ala + cubierta) / 2, z: L / 2 - 0.35, color: GRIS });
  }
  if (f.aletas) for (const s of [-1, 1]) partes.push({ w: 0.16, h: baja * 0.95, d: 1.15, x: s * (A / 2 + 0.06), y: 0.25 + baja * 0.5, z: L * 0.27, color: pintura });
  if (f.tomas) for (const s of [-1, 1]) partes.push({ w: 0.03, h: 0.24, d: 0.6, x: s * (A / 2 + 0.01), y: 0.25 + baja * 0.7, z: L * 0.06, color: GRIS });
  if (f.toma) partes.push({ w: 0.55, h: 0.09, d: 0.7, x: 0, y: cubierta + 0.05, z: -L / 2 + 1.1, color: GRIS });
  if (f.franjas) {
    for (const s of [-1, 1]) {
      partes.push({ w: 0.2, h: 0.02, d: L * 0.34, x: s * 0.2, y: cubierta + 0.01, z: -L * 0.31, color: NEGRO });
      partes.push({ w: 0.2, h: 0.02, d: cab[0] * 0.9, x: s * 0.2, y: alto + 0.055, z: cab[1], color: NEGRO });
      partes.push({ w: 0.2, h: 0.02, d: L * 0.16, x: s * 0.2, y: cubierta + 0.01, z: L * 0.41, color: NEGRO });
    }
  }
}

// pintura: el color de la carrocería; con instancias se pasa blanco y el color va por instancia.
function modeloCoche(tipo, pintura = '#FFFFFF', franja = null) {
  let partes, luces;
  const f = FORMA[tipo] || FORMA.coche;
  const { L, A } = f;
  if (tipo === 'camion') {
    partes = [
      { w: A, h: 2.5, d: 2.3, x: 0, y: 1.6, z: -L / 2 + 1.15, color: pintura },
      { w: A - 0.1, h: 0.9, d: 0.1, x: 0, y: 2.2, z: -L / 2 - 0.01, color: CRISTAL },
      { w: A, h: 3.1, d: L - 2.6, x: 0, y: 2.05, z: 1.3, color: '#C9C4B8' },
      { w: A - 0.2, h: 0.5, d: L - 0.4, x: 0, y: 0.5, z: 0, color: GRIS },
      ...ruedas(L * 0.9, A, 0.5),
      { w: 0.3, h: 1.0, d: 1.0, x: -A / 2 + 0.15, y: 0.5, z: 3.2, color: RUEDA },
      { w: 0.3, h: 1.0, d: 1.0, x: A / 2 - 0.15, y: 0.5, z: 3.2, color: RUEDA },
    ];
  } else if (tipo === 'furgo') {
    partes = [
      { w: A, h: 1.9, d: L - 0.9, x: 0, y: 1.35, z: 0.45, color: pintura },
      { w: A, h: 0.8, d: 1.0, x: 0, y: 0.8, z: -L / 2 + 0.5, color: pintura },
      { w: A - 0.1, h: 0.75, d: 0.6, x: 0, y: 1.75, z: -L / 2 + 1.1, color: CRISTAL, rx: -0.5 },
      ...ruedas(L, A),
    ];
  } else if (tipo === 'f1') {
    // v8: monocasco, morro, alerones, pontones, cubierta del motor, halo y casco (Alberto, 25/09: «uno que sea un Fórmula 1»).
    const fr = franja || pintura;
    partes = [
      { w: 0.8, h: 0.42, d: 2.6, x: 0, y: 0.4, z: 0.1, color: pintura },
      { w: 0.36, h: 0.22, d: 1.5, x: 0, y: 0.34, z: -1.9, color: pintura },
      { w: 1.9, h: 0.05, d: 0.5, x: 0, y: 0.12, z: -L / 2 + 0.3, color: fr },
      { w: 0.05, h: 0.22, d: 0.5, x: -0.93, y: 0.2, z: -L / 2 + 0.3, color: NEGRO },
      { w: 0.05, h: 0.22, d: 0.5, x: 0.93, y: 0.2, z: -L / 2 + 0.3, color: NEGRO },
      { w: 0.5, h: 0.38, d: 1.5, x: -0.62, y: 0.33, z: 0.45, color: pintura },
      { w: 0.5, h: 0.38, d: 1.5, x: 0.62, y: 0.33, z: 0.45, color: pintura },
      { w: 0.46, h: 0.45, d: 1.6, x: 0, y: 0.8, z: 1.0, color: pintura },
      { w: 1.05, h: 0.07, d: 0.42, x: 0, y: 1.02, z: L / 2 - 0.3, color: fr },
      { w: 0.05, h: 0.5, d: 0.5, x: -0.52, y: 0.8, z: L / 2 - 0.3, color: NEGRO },
      { w: 0.05, h: 0.5, d: 0.5, x: 0.52, y: 0.8, z: L / 2 - 0.3, color: NEGRO },
      { w: 0.66, h: 0.05, d: 0.75, x: 0, y: 0.9, z: -0.35, color: NEGRO },
      { w: 0.26, h: 0.24, d: 0.3, x: 0, y: 0.78, z: -0.05, color: '#F2C400' },
      ...ruedasF1(L, A),
    ];
  } else {
    const { alto, cab } = f;
    const baja = alto * 0.48;
    partes = [
      { w: A, h: baja, d: L, x: 0, y: 0.25 + baja / 2, color: pintura },
      { w: A * 0.86, h: alto - baja - 0.25, d: cab[0], x: 0, y: 0.25 + baja + (alto - baja - 0.25) / 2, z: cab[1], color: CRISTAL },
      { w: A * 0.84, h: 0.06, d: cab[0] * 0.9, x: 0, y: alto + 0.02, z: cab[1], color: f.techo || pintura },
      ...ruedas(L, A),
    ];
    if (franja) partes.push({ w: A + 0.02, h: 0.18, d: L * 0.7, x: 0, y: 0.25 + baja * 0.55, z: 0.1, color: franja });
    detalles(f, partes, pintura);
  }
  // Faros delante (-Z) y pilotos detrás (+Z).
  const yL = tipo === 'camion' ? 0.9 : 0.25 + 0.35;
  luces = [
    { w: 0.34, h: 0.14, d: 0.05, x: -A / 2 + 0.3, y: yL, z: -L / 2 - 0.02, color: '#FFF4D6' },
    { w: 0.34, h: 0.14, d: 0.05, x: A / 2 - 0.3, y: yL, z: -L / 2 - 0.02, color: '#FFF4D6' },
    { w: 0.3, h: 0.12, d: 0.05, x: -A / 2 + 0.25, y: yL + 0.08, z: L / 2 + 0.02, color: '#FF2A1A' },
    { w: 0.3, h: 0.12, d: 0.05, x: A / 2 - 0.25, y: yL + 0.08, z: L / 2 + 0.02, color: '#FF2A1A' },
  ];
  if (tipo === 'f1') {
    // Sin faros de verdad: dos luces pequeñas en el morro y la luz de lluvia detrás.
    luces = [
      { w: 0.12, h: 0.06, d: 0.05, x: -0.1, y: 0.38, z: -2.66, color: '#FFF4D6' },
      { w: 0.12, h: 0.06, d: 0.05, x: 0.1, y: 0.38, z: -2.66, color: '#FFF4D6' },
      { w: 0.16, h: 0.08, d: 0.05, x: 0, y: 0.5, z: L / 2 + 0.02, color: '#FF2A1A' },
      { w: 0.16, h: 0.08, d: 0.05, x: 0, y: 0.62, z: L / 2 + 0.02, color: '#FF2A1A' },
    ];
  }
  return { cuerpo: fundirCajas(partes), luces: fundirCajas(luces), largo: L, ancho: A };
}

// ------------------------------------------------------------------ texturas
function texturaBarrio(res) {
  const c = lienzo(res, res), g = c.getContext('2d');
  const S = res / 470, px = (x) => (x + 235) * S, py = (y) => (235 - y) * S;
  g.fillStyle = '#2B2E35';
  g.fillRect(0, 0, res, res);
  // Calles.
  g.fillStyle = '#16181D';
  for (const c2 of CALLES_NS) g.fillRect(px(c2.x - c2.ancho / 2), 0, c2.ancho * S, res);
  for (const c2 of CALLES_EO) g.fillRect(0, py(c2.y + c2.ancho / 2), res, c2.ancho * S);
  for (const cj of CALLEJONES) g.fillRect(px(cj.x0), py(cj.y1), (cj.x1 - cj.x0) * S, (cj.y1 - cj.y0) * S);
  g.fillRect(px(PARKING.x0), py(PARKING.y1), (PARKING.x1 - PARKING.x0) * S, (PARKING.y1 - PARKING.y0) * S);
  // Glorieta.
  g.beginPath();
  g.arc(px(0), py(0), GLORIETA.rExt * S, 0, Math.PI * 2);
  g.fill();
  // Marcas: línea central discontinua en calles; doble continua en avenidas.
  g.strokeStyle = 'rgba(235,235,225,0.75)';
  g.lineWidth = Math.max(1, 0.15 * S);
  g.setLineDash([3 * S, 5 * S]);
  for (const c2 of CALLES_NS) if (c2.ancho < 16) { g.beginPath(); g.moveTo(px(c2.x), 0); g.lineTo(px(c2.x), res); g.stroke(); }
  for (const c2 of CALLES_EO) if (c2.ancho < 16) { g.beginPath(); g.moveTo(0, py(c2.y)); g.lineTo(res, py(c2.y)); g.stroke(); }
  g.setLineDash([]);
  for (const o of [-0.25, 0.25]) {
    g.beginPath(); g.moveTo(px(o), 0); g.lineTo(px(o), py(GLORIETA.rExt)); g.moveTo(px(o), py(-GLORIETA.rExt)); g.lineTo(px(o), res); g.stroke();
    g.beginPath(); g.moveTo(0, py(o)); g.lineTo(px(-GLORIETA.rExt), py(o)); g.moveTo(px(GLORIETA.rExt), py(o)); g.lineTo(res, py(o)); g.stroke();
  }
  // Pasos de cebra en las bocas de los cruces.
  g.fillStyle = 'rgba(230,230,220,0.55)';
  for (const a of CALLES_NS) for (const b of CALLES_EO) {
    if (Math.abs(a.x) < 1 && Math.abs(b.y) < 1) continue;
    for (const lado of [-1, 1]) {
      const yz = b.y + lado * (b.ancho / 2 + 1.6);
      for (let k = -a.ancho / 2 + 0.6; k < a.ancho / 2 - 0.4; k += 1.2) g.fillRect(px(a.x + k), py(yz + 1.2), 0.6 * S, 2.4 * S);
      const xz = a.x + lado * (a.ancho / 2 + 1.6);
      for (let k = -b.ancho / 2 + 0.6; k < b.ancho / 2 - 0.4; k += 1.2) g.fillRect(px(xz - 1.2), py(b.y + k + 0.6), 2.4 * S, 0.6 * S);
    }
  }
  // Plazas del parking.
  g.strokeStyle = 'rgba(230,230,220,0.6)';
  g.lineWidth = Math.max(1, 0.12 * S);
  for (const fy of [88.5, 93.1, 108.6, 113.2, 126.6, 131.2]) {
    for (let x = -143.1; x <= -81; x += 4.2) {
      g.beginPath(); g.moveTo(px(x), py(fy - 2.2)); g.lineTo(px(x), py(fy + 2.2)); g.stroke();
    }
  }
  // Isleta de la glorieta.
  g.fillStyle = '#1E3322';
  g.beginPath();
  g.arc(px(0), py(0), GLORIETA.r * S, 0, Math.PI * 2);
  g.fill();
  return texturaDe(c);
}

function texturaRonda() {
  // u: de d = -15 (borde del barrio) a d = +15 (borde exterior); v: 24 m por repetición.
  const W = 1024, H = 256, c = lienzo(W, H), g = c.getContext('2d');
  const u = (d) => ((d + 15) / 30) * W;
  g.fillStyle = '#17191E';
  g.fillRect(0, 0, W, H);
  // Algo de grano para que el asfalto no parezca plástico.
  const azar = crearAzar(7);
  for (let i = 0; i < 1800; i++) {
    g.fillStyle = `rgba(255,255,255,${azar.rango(0.01, 0.05)})`;
    g.fillRect(azar.rango(0, W), azar.rango(0, H), 1, 1);
  }
  g.fillStyle = '#4A4C52';
  g.fillRect(u(-0.5), 0, u(0.5) - u(-0.5), H);
  g.fillStyle = 'rgba(246,246,236,0.95)';
  const linea = (d, discontinua) => {
    const w = 0.2 / 30 * W;
    if (!discontinua) g.fillRect(u(d) - w / 2, 0, w, H);
    else for (const y0 of [0, H / 2]) g.fillRect(u(d) - w / 2, y0, w, H * (4.5 / 24));
  };
  for (const s of [-1, 1]) {
    linea(s * 1.1, false);
    linea(s * 14.0, false);
    linea(s * 5.1, true);
    linea(s * 8.7, true);
  }
  const t = texturaDe(c, true);
  t.anisotropy = 8; // las marcas viales se siguen viendo a lo lejos y en ángulo rasante
  return t;
}

function texturaPantalla() {
  const c = lienzo(128, 128), g = c.getContext('2d');
  g.fillStyle = '#233247';
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#34465F';
  g.fillRect(0, 0, 128, 10);
  g.fillStyle = '#8C949E'; // guardarraíl abajo
  g.fillRect(0, 104, 128, 16);
  g.fillStyle = '#5D646D';
  g.fillRect(0, 118, 128, 10);
  g.fillStyle = '#10151E'; // postes cada 2 m: el ritmo de la velocidad
  g.fillRect(0, 0, 10, 128);
  g.fillRect(64, 0, 6, 104);
  return texturaDe(c, true);
}

function texturaVentanas() {
  const c = lienzo(256, 256), g = c.getContext('2d');
  const e = lienzo(256, 256), ge = e.getContext('2d');
  g.fillStyle = '#FFFFFF';
  g.fillRect(0, 0, 256, 256);
  ge.fillStyle = '#000000';
  ge.fillRect(0, 0, 256, 256);
  const azar = crearAzar(99);
  const calidos = ['#FFD9A0', '#FFE7B8', '#FFC77A', '#CFE3FF', '#FFF1D8'];
  for (let fil = 0; fil < 8; fil++) {
    for (let col = 0; col < 8; col++) {
      const x = col * 32 + 7, y = fil * 32 + 9;
      const encendida = azar.probabilidad(0.32);
      g.fillStyle = encendida ? '#7A6A52' : '#20262F';
      g.fillRect(x, y, 18, 16);
      if (encendida) {
        ge.fillStyle = azar.elegir(calidos);
        ge.globalAlpha = azar.rango(0.55, 1);
        ge.fillRect(x, y, 18, 16);
        ge.globalAlpha = 1;
      }
    }
  }
  const t = texturaDe(c, true), te = texturaDe(e, true);
  return { mapa: t, brillo: te };
}

function texturaHorizonte() {
  const W = 2048, H = 256, c = lienzo(W, H), g = c.getContext('2d');
  const cielo = g.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, '#060912');
  cielo.addColorStop(0.55, '#101A33');
  cielo.addColorStop(0.8, '#2A2440');
  cielo.addColorStop(1, '#3A2A3A');
  g.fillStyle = cielo;
  g.fillRect(0, 0, W, H);
  const azar = crearAzar(3);
  let x = 0;
  while (x < W) {
    const w = azar.rango(14, 46), h = azar.rango(18, 95);
    g.fillStyle = '#070A12';
    g.fillRect(x, H - h, w, h);
    for (let wy = H - h + 4; wy < H - 4; wy += 6) for (let wx = x + 3; wx < x + w - 3; wx += 5) {
      if (azar.probabilidad(0.18)) {
        g.fillStyle = azar.probabilidad(0.8) ? 'rgba(255,210,150,0.8)' : 'rgba(180,210,255,0.8)';
        g.fillRect(wx, wy, 2, 2);
      }
    }
    x += w + azar.rango(0, 10);
  }
  return texturaDe(c, true);
}

// ------------------------------------------------------------------ la escena
function crearEscena(mapa, opciones = {}) {
  const calidad = opciones.calidad ?? 1;
  const escena = new THREE.Scene();
  escena.background = new THREE.Color(COLOR_NOCHE);
  escena.fog = new THREE.Fog(COLOR_NOCHE, 70, calidad < 1 ? 330 : 430);
  // v8: algo más de luz de ambiente y el ajuste «Más luz» (Alberto, 25/09: «aunque sea de noche… que se pueda ver un
  // poco más»). Sin manchas de luz (gama baja), el ambiente sube un poco más para compensar.
  const ambiente = new THREE.HemisphereLight('#6D7FAF', '#1A1410', 0.66);
  escena.add(ambiente);
  const luna = new THREE.DirectionalLight('#9FB2FF', 0.4);
  luna.position.set(-0.4, 1, 0.3);
  escena.add(luna);
  const nieblaLejos = escena.fog.far;
  function ponerLuz(modo) {
    const clara = modo === 'clara';
    ambiente.intensity = (clara ? 1.05 : 0.66) + (calidad < 1 ? 0.14 : 0);
    luna.intensity = clara ? 0.62 : 0.4;
    escena.fog.near = clara ? 95 : 70;
    escena.fog.far = clara ? nieblaLejos + 90 : nieblaLejos;
  }
  ponerLuz(opciones.luz);

  const mat = {
    hormigon: new THREE.MeshLambertMaterial({ color: '#5A5D63' }),
    cuerpo: new THREE.MeshLambertMaterial({ vertexColors: true }),
    luces: new THREE.MeshBasicMaterial({ vertexColors: true }),
  };

  // Suelo lejano y el barrio.
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), new THREE.MeshLambertMaterial({ color: '#0C1015' }));
  suelo.rotation.x = -Math.PI / 2;
  suelo.position.y = -0.06;
  escena.add(suelo);
  const barrio = new THREE.Mesh(new THREE.PlaneGeometry(470, 470), new THREE.MeshLambertMaterial({ map: texturaBarrio(calidad < 1 ? 1024 : 2048) }));
  barrio.rotation.x = -Math.PI / 2;
  escena.add(barrio);

  // La Ronda: una tira con las dos calzadas y la mediana, que sube en la rasante.
  const puntos = [], normales = [];
  for (let s = 0; s <= LARGO_RONDA + 0.01; s += 5) {
    const p = rondaPunto(s, 0);
    puntos.push({ x: p.x, y: p.y, h: alturaRonda(s) });
    normales.push({ x: p.nx, y: p.ny });
  }
  // La pintura de las marcas brilla un poco sola, como la pintura reflectante de noche: son las que dan la velocidad.
  const texRonda = texturaRonda();
  const ronda = new THREE.Mesh(tira(puntos, normales, -15, 15, 24, 0.03), new THREE.MeshLambertMaterial({ map: texRonda, emissive: '#FFFFFF', emissiveMap: texRonda, emissiveIntensity: 0.3 }));
  escena.add(ronda);
  // Mediana: dos caras y el lomo.
  const med = new THREE.Group();
  const matMediana = new THREE.MeshLambertMaterial({ color: '#5A5D63', side: THREE.DoubleSide });
  med.add(new THREE.Mesh(pared(puntos, normales, -0.5, 0, 1, 10), matMediana));
  med.add(new THREE.Mesh(pared(puntos, normales, 0.5, 0, 1, 10), matMediana));
  med.add(new THREE.Mesh(tira(puntos, normales, -0.5, 0.5, 10, 1.0), matMediana));
  escena.add(med);
  // Pantallas acústicas: del lado del barrio (con huecos en las salidas abiertas) y del lado de fuera.
  const matPantalla = new THREE.MeshLambertMaterial({ map: texturaPantalla(), side: THREE.DoubleSide });
  const geoPant = [];
  const pantallasExt = pared(puntos, normales, 14.8, 0, 4.6, 4);
  geoPant.push(pantallasExt);
  // Las del barrio salen de los segmentos que usa la línea de visión: lo que se ve es lo que tapa.
  {
    const pos = [], uv = [], idx = [];
    let k = 0, acum = 0;
    for (const s of mapa.pantallas) {
      const ha = alturaEn(s.ax, s.ay), hb = alturaEn(s.bx, s.by);
      const largo = Math.hypot(s.bx - s.ax, s.by - s.ay);
      pos.push(s.ax, -0.05, -s.ay, s.ax, ha + 4.6, -s.ay, s.bx, -0.05, -s.by, s.bx, hb + 4.6, -s.by);
      uv.push(acum / 4, 0, acum / 4, 1, (acum + largo) / 4, 0, (acum + largo) / 4, 1);
      acum += largo;
      idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
      k += 4;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(idx);
    g.computeVertexNormals();
    geoPant.push(g);
  }
  for (const g of geoPant) escena.add(new THREE.Mesh(g, matPantalla));

  // Rampas y muros bajos (rampas, borde del barrio).
  const matRampa = new THREE.MeshLambertMaterial({ color: '#1A1C21' });
  if (mapa.rampasAbiertas) {
    for (const r of RAMPAS) {
      const pts = [], nor = [];
      for (let k = 0; k <= 18; k++) {
        const a = r.a0 + ((r.a1 - r.a0) * k) / 18;
        pts.push({ x: r.cx + RAMPA_R * Math.cos(a), y: r.cy + RAMPA_R * Math.sin(a), h: 0 });
        nor.push({ x: Math.cos(a), y: Math.sin(a) });
      }
      escena.add(new THREE.Mesh(tira(pts, nor, -RAMPA_MEDIO - 0.3, RAMPA_MEDIO + 0.3, 24, 0.025), matRampa));
    }
  }
  {
    const pos = [], idx = [];
    let k = 0;
    for (const m of mapa.muros) {
      if (m.tipo !== 'rampa' && m.tipo !== 'borde') continue;
      pos.push(m.ax, 0, -m.ay, m.ax, m.alto, -m.ay, m.bx, 0, -m.by, m.bx, m.alto, -m.by);
      idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
      k += 4;
    }
    for (const b of mapa.cajas) {
      if (b.tipo !== 'tapia') continue;
      const alto = 1.3;
      for (const [ax, ay, bx, by] of [[b.x0, b.y0, b.x1, b.y0], [b.x1, b.y0, b.x1, b.y1], [b.x1, b.y1, b.x0, b.y1], [b.x0, b.y1, b.x0, b.y0]]) {
        pos.push(ax, 0, -ay, ax, alto, -ay, bx, 0, -by, bx, alto, -by);
        idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
        k += 4;
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    escena.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: '#6B6E74', side: THREE.DoubleSide })));
  }

  // Edificios: una sola geometría; ventanas de una textura (las encendidas brillan solas).
  const vent = texturaVentanas();
  {
    const pos = [], nor = [], uv = [], col = [], idx = [];
    const c = new THREE.Color();
    let k = 0;
    const azar = crearAzar(4242);
    const cara = (p0, p1, alto, nx, nz, ox, oy, sinVentanas) => {
      const largo = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      pos.push(p0[0], 0, -p0[1], p1[0], 0, -p1[1], p1[0], alto, -p1[1], p0[0], alto, -p0[1]);
      for (let i = 0; i < 4; i++) nor.push(nx, 0, nz);
      if (sinVentanas) uv.push(0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01, 0.01);
      else {
        const u0 = ox, u1 = ox + largo / 24, v0 = oy, v1 = oy + alto / 25.6;
        uv.push(u0, v0, u1, v0, u1, v1, u0, v1);
      }
      for (let i = 0; i < 4; i++) col.push(c.r, c.g, c.b);
      idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
      k += 4;
    };
    for (const e of mapa.edificios) {
      c.set(e.color || '#303440');
      const sin = !!e.tunel;
      const ox = azar.rango(0, 1), oy = azar.rango(0, 1);
      cara([e.x0, e.y0], [e.x1, e.y0], e.alto, 0, 1, ox, oy, sin);          // sur (normal hacia -y del mundo = +z)
      cara([e.x1, e.y1], [e.x0, e.y1], e.alto, 0, -1, ox + 0.3, oy, sin);   // norte
      cara([e.x1, e.y0], [e.x1, e.y1], e.alto, 1, 0, ox + 0.6, oy, sin);    // este
      cara([e.x0, e.y1], [e.x0, e.y0], e.alto, -1, 0, ox + 0.9, oy, sin);   // oeste
      // Tejado, algo más oscuro.
      c.multiplyScalar(0.6);
      pos.push(e.x0, e.alto, -e.y0, e.x1, e.alto, -e.y0, e.x1, e.alto, -e.y1, e.x0, e.alto, -e.y1);
      for (let i = 0; i < 4; i++) { nor.push(0, 1, 0); uv.push(0.01, 0.01); col.push(c.r, c.g, c.b); }
      idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
      k += 4;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    const m = new THREE.MeshLambertMaterial({ map: vent.mapa, emissiveMap: vent.brillo, emissive: new THREE.Color('#FFFFFF'), vertexColors: true, side: THREE.DoubleSide });
    escena.add(new THREE.Mesh(g, m));
  }

  // Túnel: techo y luces en el techo que pasan como un estroboscopio.
  const techo = new THREE.Mesh(new THREE.BoxGeometry(TUNEL.x1 - TUNEL.x0 + 0.8, 0.8, TUNEL.y1 - TUNEL.y0), mat.hormigon);
  techo.position.set(0, 6.0, -(TUNEL.y0 + TUNEL.y1) / 2);
  escena.add(techo);

  // Farolas: postes, cabezas encendidas y manchas de luz en el suelo (tres llamadas de dibujo en total).
  const farolas = mapa.farolas;
  const cabezas = [];
  for (const f of farolas) {
    if (f.tipo === 'mediana') {
      const p = rondaPunto(f.s, 0), hr = alturaRonda(f.s);
      for (const d of [-4.5, 4.5]) cabezas.push({ x: p.x + p.nx * d, y: p.y + p.ny * d, h: hr + f.h, pool: [p.x + p.nx * d * 1.5, p.y + p.ny * d * 1.5, hr], color: 'blanca' });
    } else if (f.tipo === 'tunel') cabezas.push({ x: f.x, y: f.y, h: f.h, pool: [f.x, f.y, 0], color: 'tunel' });
    else cabezas.push({ x: f.x, y: f.y, h: f.h, pool: [f.x, f.y, 0], color: f.tipo === 'parking' ? 'blanca' : 'sodio' });
  }
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), esc = new THREE.Vector3();
  {
    const postes = farolas.filter((f) => f.tipo !== 'tunel');
    const geo = new THREE.BoxGeometry(0.16, 1, 0.16);
    geo.translate(0, 0.5, 0);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: '#3B3F46' }), postes.length);
    postes.forEach((f, i) => {
      const h = f.tipo === 'mediana' ? alturaRonda(f.s) : 0;
      m4.compose(v3.set(f.x, h, -f.y), q.identity(), esc.set(1, f.h, 1));
      im.setMatrixAt(i, m4);
    });
    im.frustumCulled = false;
    escena.add(im);
  }
  {
    const geo = new THREE.BoxGeometry(0.7, 0.14, 0.4);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: '#FFFFFF' }), cabezas.length);
    const col = new THREE.Color();
    cabezas.forEach((cb, i) => {
      m4.compose(v3.set(cb.x, cb.h, -cb.y), q.identity(), esc.set(cb.color === 'tunel' ? 2.2 : 1, 1, 1));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(cb.color === 'sodio' ? '#FFB561' : cb.color === 'tunel' ? '#FFE9C2' : '#E4EEFF'));
    });
    im.frustumCulled = false;
    escena.add(im);
  }
  const conManchas = calidad >= 1;
  if (conManchas) {
    const geo = new THREE.PlaneGeometry(1, 1);
    geo.rotateX(-Math.PI / 2);
    const matMancha = new THREE.MeshBasicMaterial({ map: texturaMancha('#FFFFFF'), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: true });
    const im = new THREE.InstancedMesh(geo, matMancha, cabezas.length);
    const col = new THREE.Color();
    cabezas.forEach((cb, i) => {
      // v8: manchas más grandes y más claras (Alberto, 25/09: «que se pueda ver un poco más»).
      const r = cb.color === 'tunel' ? 8 : cb.color === 'blanca' ? 16 : 15;
      m4.compose(v3.set(cb.pool[0], cb.pool[2] + 0.06, -cb.pool[1]), q.identity(), esc.set(r, 1, r));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(cb.color === 'sodio' ? '#7A5220' : cb.color === 'tunel' ? '#5E4F36' : '#3C4C6A'));
    });
    im.frustumCulled = false;
    escena.add(im);
  }
  // v8: un halo en cada farola, para que se vean como puntos de luz también de lejos (una llamada de dibujo).
  {
    const pos = [], col = [];
    const c = new THREE.Color();
    for (const cb of cabezas) {
      pos.push(cb.x, cb.h - 0.1, -cb.y);
      c.set(cb.color === 'sodio' ? '#FFB561' : cb.color === 'tunel' ? '#FFE9C2' : '#DCE8FF').multiplyScalar(cb.color === 'tunel' ? 0.4 : 0.75);
      col.push(c.r, c.g, c.b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const halos = new THREE.Points(g, new THREE.PointsMaterial({
      map: texturaMancha('#FFFFFF'), size: calidad < 1 ? 1.8 : 2.4, sizeAttenuation: true, vertexColors: true,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    }));
    halos.frustumCulled = false;
    escena.add(halos);
  }

  // Glorieta: isleta con un monumento que se ve desde lejos.
  const isleta = new THREE.Mesh(new THREE.CylinderGeometry(GLORIETA.r, GLORIETA.r, 0.4, 24), new THREE.MeshLambertMaterial({ color: '#23402A' }));
  isleta.position.y = 0.2;
  escena.add(isleta);
  const obelisco = new THREE.Mesh(new THREE.BoxGeometry(1.4, 12, 1.4), new THREE.MeshLambertMaterial({ color: '#8C8778', emissive: '#2A2418' }));
  obelisco.position.y = 6;
  escena.add(obelisco);

  // Horizonte: una ciudad lejana alrededor, sin niebla.
  const hz = new THREE.Mesh(new THREE.CylinderGeometry(950, 950, 160, 32, 1, true), new THREE.MeshBasicMaterial({ map: texturaHorizonte(), side: THREE.BackSide, fog: false }));
  hz.material.map.repeat.set(3, 1);
  hz.position.y = 55;
  escena.add(hz);

  // Coches aparcados (fijos).
  {
    const mod = modeloCoche('coche');
    const im = new THREE.InstancedMesh(mod.cuerpo, mat.cuerpo, mapa.aparcados.length);
    const azar = crearAzar(11);
    const col = new THREE.Color();
    mapa.aparcados.forEach((a, i) => {
      q.setFromAxisAngle(v3.set(0, 1, 0), -a.h);
      m4.compose(v3.set(a.x, 0, -a.y), q, esc.set(1, 1, 1));
      im.setMatrixAt(i, m4);
      im.setColorAt(i, col.set(azar.elegir(['#8B1E24', '#C9CED6', '#1E2230', '#2F4A7A', '#D8D2C4', '#4A4F57'])));
    });
    im.frustumCulled = false;
    escena.add(im);
  }

  // v8: el taller del Puerto. Portón iluminado en la fachada, rótulo y recuadro verde en el carril donde hay que parar.
  if (mapa.rampasAbiertas !== undefined) escena.add(crearTaller());

  return { escena, mat, texturaMancha, ponerLuz };
}

function crearTaller() {
  const g = new THREE.Group();
  const T = TALLER;
  const ancho = T.x1 - T.x0;
  // Recuadro en el suelo: cuatro líneas verdes que brillan solas.
  const verde = new THREE.MeshBasicMaterial({ color: '#3DDC84' });
  const linea = (w, d, x, y) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, d), verde);
    m.position.set(x, 0.04, -y);
    g.add(m);
  };
  const alto = T.y1 - T.y0;
  linea(ancho, 0.25, T.x, T.y0 + 0.2);
  linea(ancho, 0.25, T.x, T.y1 - 0.12);
  linea(0.25, alto, T.x0 + 0.12, (T.y0 + T.y1) / 2);
  linea(0.25, alto, T.x1 - 0.12, (T.y0 + T.y1) / 2);
  // Rótulo «TALLER».
  const c = lienzo(512, 128);
  const x = c.getContext('2d');
  x.fillStyle = '#0E1A12';
  x.fillRect(0, 0, 512, 128);
  x.strokeStyle = '#3DDC84';
  x.lineWidth = 8;
  x.strokeRect(6, 6, 500, 116);
  x.fillStyle = '#3DDC84';
  x.font = 'bold 84px sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('TALLER', 256, 68);
  const rotulo = new THREE.Mesh(new THREE.PlaneGeometry(8, 2), new THREE.MeshBasicMaterial({ map: texturaDe(c) }));
  rotulo.position.set(T.x, 6.2, -(T.puerta + 0.05));
  rotulo.rotation.y = Math.PI; // mira a la calle (hacia -y del mundo, +z de three)
  g.add(rotulo);
  // Portón abierto con luz dentro.
  const porton = new THREE.Mesh(new THREE.PlaneGeometry(ancho - 2, 4.2), new THREE.MeshBasicMaterial({ color: '#C9F2D8' }));
  porton.position.set(T.x, 2.1, -(T.puerta + 0.04));
  porton.rotation.y = Math.PI;
  g.add(porton);
  return g;
}

// ------------------------------------------------------------------ coches que se mueven
// Tráfico en instancias: una malla por tipo para la carrocería y otra para los faros.
function crearTraficoVisual(escena, trafico, opciones = {}) {
  const tipos = {};
  const todos = [...trafico.ronda, ...trafico.exterior, ...trafico.barrio, ...(trafico.reserva || [])]; // la reserva, escondida
  for (const t of ['coche', 'furgo', 'camion']) {
    const lista = todos.filter((v) => v.tipo === t);
    if (!lista.length) continue;
    const mod = modeloCoche(t);
    const cuerpo = new THREE.InstancedMesh(mod.cuerpo, new THREE.MeshLambertMaterial({ vertexColors: true }), lista.length);
    const luces = new THREE.InstancedMesh(mod.luces, new THREE.MeshBasicMaterial({ vertexColors: true }), lista.length);
    cuerpo.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    luces.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    cuerpo.frustumCulled = luces.frustumCulled = false;
    const col = new THREE.Color();
    lista.forEach((v, i) => cuerpo.setColorAt(i, col.set(v.color)));
    escena.add(cuerpo, luces);
    // v8: el haz de los faros de cada coche sobre el asfalto (solo en calidad normal: es relleno de pantalla).
    let haces = null;
    if (opciones.haces) {
      const geo = new THREE.PlaneGeometry(t === 'camion' ? 7.5 : 6.5, 22);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, 0.05, -(mod.largo / 2 + 11));
      haces = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ map: haz(), color: '#4F4838', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), lista.length);
      haces.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      haces.frustumCulled = false;
      escena.add(haces);
    }
    tipos[t] = { lista, cuerpo, luces, haces, quemados: lista.map(() => false) };
  }
  const QUEMADO = new THREE.Color('#16120F'), col = new THREE.Color();
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), p = new THREE.Vector3(), uno = new THREE.Vector3(1, 1, 1), eje = new THREE.Vector3(0, 1, 0);
  const cero = new THREE.Matrix4().makeScale(0, 0, 0);
  // Intermitentes: cuatro pilotos ámbar por vehículo, solo al parpadear. Cambiando de carril, los dos de ese lado;
  // parado tras un choque, los cuatro (luces de emergencia, v7).
  const intermitentes = new THREE.InstancedMesh(new THREE.BoxGeometry(0.24, 0.14, 0.16), new THREE.MeshBasicMaterial({ color: '#FFB020' }), todos.length * 4);
  intermitentes.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  intermitentes.frustumCulled = false;
  escena.add(intermitentes);
  return {
    actualizar(alpha) {
      for (const t of Object.values(tipos)) {
        let colores = false;
        t.lista.forEach((v, i) => {
          // Quemado tras una explosión: carrocería negra y sin faros (la grúa lo devuelve como nuevo).
          if (!!v.quemado !== t.quemados[i]) {
            t.quemados[i] = !!v.quemado;
            t.cuerpo.setColorAt(i, v.quemado ? QUEMADO : col.set(v.color));
            colores = true;
          }
          if (v.oculto) { t.cuerpo.setMatrixAt(i, cero); t.luces.setMatrixAt(i, cero); if (t.haces) t.haces.setMatrixAt(i, cero); return; }
          const x = v._px !== undefined ? v._px + (v.x - v._px) * alpha : v.x;
          const y = v._py !== undefined ? v._py + (v.y - v._py) * alpha : v.y;
          q.setFromAxisAngle(eje, -v.h);
          m4.compose(p.set(x, alturaEn(x, y), -y), q, uno);
          t.cuerpo.setMatrixAt(i, m4);
          t.luces.setMatrixAt(i, v.quemado ? cero : m4);
          if (t.haces) t.haces.setMatrixAt(i, v.quemado ? cero : m4);
        });
        t.cuerpo.instanceMatrix.needsUpdate = true;
        t.luces.instanceMatrix.needsUpdate = true;
        if (t.haces) t.haces.instanceMatrix.needsUpdate = true;
        if (colores && t.cuerpo.instanceColor) t.cuerpo.instanceColor.needsUpdate = true;
      }
      const encendido = Math.floor(performance.now() / 330) % 2 === 0;
      todos.forEach((v, i) => {
        const lados = v.emergencia ? [-1, 1] : v.intermitente ? [v.intermitente] : [];
        if (!encendido || !lados.length || v.oculto) {
          for (let k = 0; k < 4; k++) intermitentes.setMatrixAt(4 * i + k, cero);
          return;
        }
        const x = v._px !== undefined ? v._px + (v.x - v._px) * alpha : v.x;
        const y = v._py !== undefined ? v._py + (v.y - v._py) * alpha : v.y;
        const fx = Math.sin(v.h), fy = Math.cos(v.h), rx = Math.cos(v.h), ry = -Math.sin(v.h);
        const alto = v.tipo === 'camion' ? 1.05 : 0.72;
        q.setFromAxisAngle(eje, -v.h);
        let k = 0;
        for (const lado of lados) {
          const lat = (v.ancho / 2) * lado;
          for (const lon of [v.largo / 2 - 0.15, -v.largo / 2 + 0.15]) {
            const px = x + fx * lon + rx * lat, py = y + fy * lon + ry * lat;
            m4.compose(p.set(px, alturaEn(px, py) + alto, -py), q, uno);
            intermitentes.setMatrixAt(4 * i + k++, m4);
          }
        }
        while (k < 4) intermitentes.setMatrixAt(4 * i + k++, cero);
      });
      intermitentes.instanceMatrix.needsUpdate = true;
    },
