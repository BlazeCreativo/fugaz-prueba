<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FUGAZ · Escape</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<meta name="description" content="FUGAZ · prototipo «persecución y escape»: 60-90 s huyendo de la policía con un pulgar.">
<link rel="stylesheet" href="../vendor/fuentes/fuentes.css">
<style>
:root {
  color-scheme: dark;
  --fondo: #070A12; --texto: #E8EDF7; --tenue: #9AA6BC;
  --rojo: #FF3355; --azul: #3D7BFF; --ambar: #FFB020; --verde: #3DDC84; --cian: #7FE3FF;
  --display: 'Saira Extra Condensed', 'Arial Narrow', sans-serif;
  --ui: 'Overpass', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Overpass Mono', ui-monospace, monospace;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); overflow: hidden; }
body { font-family: var(--ui); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
#juego { position: fixed; inset: 0; touch-action: none; }
#lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#vineta { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px 30px rgba(255, 51, 85, 0); transition: box-shadow 0.25s; }
#vineta.golpe { box-shadow: inset 0 0 140px 50px rgba(255, 51, 85, 0.55); transition: none; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
.arriba { position: absolute; top: calc(var(--st) + 10px); left: calc(var(--sl) + 12px); right: calc(var(--sr) + 12px); display: flex; justify-content: space-between; align-items: flex-start; }
#golpes { display: flex; gap: 6px; }
#golpes i { width: 22px; height: 26px; background: var(--cian); clip-path: polygon(50% 0, 100% 18%, 92% 70%, 50% 100%, 8% 70%, 0 18%); opacity: 0.95; transition: background 0.2s, opacity 0.2s; }
#golpes i.roto { background: #3a4258; opacity: 0.6; }
#marcador { text-align: right; font-family: var(--mono); font-weight: 700; text-shadow: 0 2px 8px #000; }
#puntos { font-size: 30px; line-height: 1; }
#mult { font-size: 22px; color: var(--ambar); margin-top: 4px; transition: transform 0.12s; }
#mult.sube { transform: scale(1.5); }
#progreso { position: absolute; top: calc(var(--st) + 52px); left: 50%; width: min(46vw, 260px); transform: translateX(-50%); height: 6px; border-radius: 3px; background: rgba(160, 180, 220, 0.2); overflow: hidden; }
#progreso b { display: block; height: 100%; width: 0; background: var(--verde); }
#velo { position: absolute; bottom: calc(var(--sb) + 14px); right: calc(var(--sr) + 14px); font-family: var(--mono); font-weight: 700; font-size: 20px; color: var(--tenue); text-shadow: 0 2px 6px #000; }
#aviso { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 42px; letter-spacing: 1px; text-shadow: 0 3px 12px #000; opacity: 0; transform: scale(0.8); transition: opacity 0.15s, transform 0.15s; }
#aviso.ver { opacity: 1; transform: scale(1); }
#cuenta { position: absolute; top: 36%; left: 0; right: 0; text-align: center; font-family: var(--display); font-weight: 800; font-size: 120px; color: var(--cian); text-shadow: 0 4px 20px #000; }
.patrulla { position: absolute; bottom: calc(var(--sb) + 8px); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid var(--rojo); transform: translateX(-50%) rotate(180deg); opacity: 0.9; }
.patrulla.cerca { animation: latido 0.25s infinite alternate; }
@keyframes latido { to { transform: translateX(-50%) rotate(180deg) scale(1.35); } }

/* Tutorial sin texto: una mano que desliza (táctil) o dos teclas (PC). */
#guia { position: absolute; left: 50%; bottom: calc(var(--sb) + 18%); transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; opacity: 0.95; }
#guia .mano { width: 64px; height: 64px; animation: deslizar 1.4s ease-in-out infinite; }
#guia .flechas { font-family: var(--display); font-size: 40px; font-weight: 800; color: var(--cian); letter-spacing: 70px; margin-left: 70px; }
#guia .teclas { display: flex; gap: 10px; }
#guia .teclas span { width: 54px; height: 54px; border: 3px solid var(--cian); border-radius: 10px; display: grid; place-items: center; font-size: 28px; font-weight: 800; color: var(--cian); background: rgba(7, 10, 18, 0.6); }
#guia .teclas span:first-child { animation: pulsa 1.4s infinite; }
#guia .teclas span:last-child { animation: pulsa 1.4s 0.7s infinite; }
@keyframes deslizar { 0%, 100% { transform: translateX(-60px); } 50% { transform: translateX(60px); } }
@keyframes pulsa { 0%, 40%, 100% { background: rgba(7, 10, 18, 0.6); } 15% { background: rgba(127, 227, 255, 0.5); } }

/* Pantallas */
.capa { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: calc(var(--st) + 16px) calc(var(--sr) + 16px) calc(var(--sb) + 16px) calc(var(--sl) + 16px); }
#inicio { background: radial-gradient(ellipse at center, rgba(7, 10, 18, 0.2), rgba(7, 10, 18, 0.85)); }
.logo { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 18vw, 120px); line-height: 0.9; letter-spacing: 2px; color: var(--cian); text-shadow: 0 0 30px rgba(127, 227, 255, 0.5); }
.record { font-family: var(--mono); color: var(--tenue); font-size: 16px; min-height: 1em; }
.jugar { width: 128px; height: 128px; border-radius: 50%; border: 0; background: var(--cian); color: var(--fondo); font-size: 56px; box-shadow: 0 0 40px rgba(127, 227, 255, 0.55); display: grid; place-items: center; animation: respira 1.6s ease-in-out infinite; }
.jugar svg { width: 56px; height: 56px; margin-left: 8px; }
@keyframes respira { 50% { transform: scale(1.06); } }
#fin { background: rgba(7, 10, 18, 0.88); justify-content: flex-start; overflow-y: auto; }
#fin .titulo { font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; margin-top: 4px; }
#fin .titulo.escape { color: var(--verde); } #fin .titulo.muerte { color: var(--rojo); }
#causa { color: var(--tenue); font-size: 15px; text-align: center; max-width: 340px; min-height: 1.2em; }
#fin .numeros { font-family: var(--mono); font-weight: 700; font-size: 34px; }
#fin .numeros small { display: block; font-size: 14px; color: var(--tenue); text-align: center; }
#clip { height: min(38vh, 380px); aspect-ratio: 9 / 16; border-radius: 12px; background: #000; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.6); }
.fila { display: flex; gap: 12px; align-items: center; }
.unamas { min-width: 210px; height: 64px; border: 0; border-radius: 32px; background: var(--cian); color: var(--fondo); font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: 1px; box-shadow: 0 0 30px rgba(127, 227, 255, 0.45); }
.redondo { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(160, 180, 220, 0.35); background: rgba(18, 25, 44, 0.9); display: grid; place-items: center; font-size: 24px; font-weight: 800; }
.redondo:disabled { opacity: 0.4; }
.redondo.hecho { border-color: var(--verde); color: var(--verde); }
#compartir.cargando svg { animation: gira 1s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.redondo svg { width: 26px; height: 26px; }

#panel { background: rgba(7, 10, 18, 0.96); z-index: 5; justify-content: flex-start; user-select: text; -webkit-user-select: text; }
#panel pre { width: min(560px, 100%); max-height: 55vh; overflow: auto; font-family: var(--mono); font-size: 12px; background: #0B1122; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
#panel button { padding: 10px 16px; border-radius: 8px; border: 1px solid rgba(160, 180, 220, 0.35); background: #12192c; }
#fps { position: absolute; left: 8px; bottom: 8px; font-family: var(--mono); font-size: 12px; color: var(--verde); pointer-events: none; }
body[data-estado=jugando] #sonido, body[data-estado=cuenta] #sonido, body[data-estado=muriendo] #sonido { display: none; }
#sonido { position: absolute; top: calc(var(--st) + 14px); right: calc(var(--sr) + 14px); width: 44px; height: 44px; font-size: 20px; }
</style>
</head>
<body>
<div id="juego">
  <canvas id="lienzo" aria-label="La persecución en 3D"></canvas>
  <div id="vineta"></div>
  <div id="hud" hidden>
    <div class="arriba">
      <div id="golpes" aria-label="Golpes que aguantas"><i></i><i></i><i></i></div>
      <div id="marcador"><div id="puntos">0</div><div id="mult"></div></div>
    </div>
    <div id="progreso" aria-label="Hasta el túnel de salida"><b></b></div>
    <div id="velo"></div>
    <div id="aviso"></div>
    <div id="cuenta" hidden></div>
    <div id="patrullas"></div>
    <div id="guia" hidden>
      <svg class="mano" viewBox="0 0 64 64" aria-hidden="true"><path fill="#E8EDF7" stroke="#070A12" stroke-width="2" d="M26 6c3 0 5 2 5 5v18l2-1c3-1 6 0 7 3l1 1c3-1 6 0 7 3 3-1 6 1 6 4v10c0 8-6 13-14 13h-6c-5 0-8-2-11-6L12 42c-2-2-2-5 0-7s5-2 7 0l2 2V11c0-3 2-5 5-5z"/></svg>
      <div class="flechas">‹›</div>
      <div class="teclas" hidden><span>←</span><span>→</span></div>
    </div>
  </div>

  <div id="inicio" class="capa">
    <div class="logo" id="logo">FUGAZ</div>
    <button class="jugar" id="jugar" aria-label="Jugar"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 3l15 9-15 9z"/></svg></button>
    <div class="record" id="recordInicio"></div>
  </div>

  <div id="fin" class="capa" hidden>
    <div class="titulo" id="finTitulo"></div>
    <div id="causa"></div>
    <div class="numeros"><span id="finPuntos">0</span><small id="finRecord"></small></div>
    <canvas id="clip" width="405" height="720" aria-label="Repetición vertical"></canvas>
    <button class="unamas" id="unamas">UNA MÁS</button>
    <div class="fila">
      <button class="redondo" id="compartir" aria-label="Compartir el clip" disabled><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v6h14v-6"/></svg></button>
      <button class="redondo" id="queja" aria-label="No entiendo qué me mata">?</button>
    </div>
  </div>

  <div id="panel" class="capa" hidden>
    <div class="logo" style="font-size:40px">MÉTRICAS</div>
    <pre id="panelTexto"></pre>
    <div class="fila">
      <button id="exportar">Exportar JSON</button>
      <button id="copiar">Copiar</button>
      <button id="borrar">Borrar</button>
      <button id="cerrar">Cerrar</button>
    </div>
  </div>
  <button class="redondo" id="sonido" aria-label="Sonido">♪</button>
  <div id="fps" hidden></div>
</div>
<script src="../vendor/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
